e":"Image generation in multimodal chatbots","tags":["Built-in","Fast"],"shortDef":"Many multimodal chatbots such as ChatGPT, Gemini, or Copilot offer image generation directly in the chat, without a separate tool.","explain":"This built-in image generation is usually faster to use than a specialist tool, but often less finely controllable than dedicated image generators.","usefulFor":"Quick, simple visuals directly within an ongoing chat.","useCases":["Generating a simple icon or symbol image directly in the chat","Testing a rough image idea before using a specialist tool"],"example":"Generating a matching title image directly in the same chat where a slide-deck text is being drafted.","strengths":["No need to switch tools","Good starting point for initial image ideas"],"limitations":["Fine control is usually lower than with specialist tools like Midjourney"],"providers":"e.g. OpenAI, Google, Microsoft","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"m1":{"title":"Image generation in ChatGPT (\"Imagine\")","tags":["Built-in","OpenAI"],"shortDef":"The image feature built into ChatGPT — often simply called \"Imagine\" or \"Images\" by users — creates and edits images directly in the chat, including precise text rendering.","explain":"Newer versions of this feature (as of September 2026: ChatGPT Images 2.5) follow image instructions more accurately, keep details like faces and lighting more consistent during edits, and generate images considerably faster than earlier models.","usefulFor":"Quick image ideas, illustrations, and targeted image edits directly within an ongoing chat.","useCases":["Generating a title image directly in the chat where a text is being drafted","Making targeted changes to an uploaded photo, e.g. adjusting the background or colours","Adding legible, multilingual text to an existing graphic"],"example":"Generating a matching title image with correctly rendered lettering directly in the same chat where a slide-deck text is being drafted.","strengths":["No need to switch tools","Increasingly precise text rendering in multiple languages","Edits change only what's requested"],"limitations":["Results for complex compositions should be checked","Check usage rights per plan beforehand"],"providers":"OpenAI","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"m2":{"title":"Nano Banana (Gemini)","tags":["Google","Image editing"],"shortDef":"Google's native image generation and editing models within Gemini — informally called \"Nano Banana\" — known for precise text rendering and targeted, conversational image editing.","explain":"The models draw on Gemini's world knowledge to reliably render things like infographics, diagrams from handwritten notes, or multilingual captions, and can be refined further through follow-up chat instructions.","usefulFor":"Precise illustrations, infographics, and targeted image edits involving text elements.","useCases":["Turning handwritten notes into a clean, labelled diagram","Making targeted changes to an existing image, e.g. swapping the background or lighting","Generating an infographic with correctly rendered, multilingual text"],"example":"Turning a photo of a handwritten flip chart into a clean, labelled diagram for a slide.","strengths":["Very precise text rendering in multiple languages","Well suited to infographics, diagrams, and data-driven visuals"],"limitations":["Very complex compositions still need a content check, since world knowledge can be misapplied too","Images carry an invisible SynthID watermark as proof of AI origin"],"providers":"Google DeepMind","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"m3":{"title":"Imagine.art","tags":["Image & video","Creative suite"],"shortDef":"Creative suite for image and video generation with access to several models, avatar creation, background removal, and a node-based workflow builder.","explain":"Imagine.art is a standalone product by the provider Vyro — it is not the same as, and not the successor to, Leonardo.ai, even though the two names are sometimes confused. Its strength lies in bundling several image and video models, plus voice and music generation, under one interface.","usefulFor":"Teams that want to bundle image and video generation, plus simple post-processing, in a single subscription.","useCases":["Turning a photo into a short animated video","Comparing several image models for the same image idea","Assembling a concept storyboard from text and image building blocks"],"example":"Generating a still image for a campaign and then turning it into a short social-media video within the same tool.","strengths":["Bundles several image and video models in one interface","Node-based workflow builder for recurring production steps"],"limitations":["The large model selection can initially feel overwhelming for beginners","Usage rights vary by plan and underlying third-party model"],"providers":"Vyro LLC","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"m4":{"title":"Magnific (formerly Freepik)","tags":["Upscaling","Image quality"],"shortDef":"AI tool for increasing image resolution and detail (upscaling), enlarging existing images to a multiple of their original resolution while adding texture.","explain":"The well-known image upscaler Magnific is now part of the renamed platform Magnific (formerly Freepik) and offers a faithful mode for photos as well as a creative mode that plausibly adds missing detail.","usefulFor":"Upgrading low-resolution or AI-generated images for print, large displays, or professional reuse.","useCases":["Upscaling an AI-generated image for printing as a poster","Restoring an old, blurry photo at a higher resolution","Enlarging product photos for an online shop while keeping consistent quality"],"example":"Upscaling a title image created with an image generator to a high resolution before printing it as a poster.","strengths":["Noticeable detail gains even at strong magnification","Separate modes for faithful and creative enhancement"],"limitations":["Very aggressive settings can produce unnatural-looking detail","Always double-check the result before professional use"],"providers":"Magnific (formerly Freepik)","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"m5":{"title":"Renderforest","tags":["Video templates","Explainer videos"],"shortDef":"Platform for creating videos, logos, and simple websites that turns text or image input into finished clips using several AI video models and a large template library.","explain":"Renderforest combines a classic, template-based video editor with AI features such as text-to-video, image-to-video animation, and automatic voiceovers in more than 50 languages.","usefulFor":"Explainer videos, course intros, and social-media clips without classic video production.","useCases":["Automatically generating an explainer video with voiceover from a script","Turning a still image into a short, animated intro for an online event","Assembling an existing presentation video from a template"],"example":"Automatically generating a short explainer video with voiceover from the key points of a course concept, for the course announcement.","strengths":["Very large template library","Automatic, multilingual voiceover generation"],"limitations":["Free use is limited to short, watermarked videos","Check subscription prices for higher resolutions and longer videos beforehand"],"providers":"Renderforest","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"m6":{"title":"invideo.io","tags":["Text-to-video","Script-based"],"shortDef":"AI video platform that automatically assembles a complete video with scenes, voiceover, and music from a text description, script, or topic.","explain":"invideo.io is designed for a simple, script-based entry point: a short description produces a rough cut, which can then be refined in the built-in editor.","usefulFor":"Quick first video drafts from a topic description, without any of your own footage.","useCases":["Automatically generating a first video draft from a topic description","Turning an existing script into a video with matching scenes and voiceover","Generating short videos in the right aspect ratio for different platforms"],"example":"Automatically generating a first video draft with voiceover from a short topic description for a course offering.","strengths":["Simple, script-based entry point even without prior experience","Good starting point for quick social-media formats"],"limitations":["Polish and brand consistency usually require rework in the editor","Check usage limits per subscription tier beforehand"],"providers":"invideo Inc.","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"f1":{"title":"Text and writing","tags":["Drafting","Revising"],"shortDef":"The core function of every chatbot: drafting, rewording, shortening, and adjusting texts in tone and style.","explain":"This function differs from \"normal chat\" only in degree — it refers to deliberately using the chat for text products such as emails, reports, or concepts.","usefulFor":"Everyday writing tasks of all kinds.","useCases":["Drafting an email in a specific tone","Cutting a long text in half","Translating a technical text for an audience without prior knowledge"],"example":"Turning an internal status report into a short, generally understandable summary for the leadership level.","strengths":["Very broadly applicable","Available immediately without any add-on feature"],"limitations":["Results should always be checked for factual accuracy"],"providers":"All major multimodal chatbots"},"f2":{"title":"Analysing documents and PDFs","tags":["PDF","Summary"],"shortDef":"Having uploaded documents read, summarised, and queried in a targeted way, instead of reading them yourself in full.","explain":"This function differs from normal chat in that the chatbot draws on the actual content of an uploaded file, rather than only general knowledge.","usefulFor":"Long reports, studies, or contracts from which specific information needs to be extracted.","useCases":["Having a long PDF summarised in a few sentences","Asking specifically about a particular clause in a contract","Comparing several documents for contradictions"],"example":"Uploading a 40-page Erasmus+ handbook and asking specifically about the rules on mobility grants.","strengths":["Saves considerable reading time on long documents"],"limitations":["Context can get lost with very long or unstructured documents — spot-checking is advisable"],"providers":"All major multimodal chatbots"},"f3":{"title":"Analysing tables and data","tags":["Excel","Analysis"],"shortDef":"Having uploaded tables analysed, patterns identified, and charts or formulas suggested.","explain":"Some chatbots can run code in the background for this, delivering more reliable calculations than a purely text-based explanation.","usefulFor":"Initial analyses and plausibility checks on manageable amounts of data.","useCases":["Analysing a participant list by course location","Summarising a simple cost overview","Generating a chart from an uploaded table"],"example":"Grouping an uploaded invoice overview by location and month and displaying it as a chart.","strengths":["Quick initial analyses without doing your own formula work"],"limitations":["For sensitive or very large datasets, checking the calculations and the privacy aspects is advisable"],"providers":"All major multimodal chatbots"},"f4":{"title":"Understanding images","tags":["Image analysis"],"shortDef":"Describing an uploaded image, recognising its contents, or extracting text from it.","explain":"This function lets you discuss photos, screenshots, or diagrams directly in the chat, for instance to explain content or extract text.","usefulFor":"Quick analysis of screenshots, photos, or scanned documents.","useCases":["Extracting text from a photo of a flip chart","Explaining a chart from a presentation","Interpreting a screenshot of an error message"],"example":"Uploading a photo of a handwritten flip-chart result and turning it into structured text.","strengths":["Practical for quickly digitising analogue results"],"limitations":["Handwriting and blurry images can cause errors"],"providers":"All major multimodal chatbots"},"f5":{"title":"Creating and editing images","tags":["Image generation"],"shortDef":"Generating images directly in the chat from a description, or making targeted changes to an uploaded image.","explain":"Unlike normal chat, the result here is visual rather than textual — useful for quick illustrations without a separate graphics program.","usefulFor":"Quick visuals, title images, or illustrations without graphic-design skills.","useCases":["Generating a title image for a presentation","Regenerating an existing image in a different style","Creating a simple icon set for a slide"],"example":"Generating a neutral symbol image on \"resource prioritisation\" for a strategy-retreat slide.","strengths":["No separate graphics program needed"],"limitations":["Precise text rendering in images remains error-prone","Check usage rights per provider and plan"],"providers":"e.g. OpenAI, Google, Anthropic (availability varies by platform)","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"f6":{"title":"Speech and audio","tags":["Voice input/output"],"shortDef":"Converting spoken language into text, or having text read aloud — for hands-free use or accessibility.","explain":"This function is especially useful on the go or when longer answers should be listened to rather than read.","usefulFor":"Hands-free use, accessible use, listening to longer summaries.","useCases":["Entering an idea by voice while on the go","Having a long answer read aloud","Generating a transcript from a voice recording"],"example":"Dictating an idea for a workshop concept by voice while driving and refining it as text later.","strengths":["Practical on the go and for accessibility"],"limitations":["Recognition accuracy can vary with technical terms or dialects"],"providers":"All major multimodal chatbots (app feature)","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"f7":{"title":"Music and video","tags":["Video generation"],"shortDef":"Generating short video clips or music tracks directly from a text description.","explain":"This function is still more actively evolving technically than text or image functions and, so far, mostly delivers short, simple results.","usefulFor":"Short explainer or mood videos, individual music underlays.","useCases":["Generating a short explainer clip for a simple concept","Generating an individual tune for an event"],"example":"Generating a few-second, atmospheric video clip as the opening for an online session.","strengths":["Enables creative experiments without video-editing skills"],"limitations":["Quality and length still limited so far — check usage rights beforehand"],"providers":"e.g. Google, OpenAI (availability varies by platform)","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"f8":{"title":"Web search","tags":["Currency"],"shortDef":"The chatbot retrieves current information from the web instead of relying only on trained knowledge with a fixed cutoff date.","explain":"This function matters for anything that may have changed since the model's training cutoff — for instance current events, people in office, or product versions.","usefulFor":"Current events, changing facts, day-to-day information.","useCases":["Looking up current funding guidelines","Researching the current state of a legal change","Getting current news on a topic"],"example":"Researching the current state of Erasmus+ funding guidelines for the ongoing programme year.","strengths":["Overcomes the model's fixed knowledge cutoff"],"limitations":["Quality depends on the quality of the sources found — check citations"],"providers":"All major multimodal chatbots","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"f9":{"title":"Deep research","tags":["Multi-step research"],"shortDef":"A mode in which the chatbot independently runs several search steps and combines the results into a longer, source-based report.","explain":"Unlike a simple web search, this mode plans the multi-step research itself — including follow-up questions, several search rounds, and a structured synthesis.","usefulFor":"More extensive research questions with several sub-aspects.","useCases":["Creating a market overview of a new subject area","Bundling several studies and sources on a question"],"example":"Creating a structured overview of current developments in AI-supported professional development formats.","strengths":["Considerably more thorough than a single search query"],"limitations":["Takes more time than a simple web search","Result still needs checking"],"providers":"e.g. OpenAI, Google, Anthropic (naming varies by provider)","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"f10":{"title":"Canvas and workspace modes","tags":["Shared document"],"shortDef":"A separate, editable document alongside the chat history, in which individual sections can be revised in a targeted way.","explain":"Unlike normal chat, where every new answer reproduces the whole text again, a document persists here that you keep working on in a targeted way.","usefulFor":"Longer texts or concepts that get refined over several steps.","useCases":["Revising individual paragraphs of a concept draft in a targeted way","Having a document proofread jointly with the AI"],"example":"Setting up a workshop concept in a workspace and refining it section by section, without regenerating the whole text each time.","strengths":["Clearer than long chat histories for text work"],"limitations":["Not available under the same name or to the same extent with every provider"],"providers":"e.g. OpenAI (Canvas), Anthropic (Artifacts)","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"f11":{"title":"Projects and project folders","tags":["Bundling context"],"shortDef":"A dedicated workspace where files, instructions, and chat histories on a topic are bundled together permanently.","explain":"Unlike a single chat, the context here doesn't need to be re-supplied every time — it remains available permanently.","usefulFor":"Recurring topics with consistent background knowledge, such as an ongoing course format or a client project.","useCases":["Bundling all materials for a course format in one place","Permanently storing fixed instructions for a particular writing style"],"example":"Setting up a project for a recurring workshop format that permanently stores corporate-design guidelines and previous slide decks.","strengths":["No need to re-explain context every time","Produces more consistent results over time"],"limitations":["For sensitive content, deliberate handling of sharing and visibility is advisable"],"providers":"e.g. OpenAI (Projects), Anthropic (Projects)","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"f12":{"title":"Libraries and knowledge collections","tags":["Own sources"],"shortDef":"A permanent collection of your own documents that the chatbot can draw on specifically, rather than relying only on general knowledge.","explain":"This function overlaps with Projects but focuses more on a pure source collection that is queried in a targeted way.","usefulFor":"Subject areas with a clearly defined, growing document collection.","useCases":["Collecting all studies on a research topic in one place","Making a growing collection of course materials queryable in a targeted way"],"example":"Storing all previous handouts for a recurring seminar topic in a collection and querying them specifically.","strengths":["Answers stay traceable to the stored sources"],"limitations":["Requires upkeep so that outdated documents don't lead to outdated answers"],"providers":"e.g. Google NotebookLM, provider-specific knowledge collections","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"f13":{"title":"Container assistants: GPTs, Gems & agents","tags":["Knowledge","Limits","Working instructions"],"shortDef":"A self-built \"container\" around the chat: uploaded knowledge, clearly set limits, and fixed working instructions in the background — set up once, reusable again and again.","explain":"The container image describes what every provider offers under different names: custom GPTs in ChatGPT, Gems in Gemini, agents in Vibe (Mistral), and projects with instructions in Claude. Three building blocks frame and steer the chat: (1) knowledge that is uploaded and that the assistant relies on, (2) limits on what it should and should not do, and (3) the working instructions that run invisibly in every conversation. This is the first level of automation: context no longer has to be re-explained in every chat.","usefulFor":"Clearly defined, recurring tasks that should always be handled on the same basis and in the same style — including by several people.","useCases":["Building an assistant that answers participant queries consistently, based on stored FAQs","Setting up an assistant with corporate-design guidelines for slide-deck drafts","Building a feedback assistant that answers only on the basis of a stored competency model"],"example":"A Gem called \"Course enquiries\" gets the course descriptions as knowledge, the limit \"no commitments on prices or dates that are not in the knowledge\", and the working instruction \"answer politely, in English, in at most 150 words\".","strengths":["Standardises recurring tasks","Can be shared across a team","No technical background needed"],"limitations":["Stays tied to its container — every new task needs its own assistant","Uploaded knowledge must be maintained, otherwise answers go out of date"],"providers":"OpenAI (custom GPTs), Google (Gems), Mistral (agents in Vibe), Anthropic (projects)","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time.","mistakes":["Forgetting the limits: without them, the assistant fills missing knowledge with guesses","Packing too many different tasks into a single container"]},"f14":{"title":"Agents and automations","tags":["Autonomy","Multi-step"],"shortDef":"A mode in which the AI independently plans and carries out several steps of a task, instead of waiting for a new instruction after each step.","explain":"Unlike normal chat, the AI makes intermediate decisions itself here — for instance which source to check next — which calls for more attentive oversight.","usefulFor":"Multi-step tasks with a clearly defined goal and a checkable result.","useCases":["Having a multi-step research task carried out independently","Having several files processed in a defined order"],"example":"Having a series of participant records processed independently according to a fixed scheme, with a final check by the user.","strengths":["Reduces manual intermediate effort for clearly defined workflows"],"limitations":["Requires a clear task definition and a final human check","Extra caution needed around permissions with sensitive data"],"providers":"e.g. Anthropic (Cowork), OpenAI (agent modes)","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"f15":{"title":"Automated workflows","tags":["Chaining","Triggers"],"shortDef":"Automatically running recurring tasks via fixed triggers and chained steps, often via additional automation tools.","explain":"This function goes beyond individual chat requests: a trigger — such as a new email or a new spreadsheet row — automatically starts a chain of AI-supported steps.","usefulFor":"Regularly recurring workflows with a clearly defined trigger.","useCases":["Automatically drafting a confirmation email whenever a new course registration comes in","Automating regular data reconciliation between two systems"],"example":"Automatically generating a draft attendance confirmation whenever a new entry appears in a registration table.","strengths":["Saves considerable time on recurring workflows"],"limitations":["Requires careful setup and regular checks so errors don't propagate automatically"],"providers":"e.g. Make.com combined with AI services","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"c1":{"title":"Cowork in Claude","tags":["Files","Agent-like"],"shortDef":"A work mode by Anthropic in which Claude independently carries out multi-step, file-based tasks — from research to a finished file.","explain":"Unlike normal chat, Cowork can work across several tools and steps, such as reading, editing, and creating files, with confirmation at critical steps.","usefulFor":"More extensive, multi-step assignments involving several files.","useCases":["Reviewing several documents of a project and producing a summary report from them","Renaming and sorting a series of files according to a fixed scheme"],"example":"Reviewing all invoice documents for a course location and producing a structured billing overview as a file.","strengths":["Handles multi-step tasks without every single step needing to be triggered manually"],"limitations":["Requires a clear task definition and a final check, especially for sensitive documents"],"providers":"Anthropic","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"c2":{"title":"Work and agent features in ChatGPT","tags":["Comparable mode"],"shortDef":"Comparable multi-step, agent-like work modes at OpenAI, with access to files, the web, and further tools.","explain":"Here too: tasks are handled independently across several steps, with confirmation points for consequential actions.","usefulFor":"Comparable multi-step tasks within the OpenAI environment.","useCases":["Running multi-step research followed by document creation"],"example":"Researching a market overview and summarising the results directly in a structured document.","strengths":["Reduces manual intermediate effort for clearly defined tasks"],"limitations":["As with all agent modes: a final human check is necessary"],"providers":"OpenAI","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"c3":{"title":"Desktop apps","tags":["Local access"],"shortDef":"Standalone applications on your own computer that can work with local files, folders, and other programs more directly than a pure browser interface.","explain":"Unlike the web interface in a browser, a desktop app often allows more direct access to local files and other open programs.","usefulFor":"Work where direct access to local files and folders makes the process easier.","useCases":["Working directly with files in your own file system, without uploading them individually"],"example":"Browsing and editing a local folder structure of course materials directly via the desktop app.","strengths":["Closer integration with your own file system and other local programs"],"limitations":["Requires installation and deliberate granting of access rights"],"providers":"e.g. Anthropic, OpenAI (each with its own desktop application)","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"c4":{"title":"Working with local files and folders","tags":["File access"],"shortDef":"A work mode in which the AI accesses an existing local folder structure directly, instead of uploading individual files manually.","explain":"This makes tasks involving several related files easier, but requires a deliberate decision about which folder gets shared.","usefulFor":"Tasks involving many related files, such as an entire project folder.","useCases":["Having all files in a course folder reviewed in one pass","Renaming an existing folder structure according to a consistent scheme"],"example":"Reviewing a folder of old slide decks and assembling the relevant content for a new presentation.","strengths":["Efficient for tasks involving many related files"],"limitations":["Requires a deliberate decision about which folders and files are shared, especially for confidential content"],"providers":"e.g. Anthropic, OpenAI (each with its own implementation)","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"c5":{"title":"Multi-step, agent-like tasks","tags":["No intermediate prompts"],"shortDef":"Tasks where the AI independently plans and carries out several consecutive steps, instead of waiting for a new instruction after each one.","explain":"The difference from normal chat lies in the independence between steps — the user mainly steers at the start and the end, rather than triggering every intermediate step individually.","usefulFor":"Clearly defined workflows with several sub-steps and a checkable end result.","useCases":["Processing a series of documents in a fixed sequence","Running multi-step research followed by a summary"],"example":"Running a sequence of data checking, summarising, and creating a handover document in one pass.","strengths":["Reduces the number of manual intermediate steps for recurring workflows"],"limitations":["Requires a clear task definition, otherwise errors can propagate across several steps"],"providers":"Model-independent, naming varies by provider","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"c6":{"title":"Permissions and access grants","tags":["Control","Access"],"shortDef":"Before an agent or Cowork mode accesses files, folders, or external services, that access must be deliberately granted.","explain":"These permissions determine what the AI may read, change, or send. They should be kept as narrow as possible and revoked again when no longer needed.","usefulFor":"Any use of agent or Cowork modes with access to real files or services.","useCases":["Checking beforehand which folder actually needs to be shared for a task","Revoking access again once a task is complete, if no longer needed"],"example":"Sharing only the relevant subfolder for a one-off analysis, instead of the entire drive.","strengths":["Deliberate handling of permissions considerably reduces the risk of unwanted access"],"limitations":["Requires some familiarity with the sharing settings of the tool in use"],"providers":"Model-independent"},"c7":{"title":"Privacy and user control","tags":["GDPR","Sensitive data"],"shortDef":"For sensitive or personal data, users should deliberately decide what is shared with an AI system and what isn't.","explain":"Not every task requires access to complete, unanonymised datasets — anonymised excerpts, or work without uploading sensitive original files, are often sufficient.","usefulFor":"Any task involving personal, contractual, or otherwise sensitive data.","useCases":["Checking beforehand whether an anonymised version is sufficient","Clarifying where uploaded data is processed and stored"],"example":"Uploading a participant list without names and contact details for a pattern analysis, instead of the full original file.","strengths":["Significantly reduces risk when working with sensitive information"],"limitations":["Requires some extra effort for anonymisation or data checks beforehand"],"providers":"Model-independent"},"c8":{"title":"Chat, project, container assistant, skill, and agent compared","tags":["Orientation","Choice"],"shortDef":"Five work modes with increasing independence: the single chat, the project with persistent context, the container assistant, the flexibly callable skill, and the agent or Cowork mode that acts on its own.","explain":"The more independence a mode has, the more useful it is for recurring or extensive tasks — but the more care is needed around permissions and oversight.","usefulFor":"Deciding which mode is appropriate for a specific task.","useCases":["A normal chat is enough for a one-off, simple question","A project or container assistant suits a recurring topic with stable context","A skill suits recurring workflows needed across many chats","An agent or Cowork suits multi-step, file-based tasks involving other tools"],"example":"Clarifying a one-off text question in normal chat, but bundling a recurring course format in a project instead.","strengths":["Helps choose the right, not over-sized, mode for each task"],"limitations":["The boundaries between modes keep shifting as providers develop further"],"providers":"Model-independent","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"t18":{"title":"Qwen","tags":["China","Open source","Free"],"shortDef":"Multimodal chatbot and model family by the Chinese group Alibaba — free to use via Qwen Chat, with many models open and usable locally.","explain":"Qwen ranges from very small models for single devices up to large frontier models (as of September 2026: Qwen3.8-Max; Qwen 4 has been announced). The Qwen Chat web app understands text, images, and documents and is free. Many Qwen models are under an open licence and can run on your own computer — in that case, data never leaves your device.","usefulFor":"Trying out a powerful chatbot for free and — for the technically inclined — running it locally without the cloud.","useCases":["Using a free second chatbot to compare answers","Running an open Qwen model locally, e.g. for texts that should stay in-house","Understanding or translating Chinese-language content"],"example":"Asking ChatGPT and Qwen the same question in parallel and comparing the answers to spot the strengths and blind spots of both models.","strengths":["Free to use","Open models allow local operation","Strong performance relative to cost"],"limitations":["With Qwen Chat in the browser, data is processed on Alibaba servers — check before using it for work or sensitive content","As a Chinese provider, it operates under different regulatory frameworks, which can show up on politically sensitive topics"],"mistakes":["Confusing the web version with local operation: data stays on your own device only when run locally"],"providers":"Alibaba Cloud (Qwen Chat, open models)","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"f16":{"title":"Memory: what the chatbot remembers","tags":["Personalisation","Context","Privacy"],"shortDef":"With the memory feature, the chatbot remembers information about you and your work beyond individual conversations — such as your role, ongoing projects, or preferred formats.","explain":"Without memory, every chat starts from zero. With memory, the chatbot can draw on earlier conversations or use saved facts, so answers fit you better. Depending on the provider, saved memories can be viewed, edited, and deleted, earlier chats can be searched, or memory can be switched off entirely. Memory differs from a project: memory applies to you in general, a project only to one topic.","usefulFor":"Regular everyday use where you do not want to re-explain your role, context, and preferences every time.","useCases":["Telling the chatbot your role, audiences, and writing style once and benefiting permanently","Picking up a conversation from last week without pasting everything again","Setting preferences, e.g. \"always give me a short summary first\""],"example":"Saying once \"I train leaders in universities; please write without anglicisms\" — future drafts take this into account automatically.","strengths":["Saves repeated explanations","Answers become more personal and better targeted"],"limitations":["Saved information can go out of date or be wrong and should be checked occasionally","Sensitive data does not belong in memory — for confidential topics, use a temporary chat without memory"],"mistakes":["Not knowing what is stored: review and tidy saved memories regularly","Mentioning confidential client data in passing, which then gets stored permanently"],"providers":"e.g. OpenAI, Anthropic, Google (scope and settings vary by provider)","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"a1":{"title":"Skills: instructions you can call up in any chat","tags":["Flexible","Knowledge & limits","Connectors"],"shortDef":"A skill is an extensive, saved set of instructions — with working instructions, content, knowledge, limits, and access to other tools where needed — that the chatbot can call up in any chat.","explain":"While a container assistant permanently frames a single chat, a skill is a new kind of flexibility: it waits in the background and is loaded as soon as a task fits or you call it directly — in any chat, even in the middle of an ongoing conversation. A skill can contain templates, examples, logos, or scripts and can drive other tools via connectors, for example saving a file to storage or creating an email draft. Several skills can be combined in one task.","usefulFor":"Recurring workflows with fixed quality standards that are needed in very different conversations.","useCases":["A skill for certificates of attendance in your own design that pulls data from a spreadsheet","An \"email reply\" skill containing templates, tone, and limits that creates a draft in the mailbox","A branding skill that automatically styles every document in the corporate design"],"example":"In the chat, this is enough: \"Create the certificates for the Valencia course.\" The skill knows the template, logo, and required details, reads the participant list via a connector, and delivers finished PDFs.","strengths":["Available in every chat, not tied to a container","Bundles knowledge, templates, limits, and tools in one place","Ensures consistent quality for recurring tasks"],"limitations":["Requires careful drafting and testing at first","Skills that drive other tools need suitable permissions — check results before sending"],"mistakes":["Describing a skill too vaguely, so it is not reliably loaded at the right moment","Never revising skills even though templates or processes have changed"],"providers":"Anthropic (Claude Skills); comparable approaches are emerging at other providers","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"a2":{"title":"Artifacts & sites: HTML as automation and visualisation","tags":["HTML","Interactive","Shareable"],"shortDef":"The chatbot produces finished, interactive web pages — overviews, calculators, quizzes, reference guides — that can be shared via a link and reused.","explain":"A description in the chat becomes a standalone HTML page: an artifact in Claude, a site in ChatGPT, or via Canvas in Gemini. This is visualisation (content is presented vividly) and automation (once built, the page performs a task again and again, such as a calculation or a query) at the same time. This reference guide is itself an example.","usefulFor":"Content that should be reused, shared, or explored interactively — without being able to code.","useCases":["An interactive reference guide as workshop documentation instead of a slide deck","A small calculator, e.g. for funding amounts or scheduling","A quiz or self-assessment for participants"],"example":"\"Build me a page where participants assess their leadership styles with a self-test and see an evaluation at the end.\" Result: a finished, shareable web page.","strengths":["No coding skills needed","Instantly shareable and reusable","Combines content and clarity"],"limitations":["Test content and calculation logic before sharing","Whether a shared link stays the same after changes depends on the provider and publishing route"],"mistakes":["Asking for too much at once instead of building the page step by step"],"providers":"Anthropic (artifacts), OpenAI (Sites, Canvas), Google (Canvas)","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"a3":{"title":"The automation ladder","tags":["Orientation","Overview"],"shortDef":"Automation with AI can be thought of as a ladder with four levels: container assistant, skill, artifact or site, and automated workflow — each level takes more work off your hands.","explain":"Level 1, the container assistant, frames a chat with knowledge, limits, and working instructions. Level 2, the skill, makes such instructions callable in any chat and can drive other tools. Level 3, the artifact, turns a result into a reusable tool for others. Level 4, the workflow, runs via triggers without any chat at all. Not every task needs the top level: the higher you go, the more setup effort and the more important oversight becomes.","usefulFor":"Deciding how much automation makes sense for a specific task.","useCases":["Answering course enquiries consistently → container assistant","Creating and filing certificates in any chat → skill","Giving participants a self-test tool → artifact","Automatically confirming every new registration → workflow"],"example":"In a workshop, carry out the same task — e.g. analysing participant feedback — first in a normal chat, then as a container assistant, and finally as a skill, and experience the difference.","strengths":["Creates orientation among many product names","Helps weigh effort against benefit"],"limitations":["The boundaries between levels blur because providers keep extending their features"],"providers":"Across providers"},"k1":{"title":"Connectors: linking the AI with other tools","tags":["MCP","Email & calendar","Storage"],"shortDef":"Connectors link the chatbot with other applications — email, calendar, cloud storage, spreadsheets, project tools — so it can read information there and, with permission, act as well.","explain":"Without a connector, the chatbot only knows what you paste into the chat. With a connector, it can search the mailbox for a message, check appointments, read files from storage, or create a draft. Technically, an open standard is increasingly used for this, the Model Context Protocol (MCP); in ChatGPT these links are called plugins. Connectors are the foundation that lets skills and agents work with real work data.","usefulFor":"Tasks that bring together information from several tools or should get something done there directly.","useCases":["\"Summarise all emails about course X from last week\"","Finding a free slot for a preliminary meeting","Reading and analysing a participant list from cloud storage"],"example":"\"Which enquiries about my courses came in this week, and which are still unanswered?\" — the chatbot searches the mailbox via the connector and lists the open items.","strengths":["No more copying between applications","Foundation for skills and agents"],"limitations":["The chatbot gains access to real, often confidential data — grant permissions deliberately and sparingly","Always confirm actions such as sending or deleting beforehand"],"mistakes":["Activating every available connector even though only one is needed"],"providers":"Anthropic (connectors/MCP), OpenAI (plugins), Google (connected apps), Mistral","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"v1":{"title":"ElevenLabs","tags":["Text-to-speech","Voices","Voiceover"],"shortDef":"Specialist provider of AI voices: turning text into very natural-sounding speech, designing or cloning voices, and dubbing videos into other languages.","explain":"ElevenLabs is considered one of the leading providers of synthetic speech. Text becomes voice recordings in many languages and voice types; your own voice can be recreated — with consent. There are also features for multilingual dubbing, sound effects, and talking assistants.","usefulFor":"Professional voiceovers without a studio: explainer videos, e-learning, audio versions, multilingual content.","useCases":["Voicing an explainer video for a course","Creating an audio version of a handout","Dubbing an existing video into English or Spanish"],"example":"Paste the text of a course intro, choose a suitable voice, and place the audio file directly under a video made with Renderforest.","strengths":["Very natural-sounding voices","Many languages","Easy to use"],"limitations":["Only clone real people's voices with their explicit consent","Check usage rights and commercial use per plan"],"mistakes":["Publishing voiced texts unchecked — verify the pronunciation of names and technical terms"],"providers":"ElevenLabs","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"v2":{"title":"NotebookLM: podcasts & video overviews from your own sources","tags":["Podcast","Own sources","Learning"],"shortDef":"NotebookLM automatically turns uploaded documents into a podcast-style conversation between two AI voices, as well as short video overviews.","explain":"The audio overview summarises your own sources as a relaxed dialogue — listenable on the go, in English or other languages too. The content stays tied to the uploaded sources. The video overview presents the same content as a short explainer video with slides.","usefulFor":"Learning and follow-up, especially for people who prefer listening to reading.","useCases":["Workshop materials as a podcast for participants to review afterwards","Listening to a long study while commuting","Preparing an introduction to a new topic as audio"],"example":"Upload all slides and handouts of a workshop and generate a ten-minute audio overview that participants can listen to after the course.","strengths":["Free to use","Closely tied to your own sources","Very low barrier to entry"],"limitations":["The conversational format simplifies and can shift emphasis — spot-check the content","Voices and style can only be controlled to a limited extent"],"mistakes":["Passing on the podcast as a verified summary without having listened to it yourself"],"providers":"Google (NotebookLM)","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"t19":{"title":"SciSpace","tags":["Science","Research agent","Prompt builder"],"shortDef":"A very extensive research platform covering the entire chain of academic work — from literature search through analysis, data extraction, and visualisation to a cited draft. Easy to get into, but with great depth.","explain":"At its core is the SciSpace agent, which works through multi-step research tasks on its own, drawing on numerous specialised tools and sources. Getting started is deliberately easy: a builder on the start page lets you assemble an assignment from buttons — the goal (e.g. report, literature overview), the tool or source (e.g. Deep Research, PubMed), and the output format (e.g. Word, PDF) — and SciSpace writes the prompt. Its real strength, however, lies in depth: deep-review searches across very many sources, systematic reviews with documented search steps, extraction of study data into tables, visualisation of results, chatting with individual papers, writing with citations, and checking tools such as an AI detector and AI-assisted peer review. This takes SciSpace well beyond Elicit, which stops at search, extraction, and synthesis.","usefulFor":"Demanding academic research and writing projects in which literature work, analysis, visualisation, and text production come together in one environment.","useCases":["\"Write a report\" + \"Deep Research\" + \"Word document\": from research assignment straight to a cited report draft","\"Literature overview\" + \"PubMed\" + \"PDF report\" as a solid entry point into a biomedical topic","Extracting study data from many papers into a comparison table and visualising the results","Having your own manuscript draft checked by AI peer review and the AI detector before submission"],"example":"Click literature overview, PubMed, and PDF report and add the topic \"resilience of early-career researchers\": the agent researches, analyses the hits, compares key findings in a table, and delivers a PDF report with sources that can then be edited further in the same tool.","strengths":["Covers the entire chain from search to draft","Great depth in analysis, visualisation, and working with sources","Despite its scope, an easy entry point via the prompt builder"],"limitations":["The agent runs on a credit system; larger assignments use more of it","AI detectors give probabilities, not proof — never use their results as the sole basis for assessments","Agent-based research does not replace a reproducible systematic literature review to disciplinary standards","The wide range of features takes time to learn in order to use it fully"],"mistakes":["Adopting the finished report unchecked without looking at the cited sources yourself"],"providers":"SciSpace","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"t20":{"title":"Elicit, SciSpace, or Consensus? A decision guide","tags":["Comparison","Disciplines","Orientation"],"shortDef":"The three academic research tools overlap but have clearly different strengths — depending on the phase of work, the type of question, and the discipline.","explain":"Rule of thumb by phase: Consensus for a quick, evidence-based answer to a focused empirical question — with a \"Consensus Meter\" showing how much the studies agree, and filters for journal quality. Elicit for systematic work: structured screening with inclusion and exclusion criteria and precise data extraction across many studies — but it stops at synthesis and does not write texts. SciSpace for broad, exploratory research and the entire chain up to a draft, plus in-depth reading of individual papers. By discipline: all three focus on empirical, English-language journal literature and are strongest in medicine and the life and natural sciences; the social sciences are covered moderately, the humanities, law, and parts of engineering considerably less. Consensus works best for yes/no questions and struggles with contradictory evidence.","usefulFor":"Choosing the tool for a specific search — and judging when AI tools reach their limits.","useCases":["Medicine/health, \"Does intervention X work?\" → Consensus for a quick overview, Elicit for systematic analysis","Psychology/education research, literature overview for a grant proposal → SciSpace for the broad search and draft, Elicit for the data table","Systematic review with documentation requirements → Elicit as an aid, complemented by classic subject databases","Humanities or law, theoretical questions → library catalogues and subject databases first; AI tools at most as a supplement, e.g. NotebookLM with your own sources"],"example":"For a proposal on early-career support: use Consensus to check how robust the evidence on mentoring effects is, Elicit to analyse the key studies in a table, and SciSpace to turn this into a cited overview draft.","strengths":["Creates orientation between tools that seem similar","Makes the disciplinary imbalance of the databases visible"],"limitations":["Comparisons and benchmarks often come from the providers themselves and should be read with caution","Features and databases change constantly"],"mistakes":["Concluding from an empty result list that there is no research — often coverage is simply missing","Overlooking books, edited volumes, and non-English literature because the tools barely cover them"],"providers":"Across providers","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}};

  view:'home',           // home | subcats | entries | search
  mainId:null,
  subId:null,
  drawerEntry:null,
  lastFocusedTile:null,
  searchQuery:'',
  levelFilter:null,
  lang:'de'              // 'de' | 'en'
};

const $app = document.getElementById('app');

function S(key){ return (STRINGS[state.lang] && STRINGS[state.lang][key]) || STRINGS.de[key] || key; }
function L(entry, field){
  if(state.lang==='en'){
    const ov = ENTRIES_EN[entry.id];
    if(ov && ov[field]!==undefined) return ov[field];
  }
  return entry[field];
}
function LM(mc, field){
  if(state.lang==='en'){
    const ov = MAIN_CATS_EN[mc.id];
    if(ov && ov[field]!==undefined) return ov[field];
  }
  return mc[field];
}
function LSub(sc, mainId, field){
  if(state.lang==='en'){
    const ov = (SUB_CATS_EN[mainId]||{})[sc.id];
    if(ov && ov[field]!==undefined) return ov[field];
  }
  return sc[field];
}
function levelLabel(code){
  if(!code) return '';
  return (LEVEL_LABELS[state.lang] && LEVEL_LABELS[state.lang][code]) || code;
}

const SORT_OVERRIDES = {
  'tools:multimodal': ['t1','t3','t2','t17','t4','t15','t18','t16'],
  'automation:container': ['f13','f11'],
  'cowork:agenten': ['c1','c2','f14','c5'],
  'media:stimme': ['v1','v2','t11'],
  'tools:recherche': ['t5','t6','t7','t19','t8','t20','t14']
};

function entriesFor(mainId, subId){
  let list = ENTRIES.filter(e=>{
    const inMain = e.main===mainId || (e.secondary||[]).includes(mainId);
    if(!inMain) return false;
    if(subId) return e.sub===subId || (e.altSub||[]).includes(subId);
    return true;
  });
  if(subId){
    const order = SORT_OVERRIDES[mainId+':'+subId];
    if(order){
      list = list.slice().sort((a,b)=>{
        const ia = order.indexOf(a.id), ib = order.indexOf(b.id);
        const ra = ia===-1 ? Infinity : ia, rb = ib===-1 ? Infinity : ib;
        return ra-rb;
      });
    }
  }
  return list;
}
function countFor(mainId, subId){ return entriesFor(mainId, subId).length; }
function mainCat(id){ return MAIN_CATS.find(m=>m.id===id); }
function subCat(mainId, subId){ return (SUB_CATS[mainId]||[]).find(s=>s.id===subId); }
function entryById(id){ return ENTRIES.find(e=>e.id===id); }

function render(){
  document.documentElement.lang = state.lang;
  document.title = state.lang==='en' ? 'AI Knowledge Hub — Reference' : 'KI-Wissensartefakt — Nachschlagewerk';
  $app.innerHTML = `
    ${renderHeader()}
    ${renderCrumbs()}
    <main id="main-region">${renderMain()}</main>
    ${renderDrawerMarkup()}
    ${renderFooter()}
  `;
  bindGlobalEvents();
  if(state.drawerEntry){ requestAnimationFrame(openDrawerAnim); }
}

function renderCrumbs(){
  let parts = [`<button data-nav="home">${S('breadcrumbStart')}</button>`];
  if(state.view==='search'){
    parts.push(`<span class="sep">›</span><span class="current">${S('breadcrumbSearchResults')}</span>`);
  } else if(state.mainId){
    const mc = mainCat(state.mainId);
    parts.push(`<span class="sep">›</span>`);
    if(state.view==='subcats'){
      parts.push(`<span class="current"><span class="dot" style="background:var(--${mc.color})"></span>${LM(mc,'name')}</span>`);
    } else {
      parts.push(`<button data-nav="subcats" data-main="${mc.id}"><span class="dot" style="background:var(--${mc.color})"></span>${LM(mc,'name')}</button>`);
    }
    if(state.subId){
      const sc = subCat(state.mainId, state.subId);
      parts.push(`<span class="sep">›</span><span class="current">${sc ? LSub(sc,state.mainId,'name') : ''}</span>`);
    }
  }
  return `<nav class="crumbs" aria-label="Breadcrumb">${parts.join('')}</nav>`;
}

function renderFooter(){
  return `
  <footer class="legal">
    <p>${S('footerLegal1')}</p>
    <p>${S('footerLegal2')}</p>
    <p class="footer-credit">${S('footerCredit')} <a href="https://www.janschmidt-training.de" target="_blank" rel="noopener noreferrer">${S('footerCreditName')} — janschmidt-training.de</a></p>
  </footer>`;
}

/* =========================================================================
   RENDER: main region
   ========================================================================= */
function renderMain(){
  if(state.view==='search') return renderSearchResults();
  if(state.view==='home') return renderHome();
  if(state.view==='subcats') return renderSubcatsView();
  if(state.view==='entries') return renderEntriesView();
  return renderHome();
}

function renderHome(){
  return `
    <h2 class="home-title">${S('homeTitle')}</h2>
    <p class="home-sub">${S('homeSub')}</p>
    <div class="grid main-cats">
      ${MAIN_CATS.map(mc=>`
        <button class="tile-main" style="--tint:var(--${mc.color});--tint-soft:var(--${mc.color}-soft)" data-nav="subcats" data-main="${mc.id}">
          <div class="icon-wrap">${svgIcon(mc.icon,20)}</div>
          <h2>${LM(mc,'name')}</h2>
          <p class="desc">${LM(mc,'desc')}</p>
          <div class="count">${countFor(mc.id)} ${S('entriesLabel')}</div>
        </button>
      `).join('')}
    </div>
  `;
}

function renderSubcatsView(){
  const mc = mainCat(state.mainId);
  if(!mc) return renderHome();
  const subs = SUB_CATS[mc.id]||[];
  return `
    <div class="section-head" style="--tint:var(--${mc.color})">
      <span class="tint-dot"></span><h2>${LM(mc,'name')}</h2>
    </div>
    <p class="section-lead">${LM(mc,'desc')}</p>
    <div class="grid sub-cats">
      ${subs.map(sc=>`
        <button class="tile-sub" style="--tint:var(--${mc.color});--tint-soft:var(--${mc.color}-soft)" data-nav="entries" data-main="${mc.id}" data-sub="${sc.id}">
          <div class="icon-wrap">${svgIcon(sc.icon,15)}</div>
          <h3>${LSub(sc,mc.id,'name')}</h3>
          <p class="desc">${LSub(sc,mc.id,'desc')}</p>
          <div class="count">${countFor(mc.id, sc.id)} ${S('entriesLabel')}</div>
        </button>
      `).join('')}
    </div>
  `;
}

function renderEntriesView(){
  const mc = mainCat(state.mainId);
  const sc = subCat(state.mainId, state.subId);
  if(!mc || !sc) return renderHome();
  const list = entriesFor(mc.id, sc.id);
  return `
    <div class="section-head" style="--tint:var(--${mc.color})">
      <span class="tint-dot"></span><h2>${LSub(sc,mc.id,'name')}</h2>
    </div>
    <p class="section-lead">${LSub(sc,mc.id,'desc')}</p>
    ${renderEntryGrid(list, mc.color)}
  `;
}

function renderEntryGrid(list, color){
  if(!list.length){
    return `<div class="empty-state">${svgIcon('search',34)}<p>${S('noEntries')}</p></div>`;
  }
  return `<div class="grid entries">
    ${list.map(e=>{
      const title = L(e,'title'); const shortDef = L(e,'shortDef'); const tags = L(e,'tags')||[];
      return `
      <button class="tile-entry" style="--tint:var(--${color});--tint-soft:var(--${color}-soft)" data-open-entry="${e.id}" aria-current="${state.drawerEntry===e.id}">
        <div class="row-top">
          <div class="icon-wrap">${svgIcon(e.icon,13)}</div>
          <h4>${title}</h4>
        </div>
        <p class="teaser">${shortDef.length>92 ? shortDef.slice(0,90)+'…' : shortDef}</p>
        <div class="tags">${tags.slice(0,4).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      </button>`;
    }).join('')}
  </div>`;
}

function renderSearchResults(){
  const q = state.searchQuery.trim().toLowerCase();
  let results = ENTRIES;
  if(q){
    results = ENTRIES.filter(e=>{
      const mc = mainCat(e.main); const sc = subCat(e.main,e.sub);
      const hay = [L(e,'title'), L(e,'shortDef'), L(e,'explain'), ...(L(e,'tags')||[]), LM(mc,'name'), sc?LSub(sc,e.main,'name'):''].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  if(state.levelFilter){
    results = results.filter(e=>e.level===state.levelFilter);
  }
  const levels = ['Grundlagen','Aufbau','Vertiefung'];
  return `
    <div class="section-head"><h2>${S('breadcrumbSearchResults')}${q?` ${S('searchResultsFor')} „${escapeHtml(state.searchQuery)}"`:''}</h2></div>
    <div class="filters" role="group" aria-label="${S('filterByLevel')}">
      ${levels.map(l=>`<button class="filter-chip" data-level="${l}" aria-pressed="${state.levelFilter===l}">${levelLabel(l)}</button>`).join('')}
      ${state.levelFilter ? `<button class="filter-chip" data-level="__clear">${S('resetFilter')}</button>` : ''}
    </div>
    ${renderEntryGridMixed(results)}
  `;
}

function renderEntryGridMixed(list){
  if(!list.length){
    return `<div class="empty-state">${svgIcon('search',34)}<p>${S('noMatches')}</p></div>`;
  }
  return `<div class="grid entries">
    ${list.map(e=>{
      const mc = mainCat(e.main);
      const title = L(e,'title'); const shortDef = L(e,'shortDef'); const tags = L(e,'tags')||[];
      return `
      <button class="tile-entry" style="--tint:var(--${mc.color});--tint-soft:var(--${mc.color}-soft)" data-open-entry="${e.id}" aria-current="${state.drawerEntry===e.id}">
        <div class="row-top">
          <div class="icon-wrap">${svgIcon(e.icon,13)}</div>
          <h4>${title}</h4>
        </div>
        <p class="teaser">${shortDef.length>92 ? shortDef.slice(0,90)+'…' : shortDef}</p>
        <div class="tags"><span class="tag">${LM(mc,'name')}</span>${tags.slice(0,2).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      </button>`;
    }).join('')}
  </div>`;
}

/* =========================================================================
   RENDER: drawer
   ========================================================================= */
function renderDrawerMarkup(){
  const e = state.drawerEntry ? entryById(state.drawerEntry) : null;
  return `
    <div class="overlay ${e?'open':''}" data-close-drawer tabindex="-1"></div>
    <div class="drawer ${e?'open':''}" role="dialog" aria-modal="true" aria-labelledby="drawer-title" id="drawer">
      ${e ? renderDrawerContent(e) : ''}
    </div>
  `;
}

function renderDrawerContent(e){
  const mc = mainCat(e.main);
  const siblings = entriesFor(e.main, e.sub);
  const idx = siblings.findIndex(s=>s.id===e.id);
  const prev = idx>0 ? siblings[idx-1] : null;
  const next = idx<siblings.length-1 ? siblings[idx+1] : null;

  const title = L(e,'title'), shortDef = L(e,'shortDef'), explain = L(e,'explain'),
        usefulFor = L(e,'usefulFor'), useCases = L(e,'useCases'), example = L(e,'example'),
        strengths = L(e,'strengths'), limitations = L(e,'limitations'), mistakes = L(e,'mistakes'),
        providers = L(e,'providers'), note = L(e,'note');

  const sections = [];
  sections.push([S('secShortDef'), `<p class="body-text">${shortDef}</p>${explain?`<p class="body-text">${explain}</p>`:''}`]);
  if(usefulFor) sections.push([S('secUsefulFor'), `<p class="body-text">${usefulFor}</p>`]);
  if(useCases && useCases.length) sections.push([S('secUseCases'), `<ul>${useCases.map(u=>`<li>${u}</li>`).join('')}</ul>`]);
  if(example) sections.push([S('secExample'), `<p class="body-text">${example}</p>`]);
  if(strengths && strengths.length) sections.push([S('secStrengths'), `<ul>${strengths.map(s=>`<li>${s}</li>`).join('')}</ul>`]);
  if(limitations && limitations.length) sections.push([S('secLimitations'), `<ul>${limitations.map(s=>`<li>${s}</li>`).join('')}</ul>`]);
  if(mistakes && mistakes.length) sections.push([S('secMistakes'), `<ul>${mistakes.map(s=>`<li>${s}</li>`).join('')}</ul>`]);
  if(e.related && e.related.length){
    const chips = e.related.map(rid=>{
      const r = entryById(rid); if(!r) return '';
      return `<button class="related-chip" data-open-entry="${r.id}">${L(r,'title')}</button>`;
    }).join('');
    sections.push([S('secRelated'), `<div class="related-grid">${chips}</div>`]);
  }
  if(providers) sections.push([S('secProviders'), `<p class="providers">${providers}</p>`]);
  const metaprompt = L(e,'metaprompt');
  if(metaprompt){
    sections.push([S('secMetaprompt'), `
      <p class="metaprompt-instruction">${metaprompt.instruction}</p>
      <pre class="metaprompt-block" id="metaprompt-text-${e.id}">${escapeHtml(metaprompt.text)}</pre>
      <div class="metaprompt-actions">
        <button class="copy-btn" data-copy-metaprompt="${e.id}">${svgIcon('doc',15)} ${S('copyButton')}</button>
        <button class="copy-btn download-btn" data-download-metaprompt="${e.id}">${svgIcon('folder',15)} ${S('downloadButton')}</button>
      </div>
    `]);
  }
  if(note) sections.push([S('secNote'), `<div class="note">${note}</div>`]);

  return `
    <div class="drawer-head" style="--tint:var(--${mc.color})">
      <div class="icon-wrap">${svgIcon(e.icon,19)}</div>
      <div class="htext">
        <div class="eyebrow">${LM(mc,'name')}${e.sub ? ' · '+LSub(subCat(e.main,e.sub)||{},e.main,'name') : ''}</div>
        <h2 id="drawer-title">${title}</h2>
        <span class="level">${levelLabel(e.level)}</span>
      </div>
      <button class="drawer-close" data-close-drawer aria-label="${S('drawerClose')}">✕</button>
    </div>
    <div class="drawer-nav">
      <button data-prev-entry ${prev?'':'disabled'} aria-label="${S('drawerPrev')}">← ${prev?L(prev,'title'):S('drawerStart')}</button>
      <span class="pos">${idx+1} / ${siblings.length}</span>
      <button data-next-entry ${next?'':'disabled'} aria-label="${S('drawerNext')}">${next?L(next,'title'):S('drawerEnd')} →</button>
    </div>
    <div class="drawer-body">
      ${sections.map(([h,body])=>`<section><h3>${h}</h3>${body}</section>`).join('')}
    </div>
  `;
}

/* =========================================================================
   EVENTS
   ========================================================================= */
function bindGlobalEvents(){
  $app.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const nav = btn.dataset.nav;
      if(nav==='home'){ state.view='home'; state.mainId=null; state.subId=null; }
      if(nav==='subcats'){ state.view='subcats'; state.mainId=btn.dataset.main; state.subId=null; }
      if(nav==='entries'){ state.view='entries'; state.mainId=btn.dataset.main; state.subId=btn.dataset.sub; }
      render();
      document.getElementById('main-region').focus?.();
    });
  });

  $app.querySelectorAll('[data-open-entry]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.lastFocusedTile = btn;
      state.drawerEntry = btn.dataset.openEntry;
      render();
    });
  });

  $app.querySelectorAll('[data-close-drawer]').forEach(el=>{
    el.addEventListener('click', closeDrawer);
  });

  const prevBtn = $app.querySelector('[data-prev-entry]');
  const nextBtn = $app.querySelector('[data-next-entry]');
  if(prevBtn) prevBtn.addEventListener('click', ()=>stepEntry(-1));
  if(nextBtn) nextBtn.addEventListener('click', ()=>stepEntry(1));

  $app.querySelectorAll('[data-download-metaprompt]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const entry = entryById(btn.dataset.downloadMetaprompt);
      const mp = entry ? L(entry,'metaprompt') : null;
      if(!mp) return;
      const filename = 'metaprompt-'+(state.lang==='en'?'en':'de')+'.txt';
      let downloads = null;
      try{ downloads = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; }catch(err){ downloads = null; }
      if(downloads){
        try{ await downloads.save({filename, data: mp.text}); }
        catch(err){ if(err && err.code && err.code!=='declined' && err.code!=='rate_limited'){ btn.textContent = S('downloadUnavailable'); btn.disabled = true; } }
        return;
      }
      if(window.claude && window.claude.use){ btn.textContent = S('downloadUnavailable'); btn.disabled = true; return; }
      const blob = new Blob([mp.text], {type:'text/plain;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  });

  $app.querySelectorAll('[data-copy-metaprompt]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const entry = entryById(btn.dataset.copyMetaprompt);
      const mp = entry ? L(entry,'metaprompt') : null;
      if(!mp) return;
      let copied = false;
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          await navigator.clipboard.writeText(mp.text);
          copied = true;
        }
      }catch(err){ copied = false; }
      if(!copied){
        const pre = document.getElementById('metaprompt-text-'+entry.id);
        if(pre){
          const range = document.createRange();
          range.selectNodeContents(pre);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          try{ document.execCommand('copy'); copied = true; }catch(err){ /* selection remains for manual copy */ }
        }
      }
      const original = btn.innerHTML;
      btn.innerHTML = `${svgIcon('check',15)} ${S('copiedButton')}`;
      btn.disabled = true;
      setTimeout(()=>{ btn.innerHTML = original; btn.disabled = false; }, 2000);
    });
  });

  $app.querySelectorAll('[data-lang]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const lang = btn.dataset.lang;
      if(lang !== state.lang){
        state.lang = lang;
        render();
      }
    });
  });

  $app.querySelectorAll('[data-level]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const lvl = chip.dataset.level;
      state.levelFilter = (lvl==='__clear' || state.levelFilter===lvl) ? null : lvl;
      render();
      document.getElementById('search-input')?.focus();
    });
  });

  const searchInput = document.getElementById('search-input');
  if(searchInput){
    searchInput.addEventListener('input', (ev)=>{
      state.searchQuery = ev.target.value;
      state.view = state.searchQuery.trim() ? 'search' : 'home';
      if(state.view==='home'){ state.mainId=null; state.subId=null; }
      render();
      const el = document.getElementById('search-input');
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
  }

  if(state.drawerEntry){
    document.addEventListener('keydown', onDrawerKeydown);
  }
}

function stepEntry(dir){
  const e = entryById(state.drawerEntry);
  if(!e) return;
  const siblings = entriesFor(e.main, e.sub);
  const idx = siblings.findIndex(s=>s.id===e.id);
  const target = siblings[idx+dir];
  if(target){ state.drawerEntry = target.id; render(); focusDrawer(); }
}

function closeDrawer(){
  state.drawerEntry = null;
  render();
  if(state.lastFocusedTile && document.body.contains(state.lastFocusedTile)){
    state.lastFocusedTile.focus();
  }
}

function openDrawerAnim(){
  focusDrawer();
}
function focusDrawer(){
  const closeBtn = document.querySelector('.drawer-close');
  if(closeBtn) closeBtn.focus();
  document.addEventListener('keydown', onDrawerKeydown);
}
function onDrawerKeydown(ev){
  if(ev.key==='Escape'){
    document.removeEventListener('keydown', onDrawerKeydown);
    closeDrawer();
  }
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* init */
render();
</script>
</body>
</html>
