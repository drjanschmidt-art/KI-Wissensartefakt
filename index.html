? A decision guide", "tags": ["Comparison", "Disciplines", "Orientation"], "shortDef": "The three academic research tools overlap but have clearly different strengths — depending on the phase of work, the type of question, and the discipline.", "explain": "Rule of thumb by phase: Consensus for a quick, evidence-based answer to a focused empirical question — with a \"Consensus Meter\" showing how much the studies agree, and filters for journal quality. Elicit for systematic work: structured screening with inclusion and exclusion criteria and precise data extraction across many studies — but it stops at synthesis and does not write texts. SciSpace for broad, exploratory research and the entire chain up to a draft, plus in-depth reading of individual papers. By discipline: all three focus on empirical, English-language journal literature and are strongest in medicine and the life and natural sciences; the social sciences are covered moderately, the humanities, law, and parts of engineering considerably less. Consensus works best for yes/no questions and struggles with contradictory evidence.", "usefulFor": "Choosing the tool for a specific search — and judging when AI tools reach their limits.", "useCases": ["Medicine/health, \"Does intervention X work?\" → Consensus for a quick overview, Elicit for systematic analysis", "Psychology/education research, literature overview for a grant proposal → SciSpace for the broad search and draft, Elicit for the data table", "Systematic review with documentation requirements → Elicit as an aid, complemented by classic subject databases", "Humanities or law, theoretical questions → library catalogues and subject databases first; AI tools at most as a supplement, e.g. NotebookLM with your own sources"], "example": "For a proposal on early-career support: use Consensus to check how robust the evidence on mentoring effects is, Elicit to analyse the key studies in a table, and SciSpace to turn this into a cited overview draft.", "strengths": ["Creates orientation between tools that seem similar", "Makes the disciplinary imbalance of the databases visible"], "limitations": ["Comparisons and benchmarks often come from the providers themselves and should be read with caution", "Features and databases change constantly"], "mistakes": ["Concluding from an empty result list that there is no research — often coverage is simply missing", "Overlooking books, edited volumes, and non-English literature because the tools barely cover them"], "providers": "Across providers", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "m7": {"title": "Template: Creating motion graphics as an HTML animation", "tags": ["Motion graphics", "HTML", "Copy & paste"], "shortDef": "A fill-in prompt template that gets a chatbot to build a short animated explainer as an HTML page — with scenes, captions, icons and smooth transitions.", "explain": "Instead of a video, the chatbot creates an HTML page that plays like a short animated film: titles, figures and icons fade in, move and flow into the next scene. The template provides a fixed structure for this — content, format, a storyboard with time windows, style, technical requirements and a check before delivery. You only fill in the placeholders in square brackets. If you leave the storyboard empty, the chatbot suggests one first.", "usefulFor": "Short explainer sequences for workshops, course announcements or websites, when video production isn't an option and the result should look clean and on-brand.", "useCases": ["Explaining a topic in a 30-second opener, e.g. \"What are Skills in Claude?\"", "Showing a process step by step as an animation", "Creating an animated course teaser in your own brand colours"], "example": "Topic \"Skills in Claude\", audience university office staff, 16:9, 30 seconds, five scenes from problem through solution to summary, blue-green style on a light background. Result: a page that plays automatically and shows a \"Replay\" button at the end.", "strengths": ["Crisp at any size, because everything is drawn rather than filmed", "Text, colours and timing can be fine-tuned in the chat", "Shareable as a link and playable directly in the browser"], "limitations": ["No sound, no voice-over and no video file — for an MP4 you need to record the animation with a screen recorder", "Results depend heavily on the model; complex motion often needs one or two rounds of corrections"], "mistakes": ["Overloading the storyboard — more than five or six scenes in 30 seconds feels rushed", "Showing captions that are too long to read in the time available", "Stopping after the first version instead of giving concrete corrections (\"scene 3 overlaps the heading\")"], "providers": "Works best with chatbots that render HTML directly: Claude (artifacts), ChatGPT (canvas), Gemini (canvas)", "metaprompt": {"instruction": "Copy the template, replace everything in square brackets with your own details, and paste it as a message into a chatbot that can display HTML (e.g. Claude, or ChatGPT with canvas). You can delete any points you don't need.", "text": "Create an animated motion graphic for me as a single, self-contained HTML file (as an artifact or in canvas, so I can view, play and share it straight away).\n\n## 1. Content\n- Topic: [e.g. \"Skills in Claude\"]\n- Audience: [e.g. university office staff who are new to AI]\n- Key message in one sentence: [...]\n- Language of the on-screen text: [simple English / German]\n\n## 2. Format\n- Aspect ratio: [16:9 / 9:16 / 1:1]\n- Length: [e.g. about 30 seconds]\n- Where it will be shown: [projector in a workshop / LinkedIn / website]\n- The animation plays automatically. At the end, a \"Replay\" button appears.\n\n## 3. Scenes (storyboard)\nFor each scene: time window – what happens – on-screen text.\n1. (0–4 s) Title \"[...]\" fades in, subtitle: \"[...]\"\n2. ([...] s) Problem: [...]\n3. ([...] s) Solution: [...]\n4. ([...] s) In action / example: [...]\n5. ([...] s to end) Summary: [three points, each with an icon], closing line: \"[...]\"\n\nIf I leave the storyboard empty: first suggest a storyboard with 4–6 scenes and wait for my OK before you build the animation.\n\n## 4. Style\n- Look: [flat, friendly and clean]\n- Colours: [e.g. calm blue-green on a light background / my brand colours: #..., #...]\n- Font: sans-serif and large, easy to read on a projector\n- Shapes: rounded, simple icons and figures\n- Motion: smooth easing, gentle fades and slides, no hard cuts; elements may travel from one scene into the next\n- Text: short and simple, no more than about eight words per caption\n\n## 5. Technical requirements\n- One single HTML file with inline CSS and JavaScript. No external images: draw all graphics, icons and figures yourself as SVG or CSS. The only external resource allowed is a font (e.g. from Google Fonts).\n- A fixed stage (e.g. 1920 × 1080 pixels) that scales to the window without distortion.\n- Drive the animation from one central JavaScript timeline (requestAnimationFrame) with keyframes per element, so the timing matches the scenes exactly and \"Replay\" starts cleanly from the beginning.\n- A subtle progress bar along the bottom edge. [optional]\n- Do not recreate real logos, well-known characters or brands. Only use my own logo if I give it to you as a file or SVG.\n\n## 6. Check before delivering\nBefore you give me the result, check: Do any texts or elements overlap? Is all text fully visible and large enough? Do the time windows match my storyboard? Does the \"Replay\" button work?\nThen tell me in two or three sentences where you departed from my instructions or made your own decisions.", "filename": "motion-graphic-template.txt"}, "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "g1": {"title": "How does AI work? The key terms as one system", "tags": ["LLM", "Training", "Parameters", "Agentic AI"], "shortDef": "Chatbot, LLM, training, parameters, prompt, skill, and agentic AI are not loose buzzwords but parts of one process: a trained language model generates an answer based on prompt and context — and can be extended with tools.", "explain": "The process in simplified form:<br><br>(1) <strong>Training</strong> — a language model learns from very large amounts of text which words and connections are likely to follow one another.<br>(2) The result is the <strong>LLM</strong> (large language model); its \"knowledge\" lies in billions of <strong>parameters</strong> — weights, not a database of stored facts.<br>(3) The <strong>chatbot</strong> is the interface through which we talk to the model.<br>(4) The <strong>prompt</strong> plus context — uploaded files, project, memory, web search — determines what the model generates as an answer.<br>(5) <strong>Skills</strong> and <strong>connectors</strong> extend the model with instructions and access to other tools.<br>(6) With <strong>agentic AI</strong>, the AI plans and carries out several steps on its own.<br><br>This structure also explains the typical weaknesses: <strong>hallucinations</strong> occur because the model generates plausible rather than verified answers; <strong>bias</strong> comes from the training data; and the model only knows the world up to its training cut-off unless it searches the web.", "usefulFor": "A basic understanding for interpreting results correctly, explaining errors, and choosing suitable tools.", "useCases": ["Collecting the buzzwords in a workshop and arranging them together into a process diagram", "Explaining why a chatbot can \"invent\" a source", "Understanding why a project or memory delivers better answers than an empty chat"], "example": "Write the terms chatbot, LLM, parameters, training, data basis, skill, agentic AI, and prompt on cards and have participants put them in order: what comes first, what builds on what?", "strengths": ["Makes the strengths and weaknesses of AI understandable", "Helps place new product names quickly"], "limitations": ["Highly simplified — technical details differ by model"], "mistakes": ["Mistaking a language model for a database or search engine", "Confusing fluently worded answers with verified knowledge"], "providers": "Model-independent"}, "g2": {"title": "Ethics and responsible use of AI", "tags": ["Risks", "Responsibility", "AI literacy"], "shortDef": "AI brings great strengths — and risks that need to be known and actively managed. The most effective lever is almost always education: those who understand how AI works use it responsibly.", "explain": "Strengths: AI saves time on routine work, makes knowledge more accessible, and supports creativity, analysis, and accessibility. Weaknesses and risks: hallucinations and errors, bias from training data, data-protection and confidentiality issues, unresolved copyright and usage rights, lack of transparency, gradual loss of skills through too much delegation, dependence on a few providers, and energy and resource consumption. Managing the risks: build training and AI literacy, have people check results, be transparent about AI use, handle data sparingly (anonymise, use local models), and agree on clear rules within the organisation. In the EU, the AI Act in any case requires organisations that use AI to ensure their staff have sufficient AI literacy.", "usefulFor": "The closing reflection of a workshop, developing AI guidelines within a team, and any decision about using AI for sensitive tasks.", "useCases": ["Collecting and prioritising strengths, risks, and countermeasures as a team", "Drafting guidelines for AI use in your own department", "Checking before a new application: which data goes where, and who checks the result?"], "example": "Three flipcharts: \"Strengths\", \"Weaknesses and risks\", \"Managing risks\". In almost every group, education, training, and responsible use end up at the top of the third chart.", "strengths": ["Creates a shared basis for responsible AI use", "Combines opportunities and risks instead of euphoria or rejection"], "limitations": ["Clarify legal questions (data protection, copyright, AI Act) case by case with the relevant experts"], "mistakes": ["Only naming risks without agreeing on concrete countermeasures", "Delegating responsibility to the AI instead of keeping it with people"], "providers": "Model-independent"}, "t21": {"title": "Which chatbot for what? A decision guide", "tags": ["Choice", "Overview"], "shortDef": "There is no single best chatbot — but there are clear favourites for typical tasks. This overview sorts the common tools by purpose.", "explain": "Creative everyday work, texts, images: ChatGPT or Gemini. Long documents, data analysis, interactive tools (artifacts): Claude. Working in Google Workspace: Gemini. Working in Microsoft 365: Copilot. European provider, EU data residency: Vibe (Mistral). Quick research with sources: Perplexity. Working with your own sources and creating learning material: NotebookLM. Academic literature: Elicit, SciSpace, or Consensus. Overview articles on a topic: STORM. Confidential content that must not leave the device: a local model, e.g. via Ollama. For important questions, it is worth asking two chatbots in parallel and comparing the answers.", "usefulFor": "Quick orientation on which tool offers the best starting point for a specific task.", "useCases": ["Briefly checking which tool fits before starting a new task", "Agreeing on shared standard tools within a team", "Asking two chatbots the same question and comparing the answers"], "example": "Gallery walk in a workshop: one poster per chatbot; participants note what they used it for during the week and where it proved its worth.", "strengths": ["Creates orientation in a confusing market", "Avoids using one tool for everything"], "limitations": ["Providers' strengths shift with every model change", "Which tools are allowed is often decided by your own organisation"], "mistakes": ["Knowing only one chatbot and using it for everything", "Using tools with confidential data without checking how data is processed"], "providers": "Across providers", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "t22": {"title": "Model status: which models are currently running?", "tags": ["Models", "Current status"], "shortDef": "The central overview of the current language models from the major providers — so that the entries on individual chatbots don't go out of date with every model change.", "explain": "Model names change every few weeks — which is why they are collected in this one place. As of 13 November 2026.<br><br><strong>OpenAI (ChatGPT):</strong> GPT-6 family — GPT-6 Sol in the paid plans, GPT-6 Luna in Free and Go, GPT-6 Astra as the strongest reasoning option (Pro); plus GPT-6.1 Terra (since October 2026). Images: ChatGPT Images 2.6.<br><strong>Anthropic (Claude):</strong> Claude Opus 5.5, Sonnet 5.5, and Haiku 5.5; above them the Mythos tier, generally available as Claude Fable 5.2.<br><strong>Google (Gemini):</strong> Gemini 3.1 Pro and Gemini 3.8 Flash; Gemini 4 has been announced but not yet released. Images: Nano Banana.<br><strong>Alibaba (Qwen):</strong> Qwen3.8-Max; Qwen 4 has been announced but not yet released.<br><br>The model picker in the chatbot usually shows which model is currently running.", "usefulFor": "Understanding which model you are currently working with and whether switching is worthwhile.", "useCases": ["Checking whether your own plan includes the current top model", "Switching to a stronger model when answers are noticeably weak"], "example": "A fast model is enough for a simple rewording; for a complex analysis, the stronger reasoning model is worth it.", "strengths": ["One place for all model names", "Makes comparing providers easier"], "limitations": ["A snapshot — names and availability change constantly and depend on the plan"], "mistakes": ["Confusing model names with product names: ChatGPT is the chatbot, GPT-6 the model behind it"], "providers": "OpenAI, Anthropic, Google, Alibaba", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "l1": {"title": "Local AI models: AI offline on your own computer (e.g. Ollama)", "tags": ["Offline", "Data protection", "Open source"], "shortDef": "Open language models such as Qwen, Gemma, or Mistral can be run directly on your own computer with programs like Ollama — without an internet connection and without data leaving the device.", "explain": "Ollama (or, similarly, LM Studio) downloads an open model once and then makes it available locally, with a simple chat window or as an interface for other programs. This makes it possible to process confidential texts that must not be seen by any cloud service. The combination with artifacts is particularly interesting: a self-built HTML tool can address the local model instead of a cloud provider — a privacy-compliant, \"smart\" tool for in-house use. How well this works depends heavily on the computer: small models also run on laptops but are noticeably less capable than the large cloud models.", "usefulFor": "Tasks involving confidential or personal data, working without internet, and experimenting with open models.", "useCases": ["Having confidential minutes summarised locally", "Building an artifact that analyses texts via the local model instead of a cloud service", "Comparing openly available models with one another"], "example": "Install Ollama, load a Qwen model, and have a text summarised offline — then connect the same model to a self-built HTML tool.", "strengths": ["Data stays on your own device", "Works offline", "No running costs per request"], "limitations": ["Performance depends heavily on processor, graphics card, and memory", "Large amounts of data, such as extensive tables, quickly become too slow to process", "Local models are less capable than the large cloud models", "Requires installation and some technical familiarisation"], "mistakes": ["Confusing a cloud service (e.g. Qwen Chat in the browser) with running the same model locally", "Expecting the quality of a top model from a small local model"], "providers": "Ollama, LM Studio; models e.g. from Alibaba (Qwen), Google (Gemma), Mistral AI, DeepSeek", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "a4": {"title": "Scheduled tasks: the AI works to a timetable", "tags": ["Schedule", "Routine", "Automation"], "shortDef": "A scheduled task is an instruction to the AI that runs automatically at a set time or on a set rhythm — daily, weekly, or once — without you having to start a chat.", "explain": "You describe the task once, like a normal prompt, and set when it should run. It unfolds its full effect in combination with the other building blocks: connectors supply the real data (mailbox, calendar, storage), skills ensure the desired format, and the result can be ready as an artifact, document, or email draft, for example. This builds automation step by step without having to set up a separate automation platform.", "usefulFor": "Recurring routines in which information is regularly collected, summarised, or prepared.", "useCases": ["Getting an overview of appointments and emails needing a reply every morning", "Summarising the previous week's new course registrations every Monday", "Having news on a specialist topic researched once a month"], "example": "\"Every Friday at 3 pm, summarise all of this week's emails about course enquiries and list open questions.\" — with a connector to the mailbox, this then runs without any new chat.", "strengths": ["Takes routine work off your hands without you having to remember it", "Combines with connectors, skills, and artifacts", "Set up without technical knowledge"], "limitations": ["Check results regularly so errors don't keep running unnoticed", "Tasks with access to mailbox or storage need deliberately granted permissions", "Availability and frequency depend on provider and plan"], "mistakes": ["Creating too many scheduled tasks whose results nobody reads", "Letting tasks that send or delete something run without confirmation"], "providers": "e.g. Anthropic (scheduled tasks in Claude), OpenAI (tasks in ChatGPT), Google (scheduled actions in Gemini), Microsoft (automations in Copilot)", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "a5": {"title": "Sharing AI: which form of AI can I share with whom?", "tags": ["Sharing", "Collaboration", "Reach"], "shortDef": "What you have built with AI can be shared to different extents — from chat histories through projects and notebooks to artifacts and skills. The forms differ mainly in who can join in without their own account.", "explain": "<strong>Chat links</strong> share a snapshot of a conversation.<br><br><strong>Projects</strong> (Claude, ChatGPT, Vibe) bundle a knowledge base and instructions; they are usually shared within a team or organisation with a suitable account.<br><br><strong>NotebookLM</strong> currently has the widest reach for sharing and collaboration: a notebook is easy to share, and recipients can query it and create material from it.<br><br><strong>Web apps</strong> built with AI differ in openness: Claude artifacts can be shared via a link with the widest reach; ChatGPT Sites and apps from Google AI Studio are more restricted and sometimes require sign-in.<br><br><strong>Skills</strong> can be passed on as a file or provided across an organisation and, thanks to the open format, used in other systems too. Building your own GPTs or Gems to share them, on the other hand, hardly makes sense any more — both formats are being phased out.", "usefulFor": "Deciding in which form an AI solution is passed on to colleagues, participants, or clients.", "useCases": ["Sharing a notebook with all materials with the participants of a course", "Passing on an artifact as a tool to colleagues via a link", "Setting up a project with a knowledge base for the whole team", "Passing a proven skill on to a colleague as a file"], "example": "For workshop documentation that all participants should be able to use long-term, an artifact with a stable address works well; for continuing to work together on course materials, a shared NotebookLM notebook.", "strengths": ["Turns a personal solution into a tool for many", "Helps choose the right form for the target group"], "limitations": ["Sharing and account conditions differ by provider and plan", "Shared content can contain confidential information — check before sharing", "Anyone using a shared tool with AI sometimes needs their own account or quota"], "mistakes": ["Sharing a link without checking whether recipients can open it without an account", "Sharing projects with sensitive documents too widely"], "providers": "Google (NotebookLM, AI Studio), Anthropic (projects, artifacts, skills), OpenAI (projects, Sites), Mistral (projects in Vibe)", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "f17": {"title": "Second brain: information management with AI", "tags": ["Knowledge management", "Obsidian", "Notion"], "shortDef": "Scattered information from emails, notes, documents, and appointments is collected in one place, organised by the AI, and filtered and brought together through a single point of access — such as Claude.", "explain": "A \"second brain\" is a personal knowledge store, for example in Obsidian (Markdown files on your own computer) or Notion. What is new is the role of AI: it files information in a structured way, links it, recognises tasks and appointments, and prepares them as needed — e.g. as a daily or to-do overview. Via connectors and skills, the chatbot becomes the central point of access: instead of searching in five programs, you ask in one place. This is a direction AI assistants are currently developing in: away from the individual chat, towards organising your own everyday information.", "usefulFor": "People with many parallel topics, projects, and information sources who want to keep track.", "useCases": ["Having important emails filed automatically as notes and tasks in Obsidian", "Merging all open to-dos from different notes into one list", "Bundling all information about a client or project before a meeting"], "example": "A scheduled task fetches new emails every morning, files what is relevant in the Obsidian vault, and creates a daily overview with appointments and open tasks.", "strengths": ["One point of access instead of many programs", "Knowledge stays findable and linked over time", "With Obsidian, the data stays as files on your own computer"], "limitations": ["Setup and maintenance require time and discipline", "The AI gets access to a lot of personal and work data — grant permissions deliberately", "Automatically filed information can be misclassified and needs occasional checking"], "mistakes": ["Filing everything unfiltered so the collection becomes cluttered", "Transferring confidential data to cloud services without checking"], "providers": "e.g. Obsidian, Notion combined with Claude, ChatGPT, or other chatbots with connectors", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}};
/* =========================================================================
   STATE
   ========================================================================= */
let state = {
  view:'home',           // home | subcats | entries | search
  mainId:null,
  subId:null,
  drawerEntry:null,
  lastFocusedTile:null,
  searchQuery:'',
  levelFilter:null,
  lang:'de'              // 'de' | 'en'
};

const $app = document.getElementById('app');

function S(key){ return (STRINGS[state.lang] && STRINGS[state.lang][key]) || STRINGS.de[key] || key; }
function L(entry, field){
  if(state.lang==='en'){
    const ov = ENTRIES_EN[entry.id];
    if(ov && ov[field]!==undefined) return ov[field];
  }
  return entry[field];
}
function LM(mc, field){
  if(state.lang==='en'){
    const ov = MAIN_CATS_EN[mc.id];
    if(ov && ov[field]!==undefined) return ov[field];
  }
  return mc[field];
}
function LSub(sc, mainId, field){
  if(state.lang==='en'){
    const ov = (SUB_CATS_EN[mainId]||{})[sc.id];
    if(ov && ov[field]!==undefined) return ov[field];
  }
  return sc[field];
}
function levelLabel(code){
  if(!code) return '';
  return (LEVEL_LABELS[state.lang] && LEVEL_LABELS[state.lang][code]) || code;
}

const SORT_OVERRIDES = {
  'tools:orientierung': ['t21', 't22'],
  'automation:workflows': ['a4', 'f15'],
  'prompting:ki_verstehen': ['g1', 'g2'],
  'tools:multimodal': ['t1','t3','t2','t17','t4','t15','t18','t16'],
  'automation:container': ['f13','f11'],
  'cowork:agenten': ['c1','c2','f14','c5'],
  'media:stimme': ['v1','v2','t11'],
  'tools:recherche': ['t5','t6','t7','t19','t8','t20','t14']
};

function entriesFor(mainId, subId){
  let list = ENTRIES.filter(e=>{
    const inMain = e.main===mainId || (e.secondary||[]).includes(mainId);
    if(!inMain) return false;
    if(subId) return e.sub===subId || (e.altSub||[]).includes(subId);
    return true;
  });
  if(subId){
    const order = SORT_OVERRIDES[mainId+':'+subId];
    if(order){
      list = list.slice().sort((a,b)=>{
        const ia = order.indexOf(a.id), ib = order.indexOf(b.id);
        const ra = ia===-1 ? Infinity : ia, rb = ib===-1 ? Infinity : ib;
        return ra-rb;
      });
    }
  }
  return list;
}
function countFor(mainId, subId){ return entriesFor(mainId, subId).length; }
function mainCat(id){ return MAIN_CATS.find(m=>m.id===id); }
function subCat(mainId, subId){ return (SUB_CATS[mainId]||[]).find(s=>s.id===subId); }
function entryById(id){ return ENTRIES.find(e=>e.id===id); }

  $app.innerHTML = `
    ${renderHeader()}
    ${renderCrumbs()}
    <main id="main-region">${renderMain()}</main>
    ${renderDrawerMarkup()}
    ${renderFooter()}

  if(state.drawerEntry){ requestAnimationFrame(openDrawerAnim); }
}

function renderCrumbs(){
  let parts = [`<button data-nav="home">${S('breadcrumbStart')}</button>`];
  if(state.view==='search'){
    parts.push(`<span class="sep">›</span><span class="current">${S('breadcrumbSearchResults')}</span>`);
  } else if(state.mainId){
    const mc = mainCat(state.mainId);
    parts.push(`<span class="sep">›</span>`);
    if(state.view==='subcats'){
      parts.push(`<span class="current"><span class="dot" style="background:var(--${mc.color})"></span>${LM(mc,'name')}</span>`);
    } else {
      parts.push(`<button data-nav="subcats" data-main="${mc.id}"><span class="dot" style="background:var(--${mc.color})"></span>${LM(mc,'name')}</button>`);
    }
    if(state.subId){
      const sc = subCat(state.mainId, state.subId);
      parts.push(`<span class="sep">›</span><span class="current">${sc ? LSub(sc,state.mainId,'name') : ''}</span>`);
    }
  }
  return `<nav class="crumbs" aria-label="Breadcrumb">${parts.join('')}</nav>`;
}

function renderFooter(){
  return `
  <footer class="legal">
    <p>${S('footerLegal1')}</p>
    <p>${S('footerLegal2')}</p>
    <p class="footer-credit">${S('footerCredit')} <a href="https://www.janschmidt-training.de" target="_blank" rel="noopener noreferrer">${S('footerCreditName')} — janschmidt-training.de</a></p>
  </footer>`;
}

/* =========================================================================
   RENDER: main region
   ========================================================================= */
function renderMain(){
  if(state.view==='search') return renderSearchResults();
  if(state.view==='home') return renderHome();
  if(state.view==='subcats') return renderSubcatsView();
  if(state.view==='entries') return renderEntriesView();
  return renderHome();
}

function renderHome(){
  return `
    <h2 class="home-title">${S('homeTitle')}</h2>
    <p class="home-sub">${S('homeSub')}</p>
    <div class="grid main-cats">
      ${MAIN_CATS.map(mc=>`
        <button class="tile-main" style="--tint:var(--${mc.color});--tint-soft:var(--${mc.color}-soft)" data-nav="subcats" data-main="${mc.id}">
          <div class="icon-wrap">${svgIcon(mc.icon,20)}</div>
          <h2>${LM(mc,'name')}</h2>
          <p class="desc">${LM(mc,'desc')}</p>
          <div class="count">${countFor(mc.id)} ${S('entriesLabel')}</div>
        </button>
      `).join('')}
    </div>
  `;
}

function renderSubcatsView(){
  const mc = mainCat(state.mainId);
  if(!mc) return renderHome();
  const subs = SUB_CATS[mc.id]||[];
  return `
    <div class="section-head" style="--tint:var(--${mc.color})">
      <span class="tint-dot"></span><h2>${LM(mc,'name')}</h2>
    </div>
    <p class="section-lead">${LM(mc,'desc')}</p>
    <div class="grid sub-cats">
      ${subs.map(sc=>`
        <button class="tile-sub" style="--tint:var(--${mc.color});--tint-soft:var(--${mc.color}-soft)" data-nav="entries" data-main="${mc.id}" data-sub="${sc.id}">
          <div class="icon-wrap">${svgIcon(sc.icon,15)}</div>
          <h3>${LSub(sc,mc.id,'name')}</h3>
          <p class="desc">${LSub(sc,mc.id,'desc')}</p>
          <div class="count">${countFor(mc.id, sc.id)} ${S('entriesLabel')}</div>
        </button>
      `).join('')}
    </div>
  `;
}

function renderEntriesView(){
  const mc = mainCat(state.mainId);
  const sc = subCat(state.mainId, state.subId);
  if(!mc || !sc) return renderHome();
  const list = entriesFor(mc.id, sc.id);
  return `
    <div class="section-head" style="--tint:var(--${mc.color})">
      <span class="tint-dot"></span><h2>${LSub(sc,mc.id,'name')}</h2>
    </div>
    <p class="section-lead">${LSub(sc,mc.id,'desc')}</p>
    ${renderEntryGrid(list, mc.color)}
  `;
}

function renderEntryGrid(list, color){
  if(!list.length){
    return `<div class="empty-state">${svgIcon('search',34)}<p>${S('noEntries')}</p></div>`;
  }
  return `<div class="grid entries">
    ${list.map(e=>{
      const title = L(e,'title'); const shortDef = L(e,'shortDef'); const tags = L(e,'tags')||[];
      return `
      <button class="tile-entry" style="--tint:var(--${color});--tint-soft:var(--${color}-soft)" data-open-entry="${e.id}" aria-current="${state.drawerEntry===e.id}">
        <div class="row-top">
          <div class="icon-wrap">${svgIcon(e.icon,13)}</div>
          <h4>${title}</h4>
        </div>
        <p class="teaser">${shortDef.length>92 ? shortDef.slice(0,90)+'…' : shortDef}</p>
        <div class="tags">${tags.slice(0,4).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      </button>`;
    }).join('')}
  </div>`;
}

function renderSearchResults(){
  const q = state.searchQuery.trim().toLowerCase();
  let results = ENTRIES;
  if(q){
    results = ENTRIES.filter(e=>{
      const mc = mainCat(e.main); const sc = subCat(e.main,e.sub);
      const hay = [L(e,'title'), L(e,'shortDef'), L(e,'explain'), ...(L(e,'tags')||[]), LM(mc,'name'), sc?LSub(sc,e.main,'name'):''].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  if(state.levelFilter){
    results = results.filter(e=>e.level===state.levelFilter);
  }
  const levels = ['Grundlagen','Aufbau','Vertiefung'];
  return `
    <div class="section-head"><h2>${S('breadcrumbSearchResults')}${q?` ${S('searchResultsFor')} „${escapeHtml(state.searchQuery)}"`:''}</h2></div>
    <div class="filters" role="group" aria-label="${S('filterByLevel')}">
      ${levels.map(l=>`<button class="filter-chip" data-level="${l}" aria-pressed="${state.levelFilter===l}">${levelLabel(l)}</button>`).join('')}
      ${state.levelFilter ? `<button class="filter-chip" data-level="__clear">${S('resetFilter')}</button>` : ''}
    </div>
    ${renderEntryGridMixed(results)}
  `;
}

function renderEntryGridMixed(list){
  if(!list.length){
    return `<div class="empty-state">${svgIcon('search',34)}<p>${S('noMatches')}</p></div>`;
  }
  return `<div class="grid entries">
    ${list.map(e=>{
      const mc = mainCat(e.main);
      const title = L(e,'title'); const shortDef = L(e,'shortDef'); const tags = L(e,'tags')||[];
      return `
      <button class="tile-entry" style="--tint:var(--${mc.color});--tint-soft:var(--${mc.color}-soft)" data-open-entry="${e.id}" aria-current="${state.drawerEntry===e.id}">
        <div class="row-top">
          <div class="icon-wrap">${svgIcon(e.icon,13)}</div>
          <h4>${title}</h4>
        </div>
        <p class="teaser">${shortDef.length>92 ? shortDef.slice(0,90)+'…' : shortDef}</p>
        <div class="tags"><span class="tag">${LM(mc,'name')}</span>${tags.slice(0,2).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      </button>`;
    }).join('')}
  </div>`;
}

/* =========================================================================
   RENDER: drawer
   ========================================================================= */
function renderDrawerMarkup(){
  const e = state.drawerEntry ? entryById(state.drawerEntry) : null;
  return `
    <div class="overlay ${e?'open':''}" data-close-drawer tabindex="-1"></div>
    <div class="drawer ${e?'open':''}" role="dialog" aria-modal="true" aria-labelledby="drawer-title" id="drawer">
      ${e ? renderDrawerContent(e) : ''}
    </div>
  `;
}

function renderDrawerContent(e){
  const mc = mainCat(e.main);
  const siblings = entriesFor(e.main, e.sub);
  const idx = siblings.findIndex(s=>s.id===e.id);
  const prev = idx>0 ? siblings[idx-1] : null;
  const next = idx<siblings.length-1 ? siblings[idx+1] : null;

  const title = L(e,'title'), shortDef = L(e,'shortDef'), explain = L(e,'explain'),
        usefulFor = L(e,'usefulFor'), useCases = L(e,'useCases'), example = L(e,'example'),
        strengths = L(e,'strengths'), limitations = L(e,'limitations'), mistakes = L(e,'mistakes'),
        providers = L(e,'providers'), note = L(e,'note');

  const sections = [];
  sections.push([S('secShortDef'), `<p class="body-text">${shortDef}</p>${explain?`<p class="body-text">${explain}</p>`:''}`]);
  if(usefulFor) sections.push([S('secUsefulFor'), `<p class="body-text">${usefulFor}</p>`]);
  if(useCases && useCases.length) sections.push([S('secUseCases'), `<ul>${useCases.map(u=>`<li>${u}</li>`).join('')}</ul>`]);
  if(example) sections.push([S('secExample'), `<p class="body-text">${example}</p>`]);
  if(strengths && strengths.length) sections.push([S('secStrengths'), `<ul>${strengths.map(s=>`<li>${s}</li>`).join('')}</ul>`]);
  if(limitations && limitations.length) sections.push([S('secLimitations'), `<ul>${limitations.map(s=>`<li>${s}</li>`).join('')}</ul>`]);
  if(mistakes && mistakes.length) sections.push([S('secMistakes'), `<ul>${mistakes.map(s=>`<li>${s}</li>`).join('')}</ul>`]);
  if(e.related && e.related.length){
    const chips = e.related.map(rid=>{
      const r = entryById(rid); if(!r) return '';
      return `<button class="related-chip" data-open-entry="${r.id}">${L(r,'title')}</button>`;
    }).join('');
    sections.push([S('secRelated'), `<div class="related-grid">${chips}</div>`]);
  }
  if(providers) sections.push([S('secProviders'), `<p class="providers">${providers}</p>`]);
  const metaprompt = L(e,'metaprompt');
  if(metaprompt){
    sections.push([S('secMetaprompt'), `
      <p class="metaprompt-instruction">${metaprompt.instruction}</p>
      <pre class="metaprompt-block" id="metaprompt-text-${e.id}">${escapeHtml(metaprompt.text)}</pre>
      <div class="metaprompt-actions">
        <button class="copy-btn" data-copy-metaprompt="${e.id}">${svgIcon('doc',15)} ${S('copyButton')}</button>
        <button class="copy-btn download-btn" data-download-metaprompt="${e.id}">${svgIcon('folder',15)} ${S('downloadButton')}</button>
      </div>
    `]);
  }
  if(note) sections.push([S('secNote'), `<div class="note">${note}</div>`]);

  return `
    <div class="drawer-head" style="--tint:var(--${mc.color})">
      <div class="icon-wrap">${svgIcon(e.icon,19)}</div>
      <div class="htext">
        <div class="eyebrow">${LM(mc,'name')}${e.sub ? ' · '+LSub(subCat(e.main,e.sub)||{},e.main,'name') : ''}</div>
        <h2 id="drawer-title">${title}</h2>
        <span class="level">${levelLabel(e.level)}</span>
      </div>
      <button class="drawer-close" data-close-drawer aria-label="${S('drawerClose')}">✕</button>
    </div>
    <div class="drawer-nav">
      <button data-prev-entry ${prev?'':'disabled'} aria-label="${S('drawerPrev')}">← ${prev?L(prev,'title'):S('drawerStart')}</button>
      <span class="pos">${idx+1} / ${siblings.length}</span>
      <button data-next-entry ${next?'':'disabled'} aria-label="${S('drawerNext')}">${next?L(next,'title'):S('drawerEnd')} →</button>
    </div>
    <div class="drawer-body">
      ${sections.map(([h,body])=>`<section><h3>${h}</h3>${body}</section>`).join('')}
    </div>
  `;
}

/* =========================================================================
   EVENTS
   ========================================================================= */
function bindGlobalEvents(){
  $app.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const nav = btn.dataset.nav;
      if(nav==='home'){ state.view='home'; state.mainId=null; state.subId=null; }
      if(nav==='subcats'){ state.view='subcats'; state.mainId=btn.dataset.main; state.subId=null; }
      if(nav==='entries'){ state.view='entries'; state.mainId=btn.dataset.main; state.subId=btn.dataset.sub; }
      render();
      document.getElementById('main-region').focus?.();
    });
  });

  $app.querySelectorAll('[data-open-entry]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.lastFocusedTile = btn;
      state.drawerEntry = btn.dataset.openEntry;
      render();
    });
  });

  $app.querySelectorAll('[data-close-drawer]').forEach(el=>{
    el.addEventListener('click', closeDrawer);
  });

  const prevBtn = $app.querySelector('[data-prev-entry]');
  const nextBtn = $app.querySelector('[data-next-entry]');
  if(prevBtn) prevBtn.addEventListener('click', ()=>stepEntry(-1));
  if(nextBtn) nextBtn.addEventListener('click', ()=>stepEntry(1));

  $app.querySelectorAll('[data-download-metaprompt]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const entry = entryById(btn.dataset.downloadMetaprompt);
      const mp = entry ? L(entry,'metaprompt') : null;
      if(!mp) return;
      const filename = mp.filename || ('metaprompt-'+(state.lang==='en'?'en':'de')+'.txt');
      let downloads = null;
      try{ downloads = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; }catch(err){ downloads = null; }
      if(downloads){
        try{ await downloads.save({filename, data: mp.text}); }
        catch(err){ if(err && err.code && err.code!=='declined' && err.code!=='rate_limited'){ btn.textContent = S('downloadUnavailable'); btn.disabled = true; } }
        return;
      }
      if(window.claude && window.claude.use){ btn.textContent = S('downloadUnavailable'); btn.disabled = true; return; }
      const blob = new Blob([mp.text], {type:'text/plain;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  });

  $app.querySelectorAll('[data-copy-metaprompt]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const entry = entryById(btn.dataset.copyMetaprompt);
      const mp = entry ? L(entry,'metaprompt') : null;
      if(!mp) return;
      let copied = false;
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          await navigator.clipboard.writeText(mp.text);
          copied = true;
        }
      }catch(err){ copied = false; }
      if(!copied){
        const pre = document.getElementById('metaprompt-text-'+entry.id);
        if(pre){
          const range = document.createRange();
          range.selectNodeContents(pre);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          try{ document.execCommand('copy'); copied = true; }catch(err){ /* selection remains for manual copy */ }
        }
      }
      const original = btn.innerHTML;
      btn.innerHTML = `${svgIcon('check',15)} ${S('copiedButton')}`;
      btn.disabled = true;
      setTimeout(()=>{ btn.innerHTML = original; btn.disabled = false; }, 2000);
    });
  });

  $app.querySelectorAll('[data-lang]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const lang = btn.dataset.lang;
      if(lang !== state.lang){
        state.lang = lang;
        render();
      }
    });
  });

  $app.querySelectorAll('[data-level]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const lvl = chip.dataset.level;
      state.levelFilter = (lvl==='__clear' || state.levelFilter===lvl) ? null : lvl;
      render();
      document.getElementById('search-input')?.focus();
    });
  });

  const searchInput = document.getElementById('search-input');
  if(searchInput){
    searchInput.addEventListener('input', (ev)=>{
      state.searchQuery = ev.target.value;
      state.view = state.searchQuery.trim() ? 'search' : 'home';
      if(state.view==='home'){ state.mainId=null; state.subId=null; }
      render();
      const el = document.getElementById('search-input');
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
  }

  if(state.drawerEntry){
    document.addEventListener('keydown', onDrawerKeydown);
  }
}

function stepEntry(dir){
  const e = entryById(state.drawerEntry);
  if(!e) return;
  const siblings = entriesFor(e.main, e.sub);
  const idx = siblings.findIndex(s=>s.id===e.id);
  const target = siblings[idx+dir];
  if(target){ state.drawerEntry = target.id; render(); focusDrawer(); }
}

function closeDrawer(){
  state.drawerEntry = null;
  render();
  if(state.lastFocusedTile && document.body.contains(state.lastFocusedTile)){
    state.lastFocusedTile.focus();
  }
}

function openDrawerAnim(){
  focusDrawer();
}
function focusDrawer(){
  const closeBtn = document.querySelector('.drawer-close');
  if(closeBtn) closeBtn.focus();
  document.addEventListener('keydown', onDrawerKeydown);
}
function onDrawerKeydown(ev){
  if(ev.key==='Escape'){
    document.removeEventListener('keydown', onDrawerKeydown);
    closeDrawer();
  }
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* init */
render();
</script>
</body>
</html>
