<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KI-Wissensartefakt — Nachschlagewerk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F3557;      --navy-soft:#E7ECF3;
    --blue:#2C6FA8;      --blue-soft:#E4EEF6;
    --green:#3E8361;     --green-soft:#E5F1EA;
    --orange:#D97F32;    --orange-soft:#FBEBDB;
    --plum:#7D3C54;      --plum-soft:#F1E3E9;
    --violet:#5B4A9E;    --violet-soft:#ECE8F6;
    --code-bg:#1B2230;   --code-ink:#E8EAF0;
    --overlay:rgba(20,26,40,.32);
    --ink:#1B2230;
    --ink-soft:#5B6472;
    --paper:#F6F7F9;
    --card:#FFFFFF;
    --line:#E1E4EA;
    --focus:#1F3557;
    --radius:14px;
    --shadow:0 1px 2px rgba(20,26,40,.06), 0 4px 16px rgba(20,26,40,.05);
    --font-head:'Montserrat',Calibri,Candara,'Segoe UI',Optima,Arial,sans-serif;
    --font-body:Calibri,Candara,'Segoe UI',Optima,Arial,sans-serif;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --navy:#8FB0DA; --navy-soft:#1E2A3C; --blue:#7FB3E0; --blue-soft:#1B2A38;
      --green:#7CC49E; --green-soft:#1A2C23; --orange:#EFA764; --orange-soft:#33251A;
      --plum:#D98AA8; --plum-soft:#32202A; --violet:#AFA2E8; --violet-soft:#26213A;
      --ink:#E7EAF0; --ink-soft:#A6ADBA; --paper:#12161D; --card:#1A1F28; --line:#2C3340;
      --focus:#8FB0DA; --code-bg:#0C0F14; --code-ink:#E8EAF0; --overlay:rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
      --navy:#8FB0DA; --navy-soft:#1E2A3C; --blue:#7FB3E0; --blue-soft:#1B2A38;
      --green:#7CC49E; --green-soft:#1A2C23; --orange:#EFA764; --orange-soft:#33251A;
      --plum:#D98AA8; --plum-soft:#32202A; --violet:#AFA2E8; --violet-soft:#26213A;
      --ink:#E7EAF0; --ink-soft:#A6ADBA; --paper:#12161D; --card:#1A1F28; --line:#2C3340;
      --focus:#8FB0DA; --code-bg:#0C0F14; --code-ink:#E8EAF0; --overlay:rgba(0,0,0,.55);
  }
  :root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  img{max-width:100%;}
  .brand-logo-link{background:#fff;padding:3px 6px;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--paper);
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-head);font-weight:700;margin:0;color:var(--ink);}
  p{margin:0 0 .6em 0;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:#c9d8e8;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  a{color:inherit;}

  /* Layout */
  #app{max-width:1180px;margin:0 auto;padding:28px 20px 80px;position:relative;}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  header.top .brand{display:flex;align-items:center;gap:10px;}
  header.top .brand .mark{width:34px;height:34px;border-radius:9px;background:var(--navy);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-head);font-weight:800;font-size:12px;letter-spacing:.3px;flex-shrink:0;}
  header.top h1{font-size:19px;letter-spacing:.2px;}
  header.top .sub{color:var(--ink-soft);font-size:13px;margin-top:1px;}

  .brand-logo-link{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;border-radius:10px;}
  .brand-logo-link:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
  .brand-logo-link img{height:46px;width:auto;display:block;}
  .header-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}

  .lang-toggle{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0;}
  .lang-toggle button{border:none;background:var(--card);color:var(--ink-soft);font-size:12.5px;font-weight:700;padding:7px 13px;letter-spacing:.3px;}
  .lang-toggle button[aria-pressed="true"]{background:var(--navy);color:var(--card);}
  .lang-toggle button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;}

  footer.legal .footer-credit{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:12px;}
  footer.legal .footer-credit a{color:var(--navy);font-weight:600;text-decoration:none;}
  footer.legal .footer-credit a:hover{text-decoration:underline;}
  footer.legal .footer-credit a:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  .searchbar{position:relative;flex:1;min-width:220px;max-width:420px;}
  .searchbar input{
    width:100%;padding:10px 14px 10px 38px;border-radius:999px;border:1.5px solid var(--line);
    font-size:14.5px;background:var(--card);color:var(--ink);
  }
  .searchbar input:focus{outline:3px solid rgba(31,53,87,.25); border-color:var(--navy);}
  .searchbar svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5;}

  /* Breadcrumb */
  nav.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:13.5px;color:var(--ink-soft);margin-bottom:18px;min-height:20px;}
  nav.crumbs button{background:none;border:none;padding:2px 4px;border-radius:6px;color:var(--ink-soft);font-size:13.5px;}
  nav.crumbs button:hover{background:var(--line);color:var(--ink);}
  nav.crumbs button:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
  nav.crumbs .sep{opacity:.5;}
  nav.crumbs .current{color:var(--ink);font-weight:600;}
  nav.crumbs .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:2px;}

  /* Filter row */
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .filter-chip{
    border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink-soft);
  }
  .filter-chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink);}
  .filter-chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  /* Grid */
  .grid{display:grid;gap:16px;}
  .grid.main-cats{grid-template-columns:repeat(3,1fr);}
  @media (max-width: 900px){ .grid.main-cats{grid-template-columns:repeat(2,1fr);} }
  @media (max-width: 560px){ .grid.main-cats{grid-template-columns:1fr;} }
  .grid.sub-cats{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));}
  .grid.entries{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}

  /* Main category tile */
  .tile-main{
    background:var(--card);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);
    padding:22px 20px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:158px;
    border-top:5px solid var(--tint,var(--navy));position:relative;transition:transform .12s ease, box-shadow .12s ease;
  }
  .tile-main:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,26,40,.10);}
  .tile-main:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
  .tile-main .icon-wrap{width:40px;height:40px;border-radius:10px;background:var(--tint-soft,var(--navy-soft));display:flex;align-items:center;justify-content:center;color:var(--tint,var(--navy));}
  .tile-main h2{font-size:16.5px;}
  .tile-main p.desc{color:var(--ink-soft);font-size:13.5px;margin:0;}
  .tile-main .count{margin-top:auto;font-size:12px;color:var(--tint,var(--navy));font-weight:700;}

  /* Sub category tile */
  .tile-sub{
    background:var(--card);border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow);
    padding:16px 16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:120px;
    border-left:4px solid var(--tint,var(--navy));
  }
  .tile-sub:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,26,40,.09);}
  .tile-sub:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
  .tile-sub .icon-wrap{width:30px;height:30px;border-radius:8px;background:var(--tint-soft,var(--navy-soft));display:flex;align-items:center;justify-content:center;color:var(--tint,var(--navy));}
  .tile-sub h3{font-size:14.5px;}
  .tile-sub p.desc{color:var(--ink-soft);font-size:12.8px;margin:0;}
  .tile-sub .count{font-size:11.5px;color:var(--tint,var(--navy));font-weight:700;}

  /* Entry tile */
  .tile-entry{
    background:var(--card);border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow);
    padding:14px 15px;text-align:left;display:flex;flex-direction:column;gap:7px;min-height:118px;
    border-top:3px solid var(--tint,var(--navy));
  }
  .tile-entry:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,26,40,.09);}
  .tile-entry:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}
  .tile-entry[aria-current="true"]{outline:2.5px solid var(--tint,var(--navy));outline-offset:1px;}
  .tile-entry .row-top{display:flex;align-items:center;gap:8px;}
  .tile-entry .icon-wrap{width:24px;height:24px;border-radius:7px;background:var(--tint-soft,var(--navy-soft));display:flex;align-items:center;justify-content:center;color:var(--tint,var(--navy));flex-shrink:0;}
  .tile-entry h4{font-size:13.8px;line-height:1.3;}
  .tile-entry p.teaser{color:var(--ink-soft);font-size:12.3px;margin:0;}
  .tile-entry .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;}
  .tag{font-size:10.8px;background:var(--paper);border:1px solid var(--line);color:var(--ink-soft);padding:2px 8px;border-radius:999px;}

  .section-head{display:flex;align-items:baseline;gap:10px;margin:6px 0 14px;}
  .section-head h2{font-size:20px;}
  .section-head .tint-dot{width:10px;height:10px;border-radius:50%;background:var(--tint,var(--navy));}
  .section-lead{color:var(--ink-soft);font-size:14px;margin:-6px 0 18px;max-width:640px;}

  .empty-state{padding:40px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state svg{opacity:.35;margin-bottom:10px;}

  /* Overlay + Drawer */
  .overlay{
    position:fixed;inset:0;background:var(--overlay);z-index:40;
    opacity:0;pointer-events:none;transition:opacity .18s ease;
  }
  .overlay.open{opacity:1;pointer-events:auto;}

  .drawer{
    position:fixed;top:0;right:0;height:100%;width:42%;max-width:640px;min-width:340px;
    background:var(--card);z-index:41;visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-8px 0 30px rgba(20,26,40,.18);
    transform:translateX(100%);transition:transform .22s ease;
    display:flex;flex-direction:column;border-top-left-radius:16px;border-bottom-left-radius:16px;
  }
  .drawer.open{transform:translateX(0);visibility:visible;}
  .drawer:not(.open){box-shadow:none;}
  @media (max-width: 1000px){ .drawer{width:60%;} }
  @media (max-width: 760px){ .drawer{width:86%;} }
  @media (max-width: 520px){ .drawer{width:100%;min-width:0;border-radius:0;} }

  .drawer-head{
    padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px;
    border-top:5px solid var(--tint,var(--navy));flex-shrink:0;
  }
  .drawer-head .icon-wrap{width:38px;height:38px;border-radius:10px;background:var(--tint-soft,var(--navy-soft));color:var(--tint,var(--navy));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .drawer-head .htext{flex:1;min-width:0;}
  .drawer-head .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--tint,var(--navy));margin-bottom:3px;}
  .drawer-head h2{font-size:18.5px;line-height:1.25;}
  .drawer-head .level{display:inline-block;margin-top:6px;font-size:11px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);padding:2px 9px;border-radius:999px;}
  .drawer-close{background:none;border:none;color:var(--ink-soft);border-radius:8px;padding:8px;flex-shrink:0;}
  .drawer-close:hover{background:var(--paper);color:var(--ink);}
  .drawer-close:focus-visible{outline:2px solid var(--focus);}

  .drawer-nav{display:flex;justify-content:space-between;align-items:center;padding:9px 20px;border-bottom:1px solid var(--line);flex-shrink:0;background:var(--paper);}
  .drawer-nav button{background:none;border:none;font-size:12.8px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:7px;}
  .drawer-nav button:hover:not(:disabled){background:var(--card);color:var(--ink);}
  .drawer-nav button:disabled{opacity:.35;cursor:default;}
  .drawer-nav button:focus-visible{outline:2px solid var(--focus);}
  .drawer-nav .pos{font-size:12px;color:var(--ink-soft);}

  .drawer-body{padding:18px 20px 32px;overflow-y:auto;flex:1;}
  .drawer-body section{margin-bottom:20px;}
  .drawer-body section h3{font-size:13px;text-transform:uppercase;letter-spacing:.3px;color:var(--tint,var(--navy));margin-bottom:7px;}
  .drawer-body section .body-text{font-size:14.3px;color:var(--ink);}
  .drawer-body ul{margin:0;padding-left:20px;font-size:14.3px;}
  .drawer-body li{margin-bottom:5px;}
  .drawer-body .note{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.8px;color:var(--ink-soft);}
  .drawer-body .related-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .related-chip{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:12.8px;color:var(--ink);text-align:left;}
  .related-chip:hover{border-color:var(--tint,var(--navy));background:var(--tint-soft,var(--navy-soft));}
  .related-chip:focus-visible{outline:2px solid var(--focus);}
  .providers{font-size:13px;color:var(--ink-soft);}

  .metaprompt-instruction{font-size:13.5px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
  .metaprompt-block{
    font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:12.3px;line-height:1.6;
    background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:14px 15px;white-space:pre-wrap;word-break:break-word;
    max-height:340px;overflow-y:auto;margin:0 0 10px;border:1px solid #2b3244;
  }
  .copy-btn{
    display:inline-flex;align-items:center;gap:7px;background:var(--navy);color:var(--card);border:none;border-radius:999px;
    padding:9px 16px;font-size:13px;font-weight:600;
  }
  .copy-btn:hover{filter:brightness(1.12);}
  .copy-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .copy-btn[disabled]{background:var(--green);cursor:default;}
  .metaprompt-actions{display:flex;flex-wrap:wrap;gap:10px;}
  .copy-btn.download-btn{background:var(--card);color:var(--navy);border:1.5px solid var(--navy);}
  .copy-btn.download-btn:hover{background:var(--navy-soft);}

  footer.legal{margin-top:52px;padding-top:18px;border-top:1px solid var(--line);font-size:11.8px;color:var(--ink-soft);line-height:1.6;}

  .visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  .home-title{margin-bottom:6px;}
  .home-sub{color:var(--ink-soft);font-size:14.5px;max-width:600px;margin-bottom:26px;}
</style>
</head>
<body>
<div id="app"></div>

<script>

const ENTRIES = [{"id": "g1", "title": "Wie funktioniert eine KI? Die Grundbegriffe als Gesamtsystem", "type": "Konzept", "main": "prompting", "sub": "ki_verstehen", "icon": "book", "level": "Grundlagen", "tags": ["LLM", "Training", "Parameter", "Agentic AI"], "shortDef": "Chatbot, LLM, Training, Parameter, Prompt, Skill und Agentic AI sind keine losen Schlagworte, sondern Teile eines Ablaufs: Ein trainiertes Sprachmodell erzeugt auf Basis von Prompt und Kontext eine Antwort — und kann mit Werkzeugen erweitert werden.", "explain": "Der Ablauf in vereinfachter Form:<br><br>(1) <strong>Training</strong> — ein Sprachmodell lernt aus sehr großen Textmengen, welche Wörter und Zusammenhänge wahrscheinlich aufeinander folgen.<br>(2) Das Ergebnis ist das <strong>LLM</strong> (Large Language Model); sein „Wissen“ steckt in Milliarden von <strong>Parametern</strong> — Gewichten, keine Datenbank mit gespeicherten Fakten.<br>(3) Der <strong>Chatbot</strong> ist die Oberfläche, über die wir mit dem Modell sprechen.<br>(4) Der <strong>Prompt</strong> plus Kontext — hochgeladene Dateien, Projekt, Memory, Websuche — bestimmt, was das Modell als Antwort erzeugt.<br>(5) <strong>Skills</strong> und <strong>Konnektoren</strong> erweitern das Modell um Anleitungen und Zugriff auf andere Tools.<br>(6) Bei <strong>Agentic AI</strong> plant und erledigt die KI mehrere Schritte selbstständig.<br><br>Aus diesem Aufbau erklären sich auch die typischen Schwächen: <strong>Halluzinationen</strong> entstehen, weil das Modell plausible statt geprüfte Antworten erzeugt; <strong>Bias</strong> (Verzerrungen) stammt aus den Trainingsdaten; und das Modell kennt die Welt nur bis zu seinem Trainingsstand, wenn es nicht im Web sucht.", "usefulFor": "Ein Grundverständnis, um Ergebnisse richtig einzuordnen, Fehler zu erklären und Werkzeuge passend auszuwählen.", "useCases": ["Im Workshop die Buzzwords sammeln und gemeinsam zu einem Ablaufschema ordnen", "Erklären, warum ein Chatbot eine Quelle „erfinden“ kann", "Verstehen, warum ein Projekt oder Memory bessere Antworten liefert als ein leerer Chat"], "example": "Die Begriffe Chatbot, LLM, Parameter, Training, Datenbasis, Skill, Agentic AI und Prompt auf Karten schreiben und von den Teilnehmenden in eine Reihenfolge bringen lassen: Was entsteht zuerst, was baut worauf auf?", "strengths": ["Macht Stärken und Schwächen der KI nachvollziehbar", "Hilft, neue Produktnamen schnell einzuordnen"], "limitations": ["Stark vereinfachte Darstellung — technische Details unterscheiden sich je nach Modell"], "mistakes": ["Ein Sprachmodell für eine Datenbank oder Suchmaschine halten", "Flüssig formulierte Antworten mit geprüftem Wissen verwechseln"], "related": ["g2", "p8", "p1", "a1", "k1", "f14"], "providers": "Modellunabhängig", "note": null}, {"id": "g2", "title": "Ethik und verantwortlicher Umgang mit KI", "type": "Konzept", "main": "prompting", "sub": "ki_verstehen", "icon": "shield", "level": "Grundlagen", "tags": ["Risiken", "Verantwortung", "KI-Kompetenz"], "shortDef": "KI bringt große Stärken mit — und Risiken, die man kennen und aktiv steuern muss. Der wirksamste Hebel ist fast immer Bildung: Wer versteht, wie KI arbeitet, nutzt sie verantwortlich.", "explain": "Stärken: KI spart Zeit bei Routinearbeit, macht Wissen zugänglicher und unterstützt Kreativität, Analyse und Barrierefreiheit. Schwächen und Risiken: Halluzinationen und Fehler, Verzerrungen (Bias) aus den Trainingsdaten, Datenschutz- und Vertraulichkeitsfragen, ungeklärte Urheber- und Nutzungsrechte, mangelnde Nachvollziehbarkeit, schleichender Kompetenzverlust durch zu viel Delegation, Abhängigkeit von wenigen Anbietern sowie Energie- und Ressourcenverbrauch. Umgang mit den Risiken: Weiterbildung und KI-Kompetenz aufbauen, Ergebnisse durch Menschen prüfen lassen, KI-Einsatz transparent machen, sparsam mit Daten umgehen (anonymisieren, lokale Modelle nutzen), klare Regeln in der Organisation vereinbaren. In der EU verpflichtet die KI-Verordnung (AI Act) Organisationen, die KI einsetzen, ohnehin dazu, für ausreichende KI-Kompetenz ihrer Beschäftigten zu sorgen.", "usefulFor": "Die Abschlussreflexion eines Workshops, die Entwicklung von KI-Leitlinien im Team und jede Entscheidung über den Einsatz von KI bei sensiblen Aufgaben.", "useCases": ["Im Team Stärken, Risiken und Gegenmaßnahmen sammeln und priorisieren", "Leitlinien für den KI-Einsatz in der eigenen Abteilung entwerfen", "Vor einer neuen Anwendung prüfen: Welche Daten fließen wohin, wer prüft das Ergebnis?"], "example": "Drei Flipcharts: „Stärken“, „Schwächen und Risiken“, „Umgang mit Risiken“. In fast jeder Gruppe landen Bildung, Weiterbildung und verantwortlicher Umgang ganz oben auf dem dritten Chart.", "strengths": ["Schafft eine gemeinsame Grundlage für verantwortlichen KI-Einsatz", "Verbindet Chancen und Risiken statt Euphorie oder Ablehnung"], "limitations": ["Rechtliche Fragen (Datenschutz, Urheberrecht, AI Act) im Einzelfall mit Fachstellen klären"], "mistakes": ["Risiken nur benennen, aber keine konkreten Gegenmaßnahmen vereinbaren", "Verantwortung an die KI delegieren statt beim Menschen zu lassen"], "related": ["g1", "p8", "c7", "l1"], "providers": "Modellunabhängig", "note": null}, {"id": "p1", "title": "Die Bausteine eines guten Prompts", "type": "Konzept", "main": "prompting", "sub": "grundlagen", "icon": "compass", "level": "Grundlagen", "tags": ["Ziel", "Kontext", "Rolle", "Format"], "shortDef": "Ein guter Prompt benennt Ziel, Kontext, Rolle, Aufgabe, gewünschtes Ausgabeformat und Einschränkungen — je klarer diese sechs Bausteine, desto passgenauer die Antwort.", "explain": "Fehlt einer dieser Bausteine, füllt die KI die Lücke mit einer Annahme — nicht immer der richtigen. Wer Ziel und Format vorab benennt, erspart sich Nachbesserungen.", "usefulFor": "Immer dann, wenn eine Antwort in einer bestimmten Form, Länge oder Perspektive gebraucht wird.", "useCases": ["Eine E-Mail in einem bestimmten Ton verfassen lassen", "Eine Analyse mit vorgegebener Gliederung anfordern", "Eine Zielgruppe explizit benennen, damit das Sprachniveau passt"], "example": "Statt „Schreib mir was über Feedback\" besser: „Schreibe als erfahrene Führungskraft einen 150-Wörter-Leitfaden für Führungskräfte ohne HR-Hintergrund, der drei konkrete Feedback-Regeln in Stichpunkten nennt.\"", "strengths": ["Reduziert Nachfragen und Fehlinterpretationen", "Lässt sich auf jede Aufgabe übertragen", "Funktioniert plattformübergreifend"], "limitations": ["Zu viele Vorgaben auf einmal können einen Prompt unübersichtlich machen", "Ersetzt keine fachliche Prüfung des Ergebnisses"], "mistakes": ["Nur die Aufgabe nennen, aber kein Ziel", "Format offenlassen und sich über eine unpassende Antwortlänge wundern"], "related": ["p2", "p3", "p8"], "providers": "Modellunabhängig", "note": null}, {"id": "p2", "title": "Zero-Shot, One-Shot und Few-Shot-Prompting", "type": "Konzept", "main": "prompting", "sub": "grundlagen", "icon": "layers", "level": "Grundlagen", "tags": ["Beispiele", "Steuerung"], "shortDef": "Diese drei Begriffe beschreiben, wie viele Beispiele einem Prompt mitgegeben werden: keins (Zero-Shot), eines (One-Shot) oder mehrere (Few-Shot).", "explain": "Beispiele zeigen der KI, wie ein Ergebnis aussehen soll, statt es nur zu beschreiben. Je uneindeutiger die Aufgabe, desto mehr helfen ein oder zwei gute Beispiele.", "usefulFor": "Aufgaben mit einem bestimmten Stil, Format oder wiederkehrenden Muster, z. B. Kategorisierung oder Textumformulierung.", "useCases": ["Protokolle immer im gleichen Format zusammenfassen lassen", "E-Mails im eigenen Schreibstil generieren, anhand von zwei Beispielmails", "Daten nach einem vorgegebenen Muster klassifizieren"], "example": "„Hier sind zwei Beispiele, wie ich Teilnehmerfeedback zusammenfasse: [Beispiel 1] [Beispiel 2]. Fasse nun dieses dritte Feedback im gleichen Stil zusammen: [Text].\"", "strengths": ["Sehr wirksam bei Formatvorgaben", "Reduziert den Erklärungsaufwand in Textform"], "limitations": ["Schlechte Beispiele führen zu schlechten Ergebnissen", "Bei sehr langen Beispielen wird der Prompt unhandlich"], "mistakes": ["Widersprüchliche Beispiele mischen", "Ein einzelnes Beispiel als absolute Regel behandeln"], "related": ["p1", "p6"], "providers": "Modellunabhängig", "note": null}, {"id": "p3", "title": "Rollen-Prompting", "type": "Methode", "main": "prompting", "sub": "methoden", "icon": "users", "level": "Grundlagen", "tags": ["Perspektive", "Ton"], "shortDef": "Der KI eine Rolle oder Expertise zuweisen („Agiere als …\"), um Perspektive, Fachsprache und Tiefe der Antwort zu steuern.", "explain": "Eine Rolle wirkt wie ein Filter: Sie lenkt, welches Wissen und welchen Ton das Modell bevorzugt aktiviert. Sie macht ein Modell nicht fachlich kompetenter, hilft aber, den Blickwinkel zu setzen.", "usefulFor": "Wenn eine bestimmte fachliche Perspektive oder ein bestimmter Kommunikationsstil gewünscht ist.", "useCases": ["„Agiere als erfahrene Personalentwicklerin\" für einen Feedback-Leitfaden", "„Erkläre wie einer Kollegin ohne technischen Hintergrund\" für Verständlichkeit", "Eine Gegenposition aus einer anderen Rolle einholen, um blinde Flecken zu finden"], "example": "„Agiere als Moderator einer Konfliktklärung zwischen zwei Abteilungen und schlage drei Gesprächsschritte vor.\"", "strengths": ["Schnell einsetzbar", "Verbessert Ton und Fachsprache spürbar"], "limitations": ["Verleiht keine echte Fachautorität — Ergebnisse bleiben prüfungspflichtig", "Kann bei widersprüchlichen Rollenanweisungen inkonsistent wirken"], "mistakes": ["Die Rolle mit echter fachlicher Zertifizierung verwechseln"], "related": ["p1", "p4"], "providers": "Modellunabhängig", "note": null}, {"id": "p4", "title": "Strukturierte Ausgabeformate", "type": "Methode", "main": "prompting", "sub": "methoden", "icon": "table", "level": "Aufbau", "tags": ["Tabellen", "Listen", "JSON"], "shortDef": "Explizit ein Ausgabeformat vorgeben — Tabelle, Liste, Stichpunkte, JSON — statt es dem Zufall zu überlassen.", "exp perfekter Erstprompt", "Reduziert Frustration bei komplexen Aufgaben"], "limitations": ["Bei sehr vielen Iterationsschritten kann der Kontext unübersichtlich werden"], "mistakes": ["Bei einem unpassenden Ergebnis komplett neu anfangen, statt gezielt nachzusteuern"], "related": ["p6", "p10"], "providers": "Modellunabhängig", "note": null}, {"id": "p6", "title": "Rückfragen durch den Chatbot aktiv nutzen", "type": "Methode", "main": "prompting", "sub": "methoden", "icon": "chat", "level": "Aufbau", "tags": ["Dialog", "Klärung"], "shortDef": "Statt alle Details selbst vorwegzunehmen, den Chatbot explizit bitten, bei Unklarheiten nachzufragen, bevor er antwortet.", "explain": "Ein einfacher Zusatz wie „Stelle mir vorab Rückfragen, falls etwas unklar ist\" verhindert, dass die KI eine plausible, aber falsche Annahme trifft und darauf aufbaut.", "usefulFor": "Komplexe oder mehrdeutige Aufgaben mit vielen möglichen Interpretationen.", "useCases": ["Vor der Erstellung eines Konzepts gezielt Rahmenbedingungen abfragen lassen", "Bei einer offenen Kreativaufgabe die Zielgruppe klären lassen"], "example": "„Bevor du das Konzept schreibst: Welche Informationen brauchst du noch von mir?\"", "strengths": ["Verhindert aufwendige Fehlinterpretationen", "Macht eigene Lücken im Briefing sichtbar"], "limitations": ["Bei sehr einfachen Aufgaben unnötig und verlangsamt den Ablauf"], "mistakes": ["Rückfragen ignorieren und trotzdem eine vage Antwort erwarten"], "related": ["p5", "p1"], "providers": "Modellunabhängig", "note": null}, {"id": "p7", "title": "Promptketten für mehrstufige Aufgaben", "type": "Methode", "main": "prompting", "sub": "methoden", "icon": "chain", "level": "Vertiefung", "tags": ["Zerlegung", "Workflow"], "shortDef": "Eine komplexe Aufgabe in mehrere aufeinander aufbauende Prompts zerlegen, statt sie in einen einzigen Prompt zu packen.", "explain": "Große Aufgaben — etwa „Erstelle ein komplettes Workshop-Konzept\" — liefern bessere Ergebnisse, wenn sie in Etappen bearbeitet werden: erst Gliederung, dann Inhalte je Abschnitt, dann Feinschliff.", "usefulFor": "Umfangreiche Erstellungsaufgaben wie Konzepte, Berichte oder mehrteilige Dokumente.", "useCases": ["Erst eine Gliederung abstimmen, dann Abschnitt für Abschnitt ausarbeiten lassen", "Einen Foliensatz erst inhaltlich, dann gestalterisch entwickeln", "Ein Datenanalyse-Ergebnis erst berechnen, dann interpretieren lassen"], "example": "Schritt 1: „Schlage eine Gliederung für ein 3-teiliges Online-Seminar vor.\" Schritt 2: „Arbeite nun Teil 2 im Detail aus.\"", "strengths": ["Bessere Kontrolle über Zwischenergebnisse", "Fehler fallen früher auf, bevor viel Arbeit investiert wurde"], "limitations": ["Erfordert etwas mehr Zeit und aktive Steuerung als ein einzelner Prompt"], "mistakes": ["Alle Anforderungen in einen einzigen, überladenen Prompt packen"], "related": ["p5", "p10"], "providers": "Modellunabhängig", "note": null}, {"id": "p8", "title": "Kritische Prüfung von KI-Antworten", "type": "Konzept", "main": "prompting", "sub": "pruefung", "icon": "check", "level": "Grundlagen", "tags": ["Faktencheck", "Qualität"], "shortDef": "KI-Antworten sind Vorschläge, keine geprüften Fakten — Zahlen, Zitate und Quellenangaben sollten vor Verwendung eigenständig verifiziert werden.", "explain": "Chatbots können sprachlich überzeugend klingen und dabei inhaltlich falsch liegen (sogenannte „Halluzinationen\"). Besonders bei Zahlen, Namen, Gesetzestexten und Zitaten lohnt sich ein zweiter Blick.", "usefulFor": "Jede Verwendung von KI-Ergebnissen, die weitergegeben oder für Entscheidungen genutzt werden.", "useCases": ["Statistiken vor der Verwendung in einer Präsentation gegenprüfen", "Rechtliche oder medizinische Aussagen nicht ungeprüft übernehmen", "Bei Unsicherheit gezielt nach der Quelle fragen"], "example": "„Woher stammt diese Zahl? Kannst du eine Quelle nennen?\" — und diese Quelle dann selbst nachschlagen.", "strengths": ["Schützt vor peinlichen oder folgenreichen Fehlern", "Schärft den eigenen kritischen Blick"], "limitations": ["Erfordert zusätzlichen Zeitaufwand, besonders bei sicherheitskritischen Themen"], "mistakes": ["Konkrete Zahlen oder Zitate ungeprüft in offizielle Dokumente übernehmen"], "related": ["p1", "p9"], "providers": "Modellunabhängig", "note": null}, {"id": "p9", "title": "Typische Fehler beim Prompting", "type": "Konzept", "main": "prompting", "sub": "fehler", "icon": "warning", "level": "Grundlagen", "tags": ["Stolperfallen"], "shortDef": "Häufige Ursachen für enttäuschende Antworten: fehlender Kontext, unklares Ziel, zu vage Formulierungen, keine Formatvorgabe.", "explain": "Die meisten unbefriedigenden Antworten liegen nicht am Modell, sondern am Prompt. Wer die eigene Anfrage noch einmal liest, findet die Lücke oft selbst.", "usefulFor": "Als Checkliste, wenn eine Antwort nicht überzeugt.", "useCases": ["Prüfen, ob die Zielgruppe genannt wurde", "Prüfen, ob die gewünschte Länge angegeben wurde", "Prüfen, ob ein Beispiel geholfen hätte"], "example": "Statt zu resignieren („die KI versteht mich nicht\"), die eigene Anfrage um Ziel, Kontext und Format ergänzen und erneut senden.", "strengths": ["Schnelle Selbsthilfe ohne neues Werkzeug"], "limitations": ["Ersetzt keine strukturierte Prompt-Vorlage bei wiederkehrenden Aufgaben"], "mistakes": ["Zu kurze, kontextlose Anfragen („mach das besser\") ohne konkrete Angabe, was besser bedeutet"], "related": ["p1", "p8"], "providers": "Modellunabhängig", "note": null}, {"id": "p10", "title": "Prompt-Verfeinerung als Routine", "type": "Strategie", "main": "prompting", "sub": "methoden", "icon": "bulb", "level": "Vertiefung", "tags": ["Vorlagen", "Wiederverwendung"], "shortDef": "Bewährte Prompts als persönliche Vorlagen sichern und für wiederkehrende Aufgaben systematisch weiterentwickeln.", "explain": "Wer für wiederkehrende Aufgaben — etwa Sitzungsprotokolle oder Teilnehmerfeedback — eine funktionierende Prompt-Formulierung findet, sollte sie als Vorlage aufbewahren und bei Bedarf gezielt anpassen, statt jedes Mal neu zu formulieren.", "usefulFor": "Regelmäßig wiederkehrende Aufgabentypen im Arbeitsalltag.", "useCases": ["Eine persönliche Sammlung bewährter Prompt-Vorlagen anlegen", "Eine Vorlage für Protokollzusammenfassungen mehrfach wiederverwenden", "Team-Vorlagen für einheitliche Ergebnisse abstimmen"], "example": "Eine Prompt-Vorlage für „E-Mail-Antworten im eigenen Stil\" einmal ausarbeiten und danach nur noch den Einzelfall einsetzen.", "strengths": ["Spart auf Dauer erheblich Zeit", "Sorgt für konsistentere Ergebnisse im Team"], "limitations": ["Vorlagen sollten gelegentlich überprüft werden, da sich Modelle weiterentwickeln"], "mistakes": ["Eine einmal funktionierende Formulierung nie wieder hinterfragen"], "related": ["p5", "p7"], "providers": "Modellunabhängig", "note": null}, {"id": "p11", "title": "Metaprompt: Den perfekten Prompt gemeinsam entwickeln lassen", "type": "Vorlage", "main": "prompting", "sub": "metaprompt", "icon": "chain", "level": "Vertiefung", "tags": ["Iterativ", "Copy & Paste"], "shortDef": "Ein Metaprompt ist kein fertiger Prompt für eine konkrete Aufgabe, sondern ein Prompt, der den Chatbot anweist, gemeinsam mit dir Schritt für Schritt den optimalen Prompt für dein eigentliches Anliegen zu entwickeln.", "explain": "Nach dem Einfügen übernimmt der Chatbot die Führung: Er fragt zunächst kurz nach deinem Ziel oder Thema. Danach läuft ein iterativer Ablauf über mehrere Runden: Du bekommst jeweils einen aktuellen Prompt-Entwurf, drei auswählbare Ergänzungsoptionen (a/b/c) und drei offene Rückfragen, die sich inhaltlich nicht mit den Ergänzungen überschneiden. Du antwortest — etwa durch Auswahl einer Option oder Beantwortung einer Frage —, der Chatbot baut deine Antwort in den nächsten Entwurf ein, und die Runde beginnt von vorn, bis der Prompt fertig ist.", "usefulFor": "Situationen, in denen ein hochwertiger, gut durchdachter Prompt für eine wiederkehrende oder komplexe Aufgabe entstehen soll, ohne dass du ihn komplett allein durchdenken musst.", "useCases": ["Einen wiederverwendbaren Prompt für eine bestimmte Aufgabe wie Protokollzusammenfassungen entwickeln lassen", "Einen komplexen Prompt für ein neues Workshop-Format Schritt für Schritt gemeinsam erarbeiten", "Einen bestehenden, unbefriedigenden Prompt systematisch verbessern lassen"], "example": "Nach dem Einfügen begrüßt dich der Chatbot kurz und fragt nach dem Thema. Antwortest du z. B. „Ein Prompt für Feedbackgespräche\", erhältst du einen ersten Entwurf plus drei Auswahloptionen und drei Rückfragen — und verfeinerst den Prompt in den folgenden Runden weiter.", "strengths": ["Erspart das eigenständige Durchdenken von Rolle, Kontext, Format und Zielen", "Berücksichtigt systematisch bewährte Prompt-Engineering-Techniken", "Bleibt durch die feste Struktur auch über mehrere Runden hinweg übersichtlich"], "limitations": ["Der Prozess dauert mehrere Runden und ist dadurch langsamer als ein direkt formulierter Prompt", "Funktioniert am besten, wenn eigene Antworten auf die Rückfragen möglichst konkret ausfallen"], "mistakes": ["Den Metaprompt nur teilweise oder verändert einfügen, statt ihn vollständig zu kopieren", "Mitten im Prozess eigene, abweichende Formatierungen dazwischenmischen"], "related": ["p1", "p7", "p10"], "providers": "Modellunabhängig — funktioniert mit ChatGPT, Claude, Gemini und vergleichbaren Chatbots", "note": null, "metaprompt": {"instruction": "Kopiere den gesamten folgenden Text unverändert und füge ihn als erste Nachricht in einen Chatbot ein (z. B. ChatGPT, Claude oder Gemini). Den Rest übernimmt der Chatbot von selbst.", "text": "Du bist mein Experte für Prompt-Engineering. Dein Ziel ist es, mir dabei zu helfen, den effektivsten Prompt für moderne LLMs (wie Gemini, ChatGPT, Claude) zu entwickeln. \n\nDer finale Prompt soll aus meiner Perspektive geschrieben sein (Nutzer spricht direkt zum Chatbot, z. B. in der Form: \"Du bist Experte für [Thema]... Ich möchte, dass du...\").\n\n### Deine Aufgaben & Arbeitsweise:\nWir werden diesen Prompt iterativ in mehreren Schritten erarbeiten. Du darfst in der ersten Runde keine Details eigenmächtig erfinden, sondern baust den Prompt Schritt für Schritt auf Basis meiner Rückmeldungen auf.\n\n### Dein Ausgabeformat (für jede Iteration):\n\n**Prompt:**\n> [Formuliere hier den aktuellen Entwurf des Prompts. Verwende bewährte Prompt-Engineering-Techniken (z. B. Rolle, Kontext, Ziel, Formatvorgaben). Hebe diesen gesamten Abschnitt ausschließlich mit dem Markdown-Zeichen \">\" (Blockquote) hervor. Verwende keine zusätzlichen äußeren Anführungszeichen.]\n\n**Mögliche Ergänzungen:**\n[Biete mir genau drei präzise Optionen (a, b, c) an, die direkt in den Prompt integriert werden können, um ihn qualitativ aufzuwerten (z. B. Tonalität, Zielgruppe, spezifische Frameworks). Diese Optionen müssen direkt auswählbar sein.]\n* (a) [Option A]\n* (b) [Option B]\n* (c) [Option C]\n\n**Fragen:**\n[Formuliere genau drei nummerierte, offene Fragen, um Lücken im Prompt zu schließen. Wichtig: Diese Fragen dürfen sich inhaltlich nicht mit den \"Möglichen Ergänzungen\" überschneiden!]\n1. [Frage 1]\n2. [Frage 2]\n3. [Frage 3]\n\n**Nächste Schritte:**\n[Gib mir eine kurze, präzise Anleitung, was ich als Nächstes tun soll (z. B. Fragen beantworten, Optionen wählen oder direkt Änderungen diktieren).]\n\n---\n\n### Wichtige Verhaltensregeln für dich:\n1. **Keine Vorannahmen:** Wenn Informationen fehlen, frage danach, statt sie zu raten.\n2. **Konsistenz:** Behalte dieses exakte Ausgabeformat in JEDER Iteration bei, bis ich sage, dass der Prompt fertig ist.\n3. **Iterativer Einbau:** Wenn ich dir antworte (z. B. \"Ich wähle (a) und auf Frage 1 antworte ich...\"), baust du diese Informationen direkt in den neuen Prompt-Entwurf unter \"Prompt:\" ein und generierst neue Fragen/Ergänzungen für den nächsten Feinschliff.\n\n### Start-Trigger:\nBevor wir den Prozess starten, begrüße mich kurz und frage mich einfach, welches Ziel oder Thema der Prompt haben soll, den wir heute entwickeln wollen. Zeige in deiner allerersten Antwort noch keine der oben genannten Sektionen (Prompt, Ergänzungen, Fragen)."}}, {"id": "p12", "title": "Self-Consistency-Prompting: Mehrere Lösungswege vergleichen lassen", "type": "Methode", "main": "prompting", "sub": "methoden", "icon": "scale", "level": "Vertiefung", "tags": ["Mehrere Lösungswege", "Qualitätssicherung"], "shortDef": "Den Chatbot bitten, dieselbe Aufgabe über mehrere unabhängige Lösungswege zu durchdenken und die Ergebnisse anschließend zu vergleichen, um die wahrscheinlichste oder beste Lösung auszuwählen.", "explain": "Statt sich auf eine einzelne Argumentationskette zu verlassen, entwickelt das Modell mehrere unterschiedliche Lösungsansätze für dieselbe Frage und gleicht sie danach ab. Stimmen mehrere unabhängige Wege im Ergebnis überein, steigt das Vertrauen in die Antwort; bei Abweichungen lässt sich gezielt nachfragen, welcher Weg am plausibelsten ist.", "usefulFor": "Aufgaben mit einer eindeutig richtigen oder besten Lösung, bei denen Zuverlässigkeit besonders wichtig ist — etwa Rechenaufgaben, Logikprobleme oder Entscheidungsfragen mit klaren Kriterien.", "useCases": ["Eine Kostenkalkulation über zwei unabhängige Rechenwege gegenprüfen lassen", "Eine Entscheidung zwischen mehreren Optionen über verschiedene Bewertungsansätze absichern lassen", "Eine logische Schlussfolgerung durch mehrere unabhängige Argumentationsketten verifizieren lassen"], "example": "„Löse diese Aufgabe auf drei unabhängigen Wegen, ohne dich vom ersten Ansatz beeinflussen zu lassen. Vergleiche anschließend die drei Ergebnisse und nenne mir die wahrscheinlichste Lösung mit Begründung.\"", "strengths": ["Erhöht die Zuverlässigkeit bei Aufgaben mit eindeutiger Lösung", "Macht Unsicherheiten sichtbar, wenn die Wege zu unterschiedlichen Ergebnissen kommen"], "limitations": ["Braucht mehr Zeit und Text als ein einzelner Lösungsweg", "Bei kreativen oder rein subjektiven Aufgaben ohne eindeutig „richtige\" Antwort weniger hilfreich"], "mistakes": ["Nur nach einem einzigen Lösungsweg fragen und trotzdem hohe Sicherheit erwarten", "Die verglichenen Lösungswege nicht wirklich unabhängig voneinander anfordern"], "related": ["p13", "p8", "p2"], "providers": "Modellunabhängig", "note": null}, {"id": "p13", "title": "Sichtbares Schritt-für-Schritt-Denken anfordern (Chain-of-Thought)", "type": "Methode", "main": "prompting", "sub": "methoden", "icon": "compass", "level": "Aufbau", "tags": ["Reasoning", "Nachvollziehbarkeit"], "shortDef": "Den Chatbot explizit bitten, seinen Gedankengang oder Lösungsweg offen darzulegen, bevor er zum Endergebnis kommt, statt nur die fertige Antwort zu liefern.", "explain": "Viele moderne Chatbots zeigen von sich aus einen sichtbaren „Denkprozess\" oder eine Zusammenfassung ihrer Überlegungen an (oft als Reasoning- oder Thinking-Modus bezeichnet). Unabhängig davon lässt sich dieses Verhalten auch gezielt per Prompt anfordern, etwa durch Formulierungen wie „Denke Schritt für Schritt\" oder „Erkläre zunächst deinen Lösungsweg, bevor du antwortest\". Das macht nachvollziehbar, wie eine Antwort zustande kam, und deckt Denkfehler oft schon vor der Endantwort auf.", "usefulFor": "Komplexere Aufgaben mit mehreren Zwischenschritten, bei denen Nachvollziehbarkeit und Fehlererkennung wichtig sind.", "useCases": ["Eine mehrschrittige Berechnung mit sichtbarem Rechenweg nachvollziehen lassen", "Eine Argumentation vor der Endempfehlung offenlegen lassen, um sie selbst zu prüfen", "Bei einem Reasoning-fähigen Modell die angezeigte Denkzusammenfassung gezielt für die eigene Prüfung nutzen"], "example": "„Denke zunächst Schritt für Schritt laut nach, welche Faktoren bei dieser Entscheidung eine Rolle spielen, und leite erst danach deine Empfehlung ab.\"", "strengths": ["Macht Zwischenschritte und mögliche Denkfehler sichtbar, statt nur ein Endergebnis zu präsentieren", "Erleichtert die eigene kritische Prüfung einer Antwort"], "limitations": ["Führt zu längeren Antworten und höherem Zeit- bzw. Ressourcenaufwand", "Ein sichtbarer Denkprozess ist kein Beweis für Richtigkeit — auch er sollte geprüft werden"], "mistakes": ["Den angezeigten Denkprozess unhinterfragt als Beleg für eine korrekte Antwort akzeptieren"], "related": ["p12", "p8", "p2"], "providers": "Modellunabhängig — viele aktuelle Chatbots zeigen einen Reasoning- oder Thinking-Modus nativ an", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "t1", "title": "ChatGPT", "type": "Werkzeug", "main": "tools", "sub": "multimodal", "icon": "chat", "level": "Grundlagen", "tags": ["Multimodal", "Anbieter: OpenAI"], "shortDef": "Multimodaler Chatbot von OpenAI für Text, Bild, Daten und Sprachein- bzw. -ausgabe — wie Google Gemini ein sehr breiter, kreativer Allrounder für den Arbeitsalltag.", "explain": "ChatGPT und Google Gemini lassen sich in der Praxis fast wie ein Geschwisterpaar betrachten: Beide sind extrem vielseitig, im Alltag sehr kreativ einsetzbar und einander in Funktionsumfang und Nutzungsgefühl auffallend ähnlich. Seit Oktober 2026 läuft ChatGPT mit der GPT-6-Familie (aktuelle Modellnamen: siehe Eintrag „Modellstand“). Neu ist Intelligent UI: ChatGPT baut Antworten bei Bedarf als interaktive Oberfläche mit Buttons, Diagrammen, Rechnern oder Checklisten direkt im Chat. Daneben gibt es Sites (kleine Websites aus dem Chat), Pages, Slides, Projekte, Plugins zur Anbindung anderer Tools sowie in der Desktop-App die Bereiche Chat, Work (mehrstufige Aufgaben) und Codex. Die bisherigen Custom GPTs laufen im Dezember 2026 aus und werden durch Plugins ersetzt.", "usefulFor": "Breite Alltagsaufgaben von Textentwürfen über Recherche bis zu einfacher Datenanalyse.", "useCases": ["Texte entwerfen und überarbeiten", "Einfache Datentabellen auswerten lassen", "Eine Erklärung als interaktive Antwort (Intelligent UI) anfordern, etwa als Rechner oder Diagramm", "Wiederkehrenden Kontext in einem Projekt bündeln"], "example": "Einen Foliensatz-Entwurf per Chat strukturieren lassen und anschließend als Ausgangspunkt für die eigene Präsentation nutzen.", "strengths": ["Breiter Funktionsumfang in einer Oberfläche", "Große Nutzerbasis und viel Dokumentation"], "limitations": ["Wie alle Chatbots nicht fehlerfrei bei Fakten und Zahlen", "Kostenlose und kostenpflichtige Stufen unterscheiden sich im Funktionsumfang", "Custom GPTs stellen den Betrieb im Dezember 2026 ein — Inhalte rechtzeitig sichern"], "mistakes": [], "related": ["t3", "t2", "t22", "f13", "a2"], "providers": "OpenAI", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "t21", "title": "Welcher Chatbot wofür? Eine Entscheidungshilfe", "type": "Strategie", "main": "tools", "sub": "orientierung", "icon": "compass", "level": "Grundlagen", "tags": ["Auswahl", "Überblick"], "shortDef": "Es gibt nicht den einen besten Chatbot — aber für typische Aufgaben klare Favoriten. Diese Übersicht ordnet die gängigen Werkzeuge nach Einsatzzweck.", "explain": "Kreative Alltagsarbeit, Texte, Bilder: ChatGPT oder Gemini. Lange Dokumente, Datenanalyse, interaktive Werkzeuge (Artefakte): Claude. Arbeit im Google-Workspace: Gemini. Arbeit in Microsoft 365: Copilot. Europäischer Anbieter, EU-Datenresidenz: Vibe (Mistral). Schnelle Recherche mit Quellen: Perplexity. Arbeiten mit eigenen Quellen und Lernmaterial erstellen: NotebookLM. Wissenschaftliche Literatur: Elicit, SciSpace oder Consensus. Überblicksartikel zu einem Thema: STORM. Vertrauliche Inhalte, die das Gerät nicht verlassen dürfen: ein lokales Modell, etwa über Ollama. Bei wichtigen Fragen lohnt es sich, zwei Chatbots parallel zu fragen und die Antworten zu vergleichen.", "usefulFor": "Die schnelle Orientierung, welches Werkzeug für eine konkrete Aufgabe den besten Einstieg bietet.", "useCases": ["Vor einer neuen Aufgabe kurz prüfen, welches Werkzeug passt", "Im Team gemeinsame Standardwerkzeuge festlegen", "Dieselbe Frage an zwei Chatbots stellen und die Antworten vergleichen"], "example": "Gallery Walk im Workshop: Je ein Plakat pro Chatbot, die Teilnehmenden notieren, wofür sie ihn in der Woche genutzt haben und wofür er sich bewährt hat.", "strengths": ["Schafft Orientierung in einem unübersichtlichen Markt", "Vermeidet, ein Werkzeug für alles zu nutzen"], "limitations": ["Die Stärken der Anbieter verschieben sich mit jedem Modellwechsel", "Welche Werkzeuge erlaubt sind, regelt oft die eigene Organisation"], "mistakes": ["Nur einen Chatbot kennen und für alles einsetzen", "Werkzeuge mit vertraulichen Daten nutzen, ohne die Datenverarbeitung zu prüfen"], "related": ["t22", "t1", "t2", "t3", "t4", "t17", "t20", "l1"], "providers": "Anbieterübergreifend", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "t22", "title": "Modellstand: Welche Modelle laufen gerade?", "type": "Konzept", "main": "tools", "sub": "orientierung", "icon": "layers", "level": "Grundlagen", "tags": ["Modelle", "Aktueller Stand"], "shortDef": "Die zentrale Übersicht über die aktuellen Sprachmodelle der großen Anbieter — damit die Einträge zu den einzelnen Chatbots nicht bei jedem Modellwechsel veralten.", "explain": "Die Modellnamen ändern sich alle paar Wochen — deshalb stehen sie gesammelt an dieser einen Stelle. Stand: 13. November 2026.<br><br><strong>OpenAI (ChatGPT):</strong> GPT-6-Familie — GPT-6 Sol in den bezahlten Tarifen, GPT-6 Luna in Free und Go, GPT-6 Astra als stärkste Reasoning-Option (Pro); zusätzlich GPT-6.1 Terra (seit Oktober 2026). Bilder: ChatGPT Images 2.6.<br><strong>Anthropic (Claude):</strong> Claude Opus 5.5, Sonnet 5.5 und Haiku 5.5; darüber die Mythos-Stufe, allgemein verfügbar als Claude Fable 5.2.<br><strong>Google (Gemini):</strong> Gemini 3.1 Pro und Gemini 3.8 Flash; Gemini 4 ist angekündigt, aber noch nicht veröffentlicht. Bilder: Nano Banana.<br><strong>Alibaba (Qwen):</strong> Qwen3.8-Max; Qwen 4 ist angekündigt, aber noch nicht veröffentlicht.<br><br>Welches Modell gerade läuft, zeigt im Chatbot meist die Modellauswahl.", "usefulFor": "Einordnen, mit welchem Modell man gerade arbeitet und ob ein Wechsel lohnt.", "useCases": ["Prüfen, ob der eigene Tarif das aktuelle Spitzenmodell enthält", "Bei auffällig schwachen Antworten auf ein stärkeres Modell wechseln"], "example": "Für eine einfache Umformulierung reicht ein schnelles Modell; für eine komplexe Analyse lohnt das stärkere Reasoning-Modell.", "strengths": ["Eine Stelle für alle Modellnamen", "Erleichtert den Vergleich zwischen Anbietern"], "limitations": ["Momentaufnahme — Namen und Verfügbarkeit ändern sich laufend und hängen vom Tarif ab"], "mistakes": ["Modellnamen mit Produktnamen verwechseln: ChatGPT ist der Chatbot, GPT-6 das Modell dahinter"], "related": ["t21", "t1", "t2", "t3", "t18", "g1"], "providers": "OpenAI, Anthropic, Google, Alibaba", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "t2", "title": "Claude", "type": "Werkzeug", "main": "tools", "sub": "multimodal", "icon": "chat", "level": "Grundlagen", "tags": ["Multimodal", "Anbieter: Anthropic", "Datenanalyse & Mathematik"], "shortDef": "Multimodaler Chatbot von Anthropic mit Fokus auf längere Dokumente, Dateiarbeit und einen agentenähnlichen Arbeitsmodus namens Cowork — gilt aktuell für viele als eines der leistungsfähigsten verfügbaren Sprachmodelle.", "explain": "Claude wird von Anthropic besonders weitreichend auf ethische Leitplanken hin trainiert und lehnt unangemessene oder grenzwertige Anfragen im Vergleich zu manchen anderen Chatbots tendenziell schneller ab — ein Aspekt, den viele Nutzer:innen als Vorteil empfinden. Eine weitere Stärke liegt in Datenanalyse, Mathematik und dem Umgang mit komplexen, mehrschrittigen Aufgaben. Zum Ökosystem gehören Projekte, Artefakte, Skills, Memory, Konnektoren, geplante Aufgaben (Scheduled Tasks) und der Arbeitsmodus Cowork (aktuelle Modellnamen: siehe Eintrag „Modellstand“). Besonders ist der Ansatz, Anwendungen in die KI zu holen: Dokumente, Tabellen, Präsentationen und kleine Werkzeuge entstehen direkt in Claude als Artefakte und lassen sich per Link teilen.", "usefulFor": "Dokumentenlastige Aufgaben, längere Analysen, Erstellung interaktiver Inhalte.", "useCases": ["Ein langes PDF zusammenfassen und Rückfragen dazu stellen", "Ein interaktives Arbeitsblatt oder eine Übersicht direkt im Chat erstellen", "Über Projekte wiederkehrenden Kontext für ein Thema bündeln", "Kurze animierte Erklärsequenzen (Motion Graphics) als HTML-Artefakt bauen lassen, die automatisch ablaufen — siehe die Vorlage „Motion Graphics als HTML-Animation“"], "example": "Ein Schulungskonzept aus mehreren Vorlagen-Dokumenten zusammenführen und als bearbeitbares Dokument ausgeben lassen.", "strengths": ["Starke Dokumenten- und Dateiarbeit", "Übersichtlicher Umgang mit langem Kontext", "Erstellt über Artefakte auch animierte Grafiken (Motion Graphics) ohne Videoschnitt-Software"], "limitations": ["Bildgenerierung nicht so im Fokus wie bei manchen Wettbewerbern"], "mistakes": [], "related": ["t1", "t3", "t22", "a1", "a2", "c1", "m7"], "providers": "Anthropic", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "t3", "title": "Google Gemini", "type": "Werkzeug", "main": "tools", "sub": "multimodal", "icon": "chat", "level": "Grundlagen", "tags": ["Multimodal", "Anbieter: Google"], "shortDef": "Multimodaler Chatbot von Google mit enger Anbindung an Google-Workspace-Dienste wie Docs, Sheets und Gmail — wie ChatGPT ein sehr breiter, kreativer Allrounder für den Arbeitsalltag.", "explain": "Gemini und ChatGPT lassen sich in der Praxis fast wie ein Geschwisterpaar betrachten: Beide sind extrem vielseitig, im Alltag sehr kreativ einsetzbar und einander in Funktionsumfang und Nutzungsgefühl auffallend ähnlich (aktuelle Modellnamen: siehe Eintrag „Modellstand“). Gemini ist direkt in Google Docs, Sheets und Gmail integriert, bietet die Bildmodelle „Nano Banana“, mit Gemini Live eine flüssige Sprachunterhaltung und mit Canvas eine Arbeitsfläche für Texte und kleine Web-Seiten. Die bisherigen Gems werden ab 17. November 2026 automatisch in Skills umgewandelt; Skills sind derzeit an ein kostenpflichtiges Google-AI-Abo gebunden.", "usefulFor": "Teams und Organisationen, die bereits mit Google Workspace arbeiten.", "useCases": ["Einen Entwurf direkt in Google Docs weiterschreiben lassen", "E-Mails in Gmail zusammenfassen oder entwerfen lassen", "Tabellen in Google Sheets auswerten lassen", "Eine wiederkehrende Arbeitsanleitung als Skill hinterlegen (früher Gem)"], "example": "Ein Sitzungsprotokoll direkt aus einem Google-Doc heraus zusammenfassen lassen.", "strengths": ["Nahtlose Einbindung in Google-Anwendungen", "Guter Umgang mit sehr langen Dokumenten"], "limitations": ["Vorteile zeigen sich vor allem im Google-Ökosystem", "Skills (Nachfolger der kostenlosen Gems) erfordern derzeit ein kostenpflichtiges Abo"], "mistakes": [], "related": ["t1", "t2", "t22", "m2", "a1"], "providers": "Google", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "t4", "title": "Microsoft Copilot", "type": "Werkzeug", "main": "tools", "sub": "multimodal", "icon": "chat", "level": "Grundlagen", "tags": ["Multimodal", "Anbieter: Microsoft"], "shortDef": "Assistent von Microsoft, der KI in die bestehenden Office-Anwendungen bringt — Word, Excel, Outlook, Teams und PowerPoint — und sich zunehmend zur Arbeitsoberfläche mit eigenem Agentenmodus (Cowork) entwickelt.", "explain": "Copilot steht für eine von zwei gegenläufigen Bewegungen: Die KI wandert in die bestehenden Anwendungen, statt dass man für die Arbeit in einen Chatbot wechselt. Die Gegenbewegung zeigen etwa Claude-Artefakte, bei denen Dokumente, Tabellen und Präsentationen direkt in der KI entstehen. Seit Herbst 2026 hat Copilot deutlich zugelegt: In der Copilot-App liegen Chat und Cowork (mehrstufige Aufgaben) auf einer Startseite, Automatisierungen lassen sich dort verwalten, und Skills können in den Office-Programmen über „@“ aufgerufen werden. Viele Funktionen kommen zuerst im Vorabprogramm „Frontier“ und hängen vom Lizenzmodell ab; manche Agentenfunktionen werden nutzungsbasiert abgerechnet.", "usefulFor": "Organisationen, die überwiegend mit Microsoft 365 arbeiten und KI dort einsetzen möchten, wo die Dokumente ohnehin liegen.", "useCases": ["Einen Foliensatz direkt in PowerPoint entwerfen lassen", "Eine lange E-Mail-Kette in Outlook zusammenfassen", "Formeln und Auswertungen in Excel vorschlagen lassen", "Eine mehrstufige Aufgabe über Cowork in der Copilot-App erledigen lassen"], "example": "Aus Stichpunkten in Word einen vollständigen Berichtsentwurf erstellen lassen.", "strengths": ["Tiefe Integration in Microsoft-365-Anwendungen", "Vertraute Oberfläche für Nutzer:innen der Microsoft-Welt", "Arbeitet dort, wo Dokumente und Mails ohnehin liegen"], "limitations": ["Funktionsumfang stark an Microsoft-365-Lizenzmodell gekoppelt", "Neue Funktionen erscheinen gestaffelt — was im Workshop gezeigt wird, ist im eigenen Haus oft noch nicht freigeschaltet", "Teile der Agentenfunktionen werden nutzungsbasiert abgerechnet"], "mistakes": [], "related": ["t1", "t3", "t2", "c1", "a1"], "providers": "Microsoft", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "t5", "title": "Perplexity", "type": "Werkzeug", "main": "tools", "sub": "recherche", "icon": "search", "level": "Aufbau", "tags": ["Recherche", "Quellenangaben"], "shortDef": "Recherche-orientierter Chatbot, der Antworten mit direkt nachvollziehbaren Quellenangaben liefert.", "explain": "Perplexity durchsucht das Web und zitiert die Fundstellen direkt in der Antwort, was die Nachvollziehbarkeit gegenüber klassischen Chatbots erhöht.", "usefulFor": "Faktenrecherche, bei der die Quelle direkt mitgeliefert werden soll.", "useCases": ["Aktuelle Entwicklungen zu einem Fachthema mit Quellenangabe recherchieren", "Mehrere Quellen zu einer Fragestellung vergleichen"], "example": "„Welche aktuellen Studien gibt es zu hybridem Arbeiten? Bitte mit Quellen.\"", "strengths": ["Gute Nachvollziehbarkeit durch Quellenangaben", "Schnelle Aktualität durch Websuche"], "limitations": ["Tiefe wissenschaftliche Literaturrecherche ist bei Spezialtools wie Elicit oder Consensus oft stärker"], "mistakes": [], "related": ["f9", "t6"], "providers": "Perplexity AI", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "t6", "title": "NotebookLM", "type": "Werkzeug", "main": "tools", "sub": "recherche", "icon": "library", "level": "Aufbau", "tags": ["Eigene Quellen", "Wissenssammlung"], "shortDef": "Werkzeug von Google, das ausschließlich mit selbst hochgeladenen Quellen arbeitet — zum Recherchieren, aber auch als kreativer Chatbot zur Materialerstellung, etwa für Unterricht und Workshops.", "explain": "Anders als ein allgemeiner Chatbot bezieht sich NotebookLM nur auf die Quellen, die man selbst hochlädt — mit direktem Verweis auf die jeweilige Textstelle. Aus diesen Quellen erzeugt es auf Knopfdruck Materialien: Zusammenfassungen, Lernkarten, Quizze, Mindmaps, Podcasts und Video-Übersichten. Ein Notebook ist zugleich ein Projekt mit Wissensbasis und lässt sich mit anderen teilen — beim Teilen und gemeinsamen Arbeiten hat NotebookLM derzeit die größte Reichweite.", "usefulFor": "Arbeiten mit einer klar abgegrenzten Dokumentensammlung, z. B. Kursunterlagen oder Studienliteratur, und das Erstellen von Lernmaterial daraus.", "useCases": ["Mehrere PDFs eines Kurses hochladen und übergreifend befragen", "Aus Unterrichtsmaterial Lernkarten, ein Quiz oder eine Mindmap erzeugen lassen", "Eine Audio- oder Video-Übersicht der eigenen Quellen erzeugen lassen", "Ein Notebook mit Kolleg:innen oder Teilnehmenden teilen"], "example": "Alle Foliensätze eines Seminars hochladen und eine Zusammenfassung der Kernaussagen erzeugen lassen.", "strengths": ["Antworten bleiben nachvollziehbar auf die eigenen Quellen begrenzt", "Reduziert das Risiko frei erfundener Inhalte", "Sehr vielseitig bei der Materialerstellung", "Einfach teilbar, auch mit Personen ohne eigenes Abo"], "limitations": ["Ohne eigene Quellen wenig nützlich, da kein allgemeines Weltwissen im Fokus steht"], "mistakes": [], "related": ["v2", "a5", "f12", "f9"], "providers": "Google", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "t7", "title": "Elicit", "type": "Werkzeug", "main": "tools", "sub": "recherche", "icon": "book", "level": "Vertiefung", "tags": ["Wissenschaftliche Literatur"], "shortDef": "Recherche-Tool speziell für wissenschaftliche Literatur, das relevante Studien findet und deren Kernaussagen extrahiert.", "explain": "Elicit ist auf akademische Literaturrecherche spezialisiert und hilft, größere Mengen an Fachpublikationen systematisch zu sichten.", "usefulFor": "Literaturrecherche im wissenschaftlichen Kontext, etwa für Qualifikationsarbeiten.", "useCases": ["Relevante Studien zu einer Forschungsfrage identifizieren", "Kernergebnisse mehrerer Studien vergleichend gegenüberstellen"], "example": "Für eine Forschungsfrage zur Postdoc-Karriereentwicklung relevante Studien der letzten fünf Jahre auflisten lassen.", "strengths": ["Spart Zeit bei umfangreichen Literatur-Screenings"], "limitations": ["Ersetzt keine eigene kritische Lektüre der Originalarbeiten"], "mistakes": [], "related": ["t20", "t19", "t8"], "providers": "Elicit", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "t8", "title": "Consensus", "type": "Werkzeug", "main": "tools", "sub": "recherche", "icon": "book", "level": "Vertiefung", "tags": ["Wissenschaftliche Literatur", "Evidenz"], "shortDef": "Recherche-Tool, das Antworten auf Fragen mit dem Konsens oder Dissens der wissenschaftlichen Literatur zu diesem Thema unterlegt.", "explain": "Consensus zeigt an, wie viele Studien eine Aussage stützen oder ihr widersprechen, statt nur eine einzelne Quelle zu zitieren.", "usefulFor": "Schnelle Einordnung, wie belastbar eine wissenschaftliche Aussage ist.", "useCases": ["Prüfen, wie einheitlich die Studienlage zu einer These ist", "Einen ersten Überblick vor einer vertieften Literaturrecherche gewinnen"], "example": "„Was sagt die Forschung zur Wirksamkeit von 360-Grad-Feedback?\" mit Übersicht zur Studienlage.", "strengths": ["Gute erste Einordnung der Evidenzlage"], "limitations": ["Ersetzt keine systematische Literaturrecherche bei hohem wissenschaftlichem Anspruch"], "mistakes": [], "related": ["t20", "t7", "t19"], "providers": "Consensus", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "t13", "title": "GenSpark", "type": "Werkzeug", "main": "tools", "sub": "praesentation", "icon": "doc", "level": "Aufbau", "tags": ["Präsentationen", "KI-Recherche"], "shortDef": "KI-Arbeitsbereich, der aus einem Thema, Stichpunkten oder einem hochgeladenen Dokument automatisch recherchierte, gestaltete Foliensätze erstellt.", "explain": "GenSpark recherchiert Inhalte im Hintergrund, schlägt eine Gliederung vor und setzt sie direkt in ein layoutetes Foliendeck um — inklusive Diagrammen und passenden Bildern.", "usefulFor": "Schnelle, recherchebasierte Foliensatz-Entwürfe aus Stichworten oder bestehenden Dokumenten.", "useCases": ["Aus einem Kursthema automatisch einen ersten, recherchierten Foliensatz erzeugen", "Ein bestehendes PDF oder Word-Dokument in eine Präsentation umwandeln", "Foliensätze innerhalb der eigenen PowerPoint-Vorlage erzeugen lassen"], "example": "Aus Stichpunkten zu einem Kursthema automatisch einen ersten, mit Grafiken und Quellen versehenen Foliensatz erzeugen lassen.", "strengths": ["Übernimmt Recherche und Layout in einem Arbeitsgang", "Kann direkt mit unternehmenseigenen PowerPoint-Master-Vorlagen arbeiten"], "limitations": ["Erzählstruktur und Layout bleiben oft generisch und erfordern Nacharbeit", "Kreditbasiertes Preismodell erfordert vorab eine Prüfung der Kosten"], "mistakes": [], "related": ["t12", "p7"], "providers": "GenSpark", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "t14", "title": "STORM (Stanford)", "type": "Werkzeug", "main": "tools", "sub": "recherche", "icon": "book", "level": "Vertiefung", "tags": ["Wikipedia-Stil", "Open Source"], "shortDef": "Ein an der Stanford University entwickeltes, quelloffenes Recherche-Tool, das aus einem Thema automatisch einen ausführlichen, mit Quellen belegten Übersichtsartikel im Stil eines Wikipedia-Beitrags erstellt.", "explain": "STORM recherchiert ein Thema aus mehreren Blickwinkeln, simuliert dazu Rückfragen zwischen unterschiedlichen Perspektiven und gliedert die Ergebnisse zu einem zusammenhängenden, referenzierten Artikel.", "usefulFor": "Ein schneller, breiter Einstieg in ein unbekanntes Themenfeld mit nachvollziehbaren Quellenangaben.", "useCases": ["Einen Übersichtsartikel zu einem neuen Forschungsfeld erzeugen lassen", "Eine strukturierte Grundlage für ein internes Wiki erstellen", "Sich vor einem Beratungsauftrag zügig in ein unbekanntes Themengebiet einarbeiten"], "example": "Einen strukturierten Übersichtsartikel zum Forschungsstand zu „Führen ohne formale Autorität\" erzeugen lassen, inklusive Gliederung und Quellenangaben.", "strengths": ["Kostenlos und quelloffen", "Deckt ein Thema durch mehrperspektivische Rech : "Aufbau", "tags": ["Datenschutz", "Europa"], "shortDef": "Datenschutzorientierter Chatbot des europäischen Anbieters Proton, der Unterhaltungen durchgehend verschlüsselt, nicht protokolliert und nicht zum Modelltraining verwendet.", "explain": "Lumo verzichtet auf serverseitige Gesprächsprotokolle und ein werbefinanziertes Geschäftsmodell — ein deutlicher Unterschied zu vielen marktführenden Chatbots.", "usefulFor": "Aufgaben mit besonders sensiblen oder vertraulichen Inhalten.", "useCases": ["Vertrauliche Notizen unter strengeren Datenschutzanforderungen zusammenfassen lassen", "Eine datenschutzfreundliche Alternative für alltägliche Chat-Aufgaben nutzen"], "example": "Eine sensible interne Notiz zusammenfassen lassen, ohne dass die Inhalte serverseitig protokolliert werden.", "strengths": ["Starker Datenschutzfokus mit Ende-zu-Ende-Verschlüsselung", "Europäischer Anbieter mit Sitz in der Schweiz und Bindung an europäisches Recht"], "limitations": ["Funktionsumfang und Modellauswahl derzeit noch nicht auf dem Niveau der größten Anbieter"], "mistakes": [], "related": ["t17", "c7"], "providers": "Proton AG", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "t17", "title": "Vibe (Mistral, ehemals Le Chat)", "type": "Werkzeug", "main": "tools", "sub": "multimodal", "icon": "chat", "level": "Aufbau", "tags": ["Europa", "Agentenmodus", "Europäische Sprachen"], "shortDef": "Multimodaler Chatbot und Arbeitsagent des französischen Anbieters Mistral AI, bis Mai 2026 unter dem Namen „Le Chat\" bekannt — eine der stärksten europäischen Alternativen zu US-amerikanischen Chatbots, mit besonderem Augenmerk auf eine europäische Perspektive und europäische Sprachen.", "explain": "Vibe kombiniert einen klassischen Chat-Assistenten mit einem Agentenmodus für mehrstufige Arbeits- und Programmieraufgaben. Projekte mit Wissensbasis und Instruktionen sowie wiederverwendbare Skills (im offenen
