enötigt mehr Zeit als eine einfache Websuche", "Ergebnis bleibt prüfungspflichtig"], "related": ["f8", "t5", "t6"], "providers": "z. B. OpenAI, Google, Anthropic (Bezeichnung je nach Anbieter unterschiedlich)", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "f10", "title": "Canvas- und Arbeitsflächen-Modi", "type": "Funktion", "main": "functions", "sub": "canvas", "icon": "grid", "level": "Aufbau", "tags": ["Gemeinsames Dokument"], "shortDef": "Ein separates, bearbeitbares Dokument neben dem Chatverlauf, in dem gezielt einzelne Abschnitte überarbeitet werden können.", "explain": "Im Unterschied zum normalen Chat, bei dem jede neue Antwort den ganzen Text neu ausgibt, bleibt hier ein Dokument bestehen, an dem gezielt weitergearbeitet wird.", "usefulFor": "Längere Texte oder Konzepte, die über mehrere Schritte hinweg verfeinert werden.", "useCases": ["An einem Konzeptentwurf gezielt einzelne Absätze überarbeiten", "Ein Dokument gemeinsam mit der KI Korrektur lesen lassen"], "example": "Ein Workshop-Konzept in einer Arbeitsfläche anlegen und Abschnitt für Abschnitt gezielt verfeinern, ohne den ganzen Text neu zu erzeugen.", "strengths": ["Übersichtlicher als lange Chatverläufe bei Textarbeit"], "limitations": ["Nicht bei jedem Anbieter unter demselben Namen oder im gleichen Umfang verfügbar"], "related": ["a2", "f1"], "providers": "z. B. OpenAI (Canvas), Anthropic (Artefakte)", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "f11", "title": "Projekte und Projektordner", "type": "Funktion", "main": "automation", "sub": "container", "icon": "folder", "level": "Aufbau", "tags": ["Kontext bündeln"], "shortDef": "Ein abgegrenzter Arbeitsbereich, in dem Dateien, Anweisungen und Chatverläufe zu einem Thema dauerhaft gebündelt werden.", "explain": "Im Unterschied zu einem einzelnen Chat muss der Kontext hier nicht bei jeder neuen Unterhaltung erneut mitgeliefert werden — er steht dauerhaft zur Verfügung.", "usefulFor": "Wiederkehrende Themen mit gleichbleibendem Hintergrundwissen, etwa ein laufendes Kursformat oder ein Kundenprojekt.", "useCases": ["Alle Unterlagen zu einem Kursformat an einem Ort bündeln", "Feste Anweisungen für einen bestimmten Schreibstil dauerhaft hinterlegen"], "example": "Ein Projekt für ein wiederkehrendes Workshop-Format anlegen, in dem Corporate-Design-Vorgaben und frühere Foliensätze dauerhaft hinterlegt sind.", "strengths": ["Muss Kontext nicht jedes Mal neu erklären", "Sorgt für konsistentere Ergebnisse über die Zeit"], "limitations": ["Bei sensiblen Inhalten empfiehlt sich ein bewusster Umgang mit Freigaben und Sichtbarkeit"], "related": ["f13", "f16", "a3", "a5"], "providers": "z. B. Anthropic (Projekte), OpenAI (Projekte), Mistral (Projekte in Vibe), Google (Notebooks in NotebookLM)", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "f12", "title": "Bibliotheken und Wissenssammlungen", "type": "Funktion", "main": "functions", "sub": "memory", "icon": "library", "level": "Aufbau", "tags": ["Eigene Quellen"], "shortDef": "Eine dauerhafte Sammlung eigener Dokumente, auf die der Chatbot gezielt zugreifen kann, statt nur auf allgemeines Wissen.", "explain": "Diese Funktion überschneidet sich mit Projekten, legt den Fokus aber stärker auf eine reine Quellensammlung, die gezielt befragt wird.", "usefulFor": "Themenfelder mit einer klar abgegrenzten, wachsenden Dokumentensammlung.", "useCases": ["Alle Studien zu einem Forschungsthema an einem Ort sammeln", "Eine wachsende Sammlung von Kursunterlagen gezielt befragbar machen"], "example": "Alle bisherigen Handreichungen zu einem wiederkehrenden Seminarthema in einer Sammlung hinterlegen und gezielt befragen.", "strengths": ["Antworten bleiben nachvollziehbar auf die hinterlegten Quellen bezogen"], "limitations": ["Erfordert Pflege, damit veraltete Dokumente nicht zu veralteten Antworten führen"], "related": ["t6", "f11"], "providers": "z. B. Google NotebookLM, herstellerspezifische Wissenssammlungen", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "f13", "title": "Projekte als Container: Wissensbasis + Instruktionen (früher GPTs & Gems)", "type": "Funktion", "main": "automation", "sub": "container", "icon": "puzzle", "level": "Aufbau", "tags": ["Wissensbasis", "Instruktionen", "Grenzen"], "shortDef": "Ein „Container“ um den Chat: hochgeladenes Wissen, klar gesetzte Grenzen und eine feste Arbeitsanweisung im Hintergrund. Heute ist das vor allem das Projekt — die eigenständigen Assistenten (Custom GPTs, Gems) laufen aus.", "explain": "Das Bild vom Container beschreibt drei Bausteine, die einen Chat begrenzen und steuern: (1) Wissen, das hochgeladen wird und auf das sich die KI stützt, (2) Grenzen, was sie tun und lassen soll, (3) die Arbeitsanweisung, die bei jeder Unterhaltung unsichtbar mitläuft. Lange gab es dafür eigene Assistenten: Custom GPTs bei ChatGPT, Gems bei Gemini. Beide werden gerade abgelöst: OpenAI stellt Custom GPTs im Dezember 2026 ein und überführt sie in Plugins, Google wandelt Gems ab 17. November 2026 in Skills um. Der Container lebt heute im Projekt weiter — bei Claude, ChatGPT, Vibe (Mistral) und NotebookLM jeweils mit Wissensbasis und Instruktionen. Wiederverwendbare Arbeitsanleitungen wandern in Skills. Der Container bleibt die erste Stufe der Automatisierung: Der Kontext muss nicht mehr in jedem Chat neu erklärt werden.", "usefulFor": "Klar abgegrenzte, wiederkehrende Themen, die immer auf derselben Grundlage und im selben Stil bearbeitet werden sollen — auch von mehreren Personen.", "useCases": ["Ein Projekt „Kursanfragen“ mit hinterlegten FAQs und festen Antwortregeln anlegen", "Ein Projekt mit Corporate-Design-Vorgaben für Foliensatz-Entwürfe einrichten", "Ein Projekt, das nur auf Basis eines hinterlegten Kompetenzmodells Feedback formuliert", "Bestehende GPTs oder Gems vor dem Abschalten sichern: Anweisungen und Wissensdateien in ein Projekt oder einen Skill übertragen"], "example": "Ein Projekt „Kursanfragen“ erhält als Wissen die Kursbeschreibungen, als Grenze „keine Zusagen zu Preisen oder Terminen, die nicht im Wissen stehen“ und als Arbeitsanweisung „antworte freundlich, auf Englisch, maximal 150 Wörter“.", "strengths": ["Standardisiert wiederkehrende Aufgaben", "Kein technisches Vorwissen nötig", "Bei den meisten Anbietern im Team teilbar"], "limitations": ["Bleibt an seinen Container gebunden — für jedes neue Thema braucht es ein eigenes Projekt", "Hochgeladenes Wissen muss gepflegt werden, sonst veralten die Antworten", "Custom GPTs und Gems laufen aus: Wer sie noch nutzt, sollte Inhalte rechtzeitig sichern"], "related": ["f11", "a1", "a3", "a5", "t17"], "providers": "Anthropic (Projekte), OpenAI (Projekte; Custom GPTs bis Dez. 2026, danach Plugins), Google (NotebookLM-Notebooks; Gems werden ab 17.11.2026 zu Skills), Mistral (Projekte in Vibe)", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern.", "mistakes": ["Grenzen vergessen: Ohne sie ergänzt die KI fehlendes Wissen mit Vermutungen", "Zu viele unterschiedliche Aufgaben in ein einziges Projekt packen"]}, {"id": "f14", "title": "Agenten und Automatisierungen", "type": "Funktion", "main": "cowork", "sub": "agenten", "icon": "robot", "level": "Vertiefung", "tags": ["Selbstständigkeit", "Mehrschrittig"], "shortDef": "Ein Modus, in dem die KI mehrere Schritte einer Aufgabe eigenständig plant und ausführt, statt nach jedem Schritt auf eine neue Anweisung zu warten.", "explain": "Im Unterschied zu einem normalen Chat trifft die KI hier Zwischenentscheidungen selbst — etwa welche Quelle als Nächstes geprüft wird — was mehr Aufmerksamkeit bei der Kontrolle erfordert.", "usefulFor": "Mehrstufige Aufgaben mit klar abgrenzbarem Ziel und überprüfbarem Ergebnis.", "useCases": ["Eine mehrstufige Recherche eigenständig durchführen lassen", "Mehrere Dateien in einer definierten Reihenfolge bearbeiten lassen"], "example": "Eine Reihe von Teilnehmerdaten eigenständig nach einem festen Schema aufbereiten lassen, mit abschließender Kontrolle durch die Nutzerin.", "strengths": ["Reduziert manuellen Zwischenaufwand bei klar definierten Abläufen"], "limitations": ["Erfordert klare Aufgabenstellung und eine abschließende menschliche Prüfung", "Bei sensiblen Daten besondere Vorsicht bei Berechtigungen geboten"], "related": ["c1", "c5"], "providers": "z. B. Anthropic (Cowork), OpenAI (Agenten-Modi)", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "f15", "title": "Automatisierte Workflows", "type": "Funktion", "main": "automation", "sub": "workflows", "icon": "gear", "level": "Vertiefung", "tags": ["Verkettung", "Auslöser"], "shortDef": "Wiederkehrende Aufgaben über feste Auslöser und verkettete Schritte automatisch ausführen lassen, oft über zusätzliche Automatisierungswerkzeuge.", "explain": "Diese Funktion geht über einzelne Chatanfragen hinaus: Ein Auslöser — etwa eine neue E-Mail oder ein neuer Tabelleneintrag — startet automatisch eine Kette von KI-gestützten Schritten.", "usefulFor": "Regelmäßig wiederkehrende Abläufe mit klar definiertem Auslöser.", "useCases": ["Bei jeder neuen Kursanmeldung automatisch eine Bestätigungs-E-Mail entwerfen lassen", "Regelmäßige Datenabgleiche zwischen zwei Systemen automatisieren"], "example": "Bei jedem neuen Eintrag in einer Anmeldetabelle automatisch einen Entwurf für die Teilnahmebestätigung erzeugen lassen.", "strengths": ["Spart bei wiederkehrenden Abläufen erheblich Zeit"], "limitations": ["Erfordert eine sorgfältige Einrichtung und regelmäßige Kontrolle, damit Fehler nicht automatisiert weiterlaufen"], "related": ["a3", "a1", "k1"], "providers": "z. B. Make.com in Kombination mit KI-Diensten", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "c1", "title": "Cowork in Claude", "type": "Arbeitsmodus", "main": "cowork", "sub": "agenten", "icon": "layers", "level": "Vertiefung", "tags": ["Dateien", "Agentenhaft"], "shortDef": "Ein Arbeitsmodus von Anthropic, in dem Claude mehrstufige, dateibasierte Aufgaben eigenständig ausführt — von der Recherche bis zur fertigen Datei.", "explain": "Im Unterschied zum normalen Chat kann Cowork über mehrere Werkzeuge und Schritte hinweg arbeiten, etwa Dateien lesen, bearbeiten und neue Dateien erzeugen, mit Bestätigung bei kritischen Schritten.", "usefulFor": "Umfangreichere, mehrstufige Arbeitsaufträge mit mehreren Dateien.", "useCases": ["Mehrere Dokumente eines Projekts sichten und daraus einen zusammenfassenden Bericht erstellen", "Eine Reihe von Dateien nach einem festen Schema umbenennen und sortieren lassen"], "example": "Alle Rechnungsdokumente eines Kursstandorts sichten und eine strukturierte Abrechnungsübersicht als Datei erzeugen lassen.", "strengths": ["Bearbeitet mehrstufige Aufgaben, ohne dass jeder Einzelschritt manuell angestoßen werden muss"], "limitations": ["Erfordert eine klare Aufgabenstellung sowie eine abschließende Kontrolle, besonders bei sensiblen Unterlagen"], "related": ["k1", "c8", "f14", "a1"], "providers": "Anthropic", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "c2", "title": "Work- und Agentenfunktionen in ChatGPT", "type": "Arbeitsmodus", "main": "cowork", "sub": "agenten", "icon": "robot", "level": "Vertiefung", "tags": ["Vergleichbarer Modus"], "shortDef": "Vergleichbare mehrstufige, agentenähnliche Arbeitsmodi bei OpenAI, mit Zugriff auf Dateien, Web und weitere Werkzeuge.", "explain": "Auch hier gilt: Aufgaben werden über mehrere Schritte hinweg selbstständig bearbeitet, mit Bestätigungspunkten bei folgenreichen Aktionen.", "usefulFor": "Vergleichbare mehrstufige Aufgaben innerhalb der OpenAI-Umgebung.", "useCases": ["Eine mehrstufige Recherche mit anschließender Dokumentenerstellung durchführen lassen"], "example": "Einen Marktüberblick recherchieren und die Ergebnisse direkt in einem strukturierten Dokument zusammenfassen lassen.", "strengths": ["Reduziert manuellen Zwischenaufwand bei klar abgegrenzten Aufgaben"], "limitations": ["Wie bei allen Agentenmodi: abschließende menschliche Prüfung notwendig"], "related": ["c1", "c8"], "providers": "OpenAI", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "c3", "title": "Desktop-Apps", "type": "Arbeitsmodus", "main": "cowork", "sub": "ordner", "icon": "desktop", "level": "Aufbau", "tags": ["Lokaler Zugriff"], "shortDef": "Eigenständige Anwendungen auf dem eigenen Rechner, die direkter mit lokalen Dateien, Ordnern und anderen Programmen zusammenarbeiten können als eine reine Browser-Oberfläche.", "explain": "Im Unterschied zur Web-Oberfläche im Browser erlaubt eine Desktop-App oft einen direkteren Zugriff auf lokale Dateien und andere geöffnete Programme.", "usefulFor": "Arbeiten, bei denen der direkte Zugriff auf lokale Dateien und Ordner den Ablauf erleichtert.", "useCases": ["Direkt mit Dateien im eigenen Dateisystem arbeiten, ohne sie einzeln hochzuladen"], "example": "Eine lokale Ordnerstruktur mit Kursunterlagen direkt über die Desktop-App durchsuchen und bearbeiten lassen.", "strengths": ["Engere Anbindung an das eigene Dateisystem und andere lokale Programme"], "limitations": ["Erfordert Installation und bewusste Vergabe von Zugriffsrechten"], "related": ["c4", "c6"], "providers": "z. B. Anthropic, OpenAI (jeweils eigene Desktop-Anwendungen)", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "c4", "title": "Arbeiten mit lokalen Dateien und Ordnern", "type": "Arbeitsmodus", "main": "cowork", "sub": "ordner", "icon": "folder", "level": "Vertiefung", "tags": ["Dateizugriff"], "shortDef": "Ein Arbeitsmodus, in dem die KI direkt auf eine bestehende lokale Ordnerstruktur zugreift, statt einzelne Dateien manuell hochzuladen.", "explain": "Das erleichtert Aufgaben, die mehrere zusammengehörige Dateien betreffen, erfordert aber eine bewusste Entscheidung, welcher Ordner freigegeben wird.", "usefulFor": "Aufgaben mit vielen zusammengehörigen Dateien, etwa einem ganzen Projektordner.", "useCases": ["Alle Dateien eines Kursordners in einem Arbeitsgang sichten lassen", "Eine bestehende Ordnerstruktur nach einem einheitlichen Schema umbenennen lassen"], "example": "Einen Ordner mit alten Foliensätzen sichten und die relevanten Inhalte für eine neue Präsentation zusammenstellen lassen.", "strengths": ["Effizient bei Aufgaben mit vielen zusammengehörigen Dateien"], "limitations": ["Erfordert eine bewusste Entscheidung, welche Ordner und Dateien freigegeben werden, besonders bei vertraulichen Inhalten"], "related": ["c3", "c7"], "providers": "z. B. Anthropic, OpenAI (jeweils eigene Umsetzung)", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "c5", "title": "Mehrstufige, agentenähnliche Aufgaben", "type": "Arbeitsmodus", "main": "cowork", "sub": "agenten", "icon": "chain", "level": "Vertiefung", "tags": ["Ohne Zwischen-Prompt"], "shortDef": "Aufgaben, bei denen die KI mehrere aufeinanderfolgende Schritte selbstständig plant und ausführt, statt nach jedem Schritt auf eine neue Anweisung zu warten.", "explain": "Der Unterschied zum normalen Chat liegt in der Eigenständigkeit zwischen den Schritten — die Nutzerin greift vor allem am Anfang und am Ende steuernd ein, statt jeden Zwischenschritt einzeln anzustoßen.", "usefulFor": "Klar definierte Abläufe mit mehreren Teilschritten und überprüfbarem Endergebnis.", "useCases": ["Eine Reihe von Dokumenten in einer festen Abfolge verarbeiten lassen", "Eine mehrstufige Recherche mit anschließender Zusammenfassung durchführen lassen"], "example": "Eine Abfolge aus Datenprüfung, Zusammenfassung und Erstellung eines Übergabedokuments in einem Arbeitsgang durchführen lassen.", "strengths": ["Reduziert die Zahl manueller Zwischenschritte bei wiederkehrenden Abläufen"], "limitations": ["Setzt eine klare Aufgabendefinition voraus, sonst können sich Fehler über mehrere Schritte fortsetzen"], "related": ["c1", "f14"], "providers": "Modellunabhängig, Bezeichnung je nach Anbieter unterschiedlich", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "c6", "title": "Berechtigungen und Freigaben", "type": "Konzept", "main": "cowork", "sub": "sicherheit", "icon": "lock", "level": "Grundlagen", "tags": ["Kontrolle", "Zugriff"], "shortDef": "Bevor ein Agenten- oder Cowork-Modus auf Dateien, Ordner oder externe Dienste zugreift, muss dieser Zugriff bewusst freigegeben werden.", "explain": "Diese Freigaben legen fest, was die KI lesen, verändern oder versenden darf. Sie sollten so eng wie möglich gehalten und bei Bedarf wieder entzogen werden.", "usefulFor": "Jede Nutzung von Agenten- oder Cowork-Modi mit Zugriff auf echte Dateien oder Dienste.", "useCases": ["Vor einer Aufgabe prüfen, welcher Ordner tatsächlich freigegeben werden muss", "Freigaben nach Abschluss einer Aufgabe wieder zurücknehmen, wenn nicht mehr benötigt"], "example": "Für eine einmalige Auswertung nur den betreffenden Unterordner freigeben statt des gesamten Laufwerks.", "strengths": ["Bewusster Umgang mit Freigaben reduziert das Risiko ungewollter Zugriffe erheblich"], "limitations": ["Erfordert etwas Einarbeitung in die jeweiligen Freigabe-Einstellungen des genutzten Tools"], "related": ["k1", "c7", "c1"], "providers": "Modellunabhängig", "note": null}, {"id": "c7", "title": "Datenschutz und Nutzerkontrolle", "type": "Konzept", "main": "cowork", "sub": "sicherheit", "icon": "shield", "level": "Grundlagen", "tags": ["DSGVO", "Sensible Daten"], "shortDef": "Bei sensiblen oder personenbezogenen Daten sollten Nutzer:innen bewusst entscheiden, was an ein KI-System weitergegeben wird und was nicht.", "explain": "Nicht jede Aufgabe erfordert den Zugriff auf vollständige, unanonymisierte Datensätze — oft genügen anonymisierte Auszüge oder eine Bearbeitung ohne Hochladen sensibler Originaldateien.", "usefulFor": "Jede Aufgabe mit personenbezogenen, vertraglichen oder anderweitig sensiblen Daten.", "useCases": ["Vor dem Hochladen prüfen, ob eine anonymisierte Version ausreicht", "Klären, wo hochgeladene Daten verarbeitet und gespeichert werden"], "example": "Für eine Musteranalyse eine Teilnehmerliste ohne Namen und Kontaktdaten hochladen, statt der vollständigen Originaldatei.", "strengths": ["Reduziert Risiken bei der Arbeit mit sensiblen Informationen deutlich"], "limitations": ["Erfordert etwas zusätzlichen Aufwand für Anonymisierung oder Datenprüfung vorab"], "related": ["c6", "f3"], "providers": "Modellunabhängig", "note": null}, {"id": "c8", "title": "Chat, Projekt, Skill, geplante Aufgabe und Agent im Vergleich", "type": "Konzept", "main": "cowork", "sub": "vergleich", "icon": "scale", "level": "Vertiefung", "tags": ["Orientierung", "Auswahl"], "shortDef": "Fünf Arbeitsmodi mit wachsender Eigenständigkeit: der einzelne Chat, das Projekt mit dauerhaftem Kontext, der flexibel aufrufbare Skill, die geplante Aufgabe, die zeitgesteuert läuft, und der Agent bzw. Cowork-Modus, der selbst handelt.", "explain": "Je mehr Eigenständigkeit ein Modus hat, desto mehr Nutzen bei wiederkehrenden oder umfangreichen Aufgaben, aber auch desto mehr Sorgfalt bei Freigaben und Kontrolle ist nötig.", "usefulFor": "Die Entscheidung, welcher Modus für eine konkrete Aufgabe angemessen ist.", "useCases": ["Für eine einmalige, einfache Frage reicht ein normaler Chat", "Für ein wiederkehrendes Thema mit stabilem Kontext eignet sich ein Projekt", "Für wiederkehrende Arbeitsabläufe, die in vielen Chats gebraucht werden, eignet sich ein Skill", "Für Routinen, die regelmäßig ohne Anstoß laufen sollen, eignet sich eine geplante Aufgabe", "Für mehrstufige, dateibasierte Aufgaben mit anderen Tools eignet sich ein Agent oder Cowork"], "example": "Eine einmalige Textfrage im normalen Chat klären, ein wiederkehrendes Kursformat dagegen in einem Projekt bündeln.", "strengths": ["Hilft, für jede Aufgabe den passenden, nicht überdimensionierten Modus zu wählen"], "limitations": ["Die Grenzen zwischen den Modi verschieben sich mit der Weiterentwicklung der Anbieter"], "related": ["a3", "f13", "a1", "a4", "c1"], "providers": "Modellunabhängig", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "t18", "title": "Qwen", "type": "Werkzeug", "main": "tools", "sub": "multimodal", "icon": "chat", "level": "Aufbau", "tags": ["China", "Open Source", "Kostenlos"], "shortDef": "Multimodaler Chatbot und Modellfamilie des chinesischen Konzerns Alibaba — kostenlos nutzbar über Qwen Chat, viele Modelle offen und auch lokal einsetzbar.", "explain": "Qwen umfasst sehr kleine Modelle für einzelne Geräte bis hin zu großen Spitzenmodellen (Stand November 2026: Qwen3.8-Max; Qwen 4 ist angekündigt, aber noch nicht veröffentlicht). Die Web-App Qwen Chat versteht Text, Bilder und Dokumente und ist kostenlos. Viele Qwen-Modelle stehen unter einer offenen Lizenz und können auf dem eigenen Rechner betrieben werden, etwa mit Ollama — dann verlassen die Daten das eigene Gerät nicht.", "usefulFor": "Kostenloses Ausprobieren eines leistungsstarken Chatbots sowie — technisch versierter — lokaler Betrieb ohne Cloud.", "useCases": ["Einen kostenlosen Zweitchatbot für den Vergleich von Antworten nutzen", "Ein offenes Qwen-Modell lokal betreiben, etwa für Texte, die das Haus nicht verlassen sollen", "Chinesischsprachige Inhalte verstehen oder übersetzen lassen"], "example": "Dieselbe Frage parallel an ChatGPT und Qwen stellen und die Antworten gegenüberstellen, um Stärken und blinde Flecken beider Modelle zu erkennen.", "strengths": ["Kostenlos nutzbar", "Offene Modelle ermöglichen lokalen Betrieb", "Starke Leistung im Verhältnis zu den Kosten"], "limitations": ["Bei Qwen Chat im Browser werden die Daten auf Servern von Alibaba verarbeitet — für dienstliche oder sensible Inhalte vorab prüfen", "Unterliegt als chinesischer Anbieter anderen regulatorischen Rahmenbedingungen, was sich bei politisch sensiblen Themen zeigen kann"], "mistakes": ["Die Web-Version mit dem lokalen Betrieb verwechseln: Nur lokal bleiben die Daten auf dem eigenen Gerät"], "related": ["l1", "t15", "t1", "c7"], "providers": "Alibaba Cloud (Qwen Chat, offene Modelle)", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "l1", "title": "Lokale KI-Modelle: KI offline auf dem eigenen Rechner (z. B. Ollama)", "type": "Werkzeug", "main": "tools", "sub": "lokal", "secondary": ["cowork"], "altSub": ["sicherheit"], "icon": "lock", "level": "Vertiefung", "tags": ["Offline", "Datenschutz", "Open Source"], "shortDef": "Offene Sprachmodelle wie Qwen, Gemma oder Mistral lassen sich mit Programmen wie Ollama direkt auf dem eigenen Rechner betreiben — ohne Internetverbindung und ohne dass Daten das Gerät verlassen.", "explain": "Ollama (oder vergleichbar LM Studio) lädt ein offenes Modell einmalig herunter und stellt es danach lokal bereit, mit einem einfachen Chatfenster oder als Schnittstelle für andere Programme. Damit lassen sich vertrauliche Texte verarbeiten, die keinen Cloud-Dienst sehen dürfen. Besonders interessant ist die Kombination mit Artefakten: Ein selbst gebautes HTML-Werkzeug kann statt eines Cloud-Anbieters das lokale Modell ansprechen — ein datenschutzgerechtes, „smartes“ Werkzeug für das eigene Haus. Wie gut das funktioniert, hängt stark vom Rechner ab: Kleine Modelle laufen auch auf Laptops, sind aber spürbar weniger leistungsfähig als die großen Cloud-Modelle.", "usefulFor": "Aufgaben mit vertraulichen oder personenbezogenen Daten, Arbeiten ohne Internet und das Experimentieren mit offenen Modellen.", "useCases": ["Vertrauliche Protokolle lokal zusammenfassen lassen", "Ein Artefakt bauen, das Texte über das lokale Modell auswertet statt über einen Cloud-Dienst", "Offen verfügbare Modelle miteinander vergleichen"], "example": "Ollama installieren, ein Qwen-Modell laden und offline einen Text zusammenfassen lassen — anschließend dasselbe Modell in ein selbst gebautes HTML-Werkzeug einbinden.", "strengths": ["Daten bleiben auf dem eigenen Gerät", "Funktioniert offline", "Keine laufenden Kosten pro Anfrage"], "limitations": ["Leistung hängt stark von Prozessor, Grafikkarte und Arbeitsspeicher ab", "Große Datenmengen, etwa umfangreiche Tabellen, werden schnell zu langsam verarbeitet", "Lokale Modelle sind weniger leistungsfähig als die großen Cloud-Modelle", "Erfordert eine Installation und etwas technische Einarbeitung"], "mistakes": ["Ein Cloud-Angebot (z. B. Qwen Chat im Browser) mit dem lokalen Betrieb desselben Modells verwechseln", "Von einem kleinen lokalen Modell die Qualität eines Spitzenmodells erwarten"], "related": ["t18", "a2", "c7", "g2", "t15"], "providers": "Ollama, LM Studio; Modelle z. B. von Alibaba (Qwen), Google (Gemma), Mistral AI, DeepSeek", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "f16", "title": "Memory: Was sich der Chatbot merkt", "type": "Funktion", "main": "functions", "sub": "memory", "icon": "library", "level": "Grundlagen", "tags": ["Personalisierung", "Kontext", "Datenschutz"], "shortDef": "Mit der Memory-Funktion merkt sich der Chatbot Informationen über dich und deine Arbeit über einzelne Unterhaltungen hinaus — etwa deine Rolle, laufende Projekte oder bevorzugte Formate.", "explain": "Ohne Memory beginnt jeder Chat bei null. Mit Memory kann der Chatbot auf frühere Unterhaltungen zurückgreifen oder gespeicherte Fakten nutzen, sodass Antworten besser zu dir passen. Je nach Anbieter lassen sich gespeicherte Erinnerungen einsehen, bearbeiten und löschen, frühere Chats gezielt durchsuchen oder Memory ganz abschalten. Zu unterscheiden ist Memory vom Projekt: Memory gilt allgemein für dich, ein Projekt nur für ein Thema.", "usefulFor": "Regelmäßige Nutzung im Arbeitsalltag, bei der man nicht jedes Mal Rolle, Kontext und Vorlieben neu erklären möchte.", "useCases": ["Dem Chatbot einmal Rolle, Zielgruppen und Schreibstil mitteilen und dauerhaft davon profitieren", "An eine Unterhaltung von letzter Woche anknüpfen, ohne alles erneut einzufügen", "Vorlieben festlegen, etwa „antworte mir immer zuerst mit einer Kurzfassung\""], "example": "Einmal sagen „Ich bin Trainer für Führungskräfte in Hochschulen, schreibe mir bitte ohne Anglizismen\" — künftige Entwürfe berücksichtigen das automatisch.", "strengths": ["Spart wiederholtes Erklären", "Antworten werden persönlicher und passgenauer"], "limitations": ["Gespeicherte Informationen können veralten oder falsch sein und sollten gelegentlich überprüft werden", "Sensible Daten gehören nicht ins Memory — bei vertraulichen Themen besser einen temporären Chat ohne Memory nutzen"], "mistakes": ["Nicht wissen, was gespeichert ist: Gespeicherte Erinnerungen regelmäßig ansehen und aufräumen", "Vertrauliche Kundendaten nebenbei erwähnen, die dann dauerhaft gespeichert werden"], "related": ["f11", "f12", "c7"], "providers": "z. B. OpenAI, Anthropic, Google (Umfang und Einstellungen je nach Anbieter unterschiedlich)", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "f17", "title": "Second Brain: Informationsmanagement mit KI", "type": "Strategie", "main": "functions", "sub": "memory", "icon": "library", "level": "Vertiefung", "tags": ["Wissensmanagement", "Obsidian", "Notion"], "shortDef": "Verstreute Informationen aus Mails, Notizen, Dokumenten und Terminen werden an einem Ort gesammelt, von der KI geordnet und über einen einzigen Zugangsort — etwa Claude — gefiltert und zusammengeführt.", "explain": "Ein „Second Brain“ ist eine persönliche Wissensablage, zum Beispiel in Obsidian (Markdown-Dateien auf dem eigenen Rechner) oder Notion. Neu ist die Rolle der KI: Sie legt Informationen strukturiert ab, verknüpft sie, erkennt Aufgaben und Termine und bereitet sie bei Bedarf auf — etwa als Tages- oder To-do-Übersicht. Über Konnektoren und Skills wird der Chatbot zum zentralen Zugangsort: Statt in fünf Programmen zu suchen, fragt man an einer Stelle. Das ist eine Richtung, in die sich KI-Assistenten gerade entwickeln: weg vom einzelnen Chat, hin zur Ordnung des eigenen Informationsalltags.", "usefulFor": "Menschen mit vielen parallelen Themen, Projekten und Informationsquellen, die den Überblick behalten wollen.", "useCases": ["Wichtige Mails automatisch als Notizen und Aufgaben in Obsidian ablegen lassen", "Alle offenen To-dos aus verschiedenen Notizen zu einer Liste zusammenführen", "Vor einem Termin alle Informationen zu einem Kunden oder Projekt bündeln lassen"], "example": "Eine geplante Aufgabe holt jeden Morgen neue Mails, legt Relevantes im Obsidian-Vault ab und erstellt eine Tagesübersicht mit Terminen und offenen Aufgaben.", "strengths": ["Ein Zugangsort statt vieler Programme", "Wissen bleibt dauerhaft auffindbar und verknüpft", "Mit Obsidian bleiben die Daten als Dateien auf dem eigenen Rechner"], "limitations": ["Einrichtung und Pflege erfordern Zeit und Disziplin", "Die KI erhält Zugriff auf viele persönliche und berufliche Daten — Berechtigungen bewusst vergeben", "Automatisch abgelegte Informationen können falsch eingeordnet sein und müssen gelegentlich geprüft werden"], "mistakes": ["Alles ungefiltert ablegen, sodass die Sammlung unübersichtlich wird", "Vertrauliche Daten ohne Prüfung in Cloud-Dienste übertragen"], "related": ["f16", "f12", "k1", "a4", "c4"], "providers": "z. B. Obsidian, Notion in Verbindung mit Claude, ChatGPT oder anderen Chatbots mit Konnektoren", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "a1", "title": "Skills: Anleitungen, die im Chat abrufbar sind", "type": "Funktion", "main": "automation", "sub": "skills", "icon": "bulb", "level": "Aufbau", "tags": ["Flexibel", "Offener Standard", "Konnektoren"], "shortDef": "Ein Skill ist eine umfangreiche, gespeicherte Anleitung — mit Arbeitsanweisungen, Inhalten, Wissen, Grenzen und bei Bedarf dem Zugriff auf andere Tools —, die der Chatbot in jedem beliebigen Chat aufrufen kann.", "explain": "Während ein Projekt einen bestimmten Arbeitsbereich dauerhaft einrahmt, ist ein Skill eine neue Form von Flexibilität: Er steht im Hintergrund bereit und wird geladen, sobald eine Aufgabe dazu passt oder man ihn direkt aufruft — in jedem Chat, auch mitten in einer laufenden Unterhaltung. Ein Skill kann Vorlagen, Beispiele, Logos oder Skripte enthalten und über Konnektoren andere Tools ansteuern, etwa eine Datei in der Ablage speichern oder einen E-Mail-Entwurf anlegen. Mehrere Skills lassen sich in einer Aufgabe kombinieren. Skills sind inzwischen ein anbieterübergreifender Ansatz: Sie beruhen auf einem offenen Format (SKILL.md), das neben Claude auch Gemini, Vibe (Mistral) und Microsoft Copilot unterstützen; bei ChatGPT stecken Skills in den Plugins. Ein einmal gebauter Skill lässt sich daher grundsätzlich auch in anderen Systemen weiterverwenden.", "usefulFor": "Wiederkehrende Arbeitsabläufe mit festen Qualitätsstandards, die in ganz unterschiedlichen Unterhaltungen gebraucht werden.", "useCases": ["Ein Skill für Teilnahmebescheinigungen im eigenen Design, der Daten aus einer Tabelle übernimmt", "Ein Skill „E-Mail-Antwort“, der Vorlagen, Tonalität und Grenzen enthält und einen Entwurf im Postfach anlegt", "Ein Branding-Skill, der jedes Dokument automatisch im Corporate Design gestaltet", "Einen Skill direkt vom Chatbot bauen lassen: „Mach aus dem, was wir gerade erarbeitet haben, einen Skill“"], "example": "Im Chat genügt: „Erstelle die Bescheinigungen für den Kurs in Valencia.\" Der Skill kennt Vorlage, Logo und Pflichtangaben, liest die Teilnehmerliste über einen Konnektor und liefert fertige PDFs.", "strengths": ["In jedem Chat verfügbar, nicht an ein Projekt gebunden", "Bündelt Wissen, Vorlagen, Grenzen und Werkzeuge an einem Ort", "Sorgt für gleichbleibende Qualität bei wiederkehrenden Aufgaben", "Offenes Format — zwischen Anbietern übertragbar"], "limitations": ["Erfordert anfangs sorgfältige Ausarbeitung und Tests", "Skills, die andere Tools ansteuern, brauchen passende Berechtigungen — Ergebnisse vor dem Versand prüfen"], "mistakes": ["Einen Skill zu allgemein beschreiben, sodass er nicht zuverlässig im richtigen Moment geladen wird", "Skills nie überarbeiten, obwohl sich Vorlagen oder Abläufe geändert haben"], "related": ["f13", "a2", "k1", "a3", "a4"], "providers": "Anthropic (Claude Skills), Google (Skills in Gemini, Nachfolger der Gems), Mistral (Skills in Vibe), Microsoft (Skills in Copilot), OpenAI (Skills als Teil von Plugins)", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "a2", "title": "Artefakte & Sites: HTML als Automatisierung und Visualisierung", "type": "Funktion", "main": "automation", "sub": "artefakte", "icon": "desktop", "level": "Aufbau", "tags": ["HTML", "Interaktiv", "Teilbar"], "shortDef": "Der Chatbot erzeugt fertige, interaktive Web-Seiten — Übersichten, Rechner, Quizze, Nachschlagewerke, kleine Werkzeuge —, die sich teilen und wiederverwenden lassen. Je nach Stufe laufen sie in der KI, ganz ohne KI oder mit eigener KI-Anbindung.", "explain": "Aus einer Beschreibung im Chat entsteht eine eigenständige HTML-Seite: bei Claude als Artefakt, bei ChatGPT als Site, bei Gemini über Canvas. Das ist zugleich Visualisierung (Inhalte werden anschaulich aufbereitet) und Automatisierung (einmal gebaut, erledigt die Seite eine Aufgabe immer wieder). Drei Stufen lassen sich unterscheiden:<br><br>(1) Das Artefakt in Claude — es läuft innerhalb von Claude und wird per Link geteilt; das hat die größte Reichweite.<br>(2) Das lokale HTML-Werkzeug ohne KI — die Seite wird als Datei heruntergeladen und läuft im Browser, ganz ohne Konto und ohne dass Daten das Gerät verlassen.<br>(3) Das „smarte“ Artefakt mit KI-Anbindung — entweder über Claude selbst, über eine Schnittstelle (API) zu einem KI-Anbieter oder datenschutzfreundlich über ein lokales Sprachmodell (z. B. mit Ollama).<br><br>Davon zu unterscheiden sind interaktive Antworten im Chat (etwa Intelligent UI bei ChatGPT): Sie sind praktisch zum Verstehen, bleiben aber im jeweiligen Chat und sind kein eigenständiges, teilbares Werkzeug. Dieses Nachschlagewerk ist selbst ein Beispiel: gebaut als Artefakt, veröffentlicht mit gleichbleibender Adresse.", "usefulFor": "Inhalte und kleine Werkzeuge, die mehrfach genutzt, geteilt oder interaktiv erkundet werden sollen, ohne selbst programmieren zu können.", "useCases": ["Ein interaktives Nachschlagewerk als Workshop-Dokumentation statt eines Foliensatzes", "Einen kleinen Rechner, etwa für Förderbeträge oder Zeitplanung — als lokale Datei ohne KI", "Ein Quiz oder eine Selbsteinschätzung für Teilnehmende", "Ein Werkzeug, das Texte mit einem lokalen Sprachmodell auswertet, sodass vertrauliche Inhalte das Haus nicht verlassen"], "example": "„Baue mir eine Seite, auf der Teilnehmende ihre Führungsstile per Selbsttest einschätzen und am Ende eine Auswertung sehen.\" Ergebnis: eine fertige, teilbare Web-Seite.", "strengths": ["Keine Programmierkenntnisse nötig", "Sofort teilbar und wiederverwendbar", "Verbindet Inhalt und Anschaulichkeit", "Stufe 2 und lokale KI ermöglichen Werkzeuge ganz ohne Datenabfluss"], "limitations": ["Inhalte und Rechenlogik vor der Weitergabe testen", "Ob ein geteilter Link bei Änderungen gleich bleibt, hängt von Anbieter und Veröffentlichungsweg ab", "Bauen und Nutzen von Artefakten in Claude verbraucht Kontingent — ohne eigenes Konto stößt man schnell an Nutzungsgrenzen", "Bei ChatGPT Sites müssen sich Betrachter:innen teils anmelden"], "mistakes": ["Zu viel auf einmal verlangen, statt die Seite schrittweise aufzubauen", "Vertrauliche Daten in ein geteiltes Artefakt einbauen"], "related": ["a1", "a5", "l1", "m7", "t2", "t1"], "providers": "Anthropic (Artefakte), OpenAI (Sites, Canvas), Google (Canvas); für Stufe 3 lokal z. B. Ollama", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "a5", "title": "KI teilen: Welche KI-Form kann ich mit wem teilen?", "type": "Konzept", "main": "automation", "sub": "teilen", "icon": "users", "level": "Aufbau", "tags": ["Teilen", "Zusammenarbeit", "Reichweite"], "shortDef": "Was man mit KI gebaut hat, lässt sich unterschiedlich weit teilen — vom Chatverlauf über Projekte und Notebooks bis zu Artefakten und Skills. Die Formen unterscheiden sich vor allem darin, wer ohne eigenes Konto mitarbeiten kann.", "explain": "<strong>Chat-Links</strong> teilen eine Momentaufnahme eines Gesprächs.<br><br><strong>Projekte</strong> (Claude, ChatGPT, Vibe) bündeln Wissensbasis und Instruktionen; geteilt werden sie meist innerhalb eines Teams oder einer Organisation mit passendem Konto.<br><br><strong>NotebookLM</strong> hat beim Teilen und gemeinsamen Arbeiten derzeit die größte Reichweite: Ein Notebook lässt sich einfach freigeben, und Empfänger können es befragen und daraus Material erzeugen.<br><br><strong>Web-Apps</strong> aus der KI sind unterschiedlich offen: Claude-Artefakte lassen sich per Link mit der größten Reichweite teilen; ChatGPT Sites und Apps aus Google AI Studio sind eingeschränkter teilbar und verlangen teils eine Anmeldung.<br><br><strong>Skills</strong> lassen sich als Datei weitergeben oder in der Organisation bereitstellen und dank des offenen Formats auch in anderen Systemen nutzen. Eigene GPTs oder Gems zu bauen, um sie zu teilen, ist dagegen kaum noch sinnvoll — beide Formate laufen aus.", "usefulFor": "Die Entscheidung, in welcher Form eine KI-Lösung an Kolleg:innen, Teilnehmende oder Kund:innen weitergegeben wird.", "useCases": ["Teilnehmenden eines Kurses ein Notebook mit allen Unterlagen freigeben", "Ein Artefakt als Werkzeug per Link an Kolleg:innen weitergeben", "Ein Projekt mit Wissensbasis für das ganze Team einrichten", "Einen bewährten Skill als Datei an eine Kollegin weitergeben"], "example": "Für eine Workshop-Dokumentation, die alle Teilnehmenden dauerhaft nutzen sollen, eignet sich ein Artefakt mit fester Adresse; für gemeinsames Weiterarbeiten an den Kursunterlagen ein geteiltes NotebookLM-Notebook.", "strengths": ["Macht aus einer persönlichen Lösung ein Werkzeug für viele", "Hilft, die passende Form nach Zielgruppe zu wählen"], "limitations": ["Freigabe- und Kontobedingungen unterscheiden sich je nach Anbieter und Tarif", "Geteilte Inhalte können vertrauliche Informationen enthalten — vor dem Teilen prüfen", "Wer ein geteiltes Werkzeug mit KI nutzt, braucht teils ein eigenes Konto oder Kontingent"], "mistakes": ["Einen Link teilen, ohne zu prüfen, ob die Empfänger ihn ohne Konto öffnen können", "Projekte mit sensiblen Dokumenten zu breit freigeben"], "related": ["a2", "t6", "f13", "a1", "f11"], "providers": "Google (NotebookLM, AI Studio), Anthropic (Projekte, Artefakte, Skills), OpenAI (Projekte, Sites), Mistral (Projekte in Vibe)", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "a3", "title": "Die Automatisierungs-Leiter", "type": "Konzept", "main": "automation", "sub": "leiter", "icon": "scale", "level": "Aufbau", "tags": ["Orientierung", "Überblick"], "shortDef": "Automatisierung mit KI lässt sich als Leiter mit fünf Stufen denken: Projekt, Skill, Artefakt, Konnektor und schließlich die geplante Aufgabe bzw. der Workflow — jede Stufe nimmt einem mehr Arbeit ab.", "explain": "Stufe 1, das Projekt, rahmt Chats mit Wissensbasis, Grenzen und Arbeitsanweisung ein. Stufe 2, der Skill, macht solche Anleitungen in jedem Chat abrufbar. Stufe 3, das Artefakt, macht aus einem Ergebnis ein wiederverwendbares, teilbares Werkzeug für andere. Stufe 4, der Konnektor, verbindet die KI mit E-Mail, Kalender, Ablage und anderen Tools, sodass Skills und Artefakte mit echten Arbeitsdaten arbeiten. Stufe 5, die geplante Aufgabe (Scheduled Task) oder der Workflow, läuft zeitgesteuert oder über Auslöser ganz ohne neuen Chat. Nicht jede Aufgabe braucht die höchste Stufe: Je höher, desto mehr Einrichtungsaufwand und desto wichtiger die Kontrolle.", "usefulFor": "Die Entscheidung, wie viel Automatisierung für eine konkrete Aufgabe sinnvoll ist.", "useCases": ["Kursanfragen einheitlich beantworten → Projekt", "Bescheinigungen in jedem Chat erzeugen → Skill", "Teilnehmenden ein Werkzeug zum Selbsttest geben → Artefakt", "Bescheinigungen direkt in der Ablage speichern und per Mail-Entwurf versenden → Skill + Konnektor", "Jeden Montag eine Übersicht der neuen Anmeldungen erstellen → geplante Aufgabe"], "example": "Im Workshop dieselbe Aufgabe — etwa Teilnehmerfeedback auswerten — einmal im normalen Chat, dann im Projekt, dann als Skill und schließlich als wöchentlich geplante Aufgabe umsetzen und den Unterschied erleben.", "strengths": ["Schafft Orientierung zwischen vielen Produktnamen", "Hilft, Aufwand und Nutzen abzuwägen"], "limitations": ["Die Grenzen zwischen den Stufen verschwimmen, weil Anbieter ihre Funktionen ständig erweitern"], "related": ["f13", "a1", "a2", "k1", "a4", "f15", "c8"], "providers": "Anbieterübergreifend", "note": null}, {"id": "a4", "title": "Geplante Aufgaben (Scheduled Tasks): Die KI arbeitet nach Zeitplan", "type": "Funktion", "main": "automation", "sub": "workflows", "icon": "refine", "level": "Aufbau", "tags": ["Zeitplan", "Routine", "Automatisierung"], "shortDef": "Eine geplante Aufgabe ist ein Auftrag an die KI, der automatisch zu einer festgelegten Zeit oder in einem Rhythmus ausgeführt wird — täglich, wöchentlich oder einmalig —, ohne dass man selbst einen Chat startet.", "explain": "Man beschreibt die Aufgabe einmal wie einen normalen Prompt und legt fest, wann sie laufen soll. Ihre volle Wirkung entfaltet sie im Zusammenspiel mit den anderen Bausteinen: Konnektoren liefern die echten Daten (Postfach, Kalender, Ablage), Skills sorgen für das gewünschte Format, und das Ergebnis kann etwa als Artefakt, Dokument oder Mail-Entwurf bereitliegen. So entsteht Schritt für Schritt Automatisierung, ohne dass man eine eigene Automatisierungsplattform einrichten muss.", "usefulFor": "Wiederkehrende Routinen, bei denen regelmäßig Informationen gesammelt, zusammengefasst oder aufbereitet werden.", "useCases": ["Jeden Morgen eine Übersicht über Termine und Mails mit Antwortbedarf erstellen lassen", "Jeden Montag die neuen Kursanmeldungen der Vorwoche zusammenfassen", "Einmal im Monat Neuigkeiten zu einem Fachthema recherchieren lassen"], "example": "„Fasse mir jeden Freitag um 15 Uhr alle Mails dieser Woche zu Kursanfragen zusammen und liste offene Fragen auf.“ — mit Konnektor zum Postfach läuft das künftig ganz ohne neuen Chat.", "strengths": ["Nimmt Routinearbeit ab, ohne dass man daran denken muss", "Kombinierbar mit Konnektoren, Skills und Artefakten", "Einrichtung ohne technische Vorkenntnisse"], "limitations": ["Ergebnisse regelmäßig prüfen, damit Fehler nicht unbemerkt weiterlaufen", "Aufgaben mit Zugriff auf Postfach oder Ablage brauchen bewusst vergebene Berechtigungen", "Verfügbarkeit und Häufigkeit hängen von Anbieter und Tarif ab"], "mistakes": ["Zu viele geplante Aufgaben anlegen, deren Ergebnisse niemand liest", "Aufgaben, die etwas versenden oder löschen, ohne Bestätigung laufen lassen"], "related": ["a3", "k1", "a1", "f15", "f17"], "providers": "z. B. Anthropic (geplante Aufgaben in Claude), OpenAI (Aufgaben in ChatGPT), Google (geplante Aktionen in Gemini), Microsoft (Automatisierungen in Copilot)", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "k1", "title": "Konnektoren: Die KI mit anderen Tools verbinden", "type": "Funktion", "main": "cowork", "sub": "konnektoren", "icon": "chain", "level": "Aufbau", "tags": ["MCP", "E-Mail & Kalender", "Ablage"], "shortDef": "Konnektoren verbinden den Chatbot mit anderen Anwendungen — E-Mail, Kalender, Cloud-Ablage, Tabellen, Projekttools —, sodass er dort Informationen lesen und, mit Erlaubnis, auch handeln kann.", "explain": "Ohne Konnektor kennt der Chatbot nur, was man ihm in den Chat kopiert. Mit Konnektor kann er etwa im Postfach nach einer Nachricht suchen, Termine prüfen, Dateien aus der Ablage lesen oder einen Entwurf anlegen. Technisch setzt sich dafür zunehmend ein offener Standard durch, das Model Context Protocol (MCP). Bei ChatGPT heißen die Anbindungen Plugins — sie bündeln inzwischen Konnektoren, Skills und Referenzmaterial in einem Paket. Konnektoren sind die Grundlage dafür, dass Skills, geplante Aufgaben und Agenten mit echten Arbeitsdaten umgehen können.", "usefulFor": "Aufgaben, die Informationen aus mehreren Tools zusammenführen oder dort direkt etwas erledigen sollen.", "useCases": ["„Fasse mir alle Mails zu Kurs X der letzten Woche zusammen\"", "Einen freien Termin für ein Vorgespräch finden", "Eine Teilnehmerliste aus der Cloud-Ablage lesen und auswerten"], "example": "„Welche Anfragen zu meinen Kursen sind diese Woche eingegangen, und welche sind noch unbeantwortet?\" — der Chatbot durchsucht über den Konnektor das Postfach und listet die offenen Punkte auf.", "strengths": ["Kein Kopieren zwischen Anwendungen mehr", "Grundlage für Skills und Agenten"], "limitations": ["Der Chatbot erhält Zugriff auf echte, oft vertrauliche Daten — Berechtigungen bewusst und sparsam vergeben", "Aktionen wie Senden oder Löschen immer vorab bestätigen"], "mistakes": ["Alle verfügbaren Konnektoren aktivieren, obwohl nur einer gebraucht wird"], "related": ["a1", "a4", "c1", "c6", "c7"], "providers": "Anthropic (Konnektoren/MCP), OpenAI (Plugins mit Apps und Skills), Google (verbundene Apps), Microsoft (Plugins in Copilot), Mistral", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "v1", "title": "ElevenLabs", "type": "Werkzeug", "main": "media", "sub": "stimme", "icon": "mic", "level": "Aufbau", "tags": ["Sprachausgabe", "Stimmen", "Vertonung"], "shortDef": "Spezialisierter Anbieter für KI-Stimmen: Texte in sehr natürlich klingende Sprache umwandeln, Stimmen gestalten oder klonen, Videos in andere Sprachen vertonen.", "explain": "ElevenLabs gilt als einer der führenden Anbieter für synthetische Sprache. Aus Text entstehen Sprachaufnahmen in vielen Sprachen und Stimmfarben; die eigene Stimme kann — mit Zustimmung — nachgebildet werden. Zusätzlich gibt es Funktionen für mehrsprachige Nachvertonung, Soundeffekte und sprechende Assistenten.", "usefulFor": "Professionelle Vertonung ohne Tonstudio: Erklärvideos, E-Learning, Hörfassungen, mehrsprachige Inhalte.", "useCases": ["Ein Erklärvideo für einen Kurs vertonen", "Eine Hörfassung eines Handouts erstellen", "Ein bestehendes Video ins Englische oder Spanische nachvertonen lassen"], "example": "Den Text eines Kursintros einfügen, eine passende Stimme wählen und die Audiodatei direkt unter ein mit Renderforest erstelltes Video legen.", "strengths": ["Sehr natürlich klingende Stimmen", "Viele Sprachen", "Einfache Bedienung"], "limitations": ["Stimmen realer Personen nur mit deren ausdrücklicher Zustimmung klonen", "Nutzungsrechte und kommerzielle Verwendung je nach Tarif prüfen"], "mistakes": ["Vertonte Texte ungeprüft veröffentlichen — Aussprache von Namen und Fachbegriffen kontrollieren"], "related": ["v2", "m5", "f6"], "providers": "ElevenLabs", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "v2", "title": "NotebookLM: Podcasts & Video-Übersichten aus eigenen Quellen", "type": "Funktion in Werkzeug", "main": "media", "sub": "stimme", "icon": "note", "level": "Grundlagen", "tags": ["Podcast", "Eigene Quellen", "Lernen"], "shortDef": "NotebookLM erzeugt aus hochgeladenen Dokumenten automatisch ein Gespräch zweier KI-Stimmen im Podcast-Format sowie kurze Video-Übersichten.", "explain": "Die Audio-Übersicht fasst die eigenen Quellen als lockeres Zwiegespräch zusammen — hörbar unterwegs, auch auf Englisch oder in anderen Sprachen. Die Inhalte bleiben dabei an die hochgeladenen Quellen gebunden. Die Video-Übersicht bereitet dieselben Inhalte als kurzes Erklärvideo mit Folien auf.", "usefulFor": "Lernen und Nachbereiten, besonders für Menschen, die lieber zuhören als lesen.", "useCases": ["Workshop-Unterlagen als Podcast zur Nachbereitung für Teilnehmende", "Eine lange Studie beim Pendeln anhören", "Einen Einstieg in ein neues Thema per Audio vorbereiten"], "example": "Alle Folien und Handouts eines Workshops hochladen und eine zehnminütige Audio-Übersicht erzeugen, die Teilnehmende nach dem Kurs anhören können.", "strengths": ["Kostenlos nutzbar", "Eng an die eigenen Quellen gebunden", "Sehr niedrige Einstiegshürde"], "limitations": ["Gesprächsform vereinfacht und kann Schwerpunkte verschieben — Inhalte stichprobenartig prüfen", "Stimmen und Stil nur begrenzt steuerbar"], "mistakes": ["Den Podcast als geprüfte Zusammenfassung weitergeben, ohne ihn selbst angehört zu haben"], "related": ["t6", "v1", "f12"], "providers": "Google (NotebookLM)", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "t19", "title": "SciSpace", "type": "Werkzeug", "main": "tools", "sub": "recherche", "icon": "book", "level": "Vertiefung", "tags": ["Wissenschaft", "Research Agent", "Prompt-Baukasten"], "shortDef": "Sehr umfangreiche Forschungsplattform, die die gesamte Kette wissenschaftlicher Arbeit abdeckt — von der Literatursuche über Auswertung, Datenextraktion und Visualisierung bis zum zitierten Textentwurf. Leicht zugänglich, aber mit großer Tiefe.", "explain": "Kern ist der SciSpace-Agent, der mehrstufige Forschungsaufgaben selbstständig abarbeitet und dafür auf zahlreiche spezialisierte Werkzeuge und Quellen zugreift. Der Einstieg ist bewusst niedrigschwellig: Über einen Baukasten auf der Startseite wird ein Auftrag aus Schaltflächen zusammengesetzt — Vorhaben (z. B. Report, Literaturüberblick), Werkzeug oder Quelle (z. B. Deep Research, PubMed) und Ausgabeformat (z. B. Word, PDF) —, und SciSpace formuliert daraus den Prompt. Die eigentliche Stärke liegt aber in der Tiefe: Deep-Review-Recherchen über sehr viele Quellen, systematische Reviews mit dokumentierten Suchschritten, Extraktion von Studiendaten in Tabellen, Visualisierung von Ergebnissen, Chat mit einzelnen Papers, Schreiben mit Quellenangaben sowie Prüfwerkzeuge wie KI-Detektor und KI-gestütztes Peer Review. Damit geht SciSpace deutlich über Elicit hinaus, das bei Suche, Extraktion und Synthese stehen bleibt.", "usefulFor": "Anspruchsvolle wissenschaftliche Recherche- und Schreibprojekte, bei denen Literaturarbeit, Auswertung, Visualisierung und Textproduktion in einer Umgebung zusammenlaufen sollen.", "useCases": ["„Report schreiben\" + „Deep Research\" + „Word-Dokument\": vom Rechercheauftrag direkt zum zitierten Berichtsentwurf", "„Literaturüberblick\" + „PubMed\" + „PDF-Report\" als fundierter Einstieg in ein biomedizinisches Thema", "Studiendaten aus vielen Papers in eine Vergleichstabelle extrahieren und die Ergebnisse visualisieren", "Einen eigenen Manuskriptentwurf vor der Einreichung durch KI-Peer-Review und KI-Detektor prüfen lassen"], "example": "Literaturüberblick, PubMed und PDF-Report anklicken, das Thema „Resilienz von Nachwuchsforschenden\" ergänzen: Der Agent recherchiert, wertet die Treffer aus, stellt Kernergebnisse tabellarisch gegenüber und liefert einen PDF-Bericht mit Quellen, der anschließend im selben Werkzeug weiterbearbeitet werden kann.", "strengths": ["Deckt die gesamte Kette von der Suche bis zum Entwurf ab", "Große Tiefe bei Auswertung, Visualisierung und Arbeit mit Quellen", "Trotz Umfang niedrigschwelliger Einstieg über den Prompt-Baukasten"], "limitations": ["Der Agent arbeitet mit einem Guthaben-System; umfangreiche Aufträge verbrauchen mehr davon", "KI-Detektoren liefern Wahrscheinlichkeiten, keine Beweise — Ergebnisse nie als alleinige Grundlage für Bewertungen nutzen", "Agenten-Recherchen ersetzen keine reproduzierbare systematische Literaturrecherche nach fachlichen Standards", "Der große Funktionsumfang braucht Einarbeitung, um ihn wirklich auszuschöpfen"], "mistakes": ["Den fertigen Report ungeprüft übernehmen, ohne die zitierten Quellen selbst anzusehen"], "related": ["t20", "t7", "t8", "f9"], "providers": "SciSpace", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "t20", "title": "Elicit, SciSpace oder Consensus? Eine Entscheidungshilfe", "type": "Konzept", "main": "tools", "sub": "recherche", "icon": "scale", "level": "Vertiefung", "tags": ["Vergleich", "Fachdisziplinen", "Orientierung"], "shortDef": "Die drei wissenschaftlichen Recherche-Tools überschneiden sich, haben aber klar unterschiedliche Stärken — je nach Arbeitsphase, Fragetyp und Fachdisziplin.", "explain": "Faustregel nach Arbeitsphase: Consensus für die schnelle, belegte Antwort auf eine fokussierte empirische Frage — mit „Consensus Meter\", der anzeigt, wie einig sich die Studienlage ist, und Filtern nach Journal-Qualität. Elicit für systematisches Arbeiten: strukturiertes Screening mit Ein- und Ausschlusskriterien und präzise Datenextraktion aus vielen Studien — es endet aber bei der Synthese und schreibt keine Texte. SciSpace für breite, explorative Recherche und die gesamte Kette bis zum Entwurf, dazu das vertiefte Lesen einzelner Papers. Zur Fachdisziplin: Alle drei sind auf empirische, englischsprachige Zeitschriftenliteratur ausgerichtet und am stärksten in Medizin, Lebens- und Naturwissenschaften; Sozialwissenschaften sind mittelgut, Geisteswissenschaften, Recht und Teile der Ingenieurwissenschaften deutlich schwächer abgedeckt. Consensus eignet sich am besten für Ja/Nein-Fragen und hat Mühe mit widersprüchlicher Evidenz.", "usefulFor": "Die Werkzeugwahl für eine konkrete Recherche — und die Einschätzung, wann KI-Tools an ihre Grenzen stoßen.", "useCases": ["Medizin/Gesundheit, „Wirkt Intervention X?\" → Consensus für den schnellen Überblick, Elicit für die systematische Aufarbeitung", "Psychologie/Bildungsforschung, Literaturüberblick für einen Antrag → SciSpace für die breite Suche und den Entwurf, Elicit für die Datentabelle", "Systematisches Review mit Dokumentationspflicht → Elicit als Hilfsmittel, ergänzt um klassische Fachdatenbanken", "Geistes- oder Rechtswissenschaften, theoretische Fragen → Bibliothekskataloge und Fachdatenbanken zuerst; KI-Tools höchstens ergänzend, etwa NotebookLM mit eigenen Quellen"], "example": "Für einen Antrag zur Nachwuchsförderung: mit Consensus prüfen, wie belastbar die Evidenz zu Mentoring-Effekten ist, mit Elicit die Kernstudien tabellarisch auswerten und mit SciSpace daraus einen zitierten Überblicksentwurf erstellen.", "strengths": ["Schafft Orientierung zwischen ähnlich wirkenden Tools", "Macht die fachliche Schieflage der Datenbanken sichtbar"], "limitations": ["Vergleiche und Benchmarks stammen oft von den Anbietern selbst und sind entsprechend vorsichtig zu lesen", "Funktionsumfang und Datenbestände ändern sich laufend"], "mistakes": ["Aus einer fehlenden Trefferliste schließen, dass es keine Forschung gibt — oft fehlt nur die Abdeckung", "Bücher, Sammelbände und nicht-englische Literatur zu übersehen, weil die Tools sie kaum erfassen"], "related": ["t7", "t19", "t8", "t6"], "providers": "Anbieterübergreifend", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}, {"id": "m7", "title": "Vorlage: Motion Graphics als HTML-Animation erstellen lassen", "type": "Vorlage", "main": "media", "sub": "videogenerierung", "secondary": ["automation"], "altSub": ["artefakte"], "icon": "clapper", "level": "Aufbau", "tags": ["Motion Graphics", "HTML", "Copy & Paste"], "shortDef": "Eine ausfüllbare Prompt-Vorlage, mit der ein Chatbot einen kurzen animierten Erklärfilm als HTML-Seite baut — mit Szenen, Texteinblendungen, Icons und weichen Übergängen.", "explain": "Statt eines Videos erzeugt der Chatbot eine HTML-Seite, die wie ein kurzer Animationsfilm abläuft: Titel, Figuren und Icons blenden ein, bewegen sich und gehen in die nächste Szene über. Die Vorlage gibt dafür eine feste Struktur vor — Inhalt, Format, Storyboard mit Zeitfenstern, Stil, technische Vorgaben und eine Prüfung vor der Ausgabe. Du füllst nur die Platzhalter in eckigen Klammern aus. Lässt du das Storyboard leer, schlägt der Chatbot zuerst eines vor.", "usefulFor": "Kurze Erklärsequenzen für Workshops, Kursankündigungen oder Websites, wenn keine Videoproduktion möglich ist und das Ergebnis klar und markengerecht aussehen soll.", "useCases": ["Einen 30-Sekunden-Einstieg erklären, z. B. „Was sind Skills in Claude?“", "Einen Ablauf oder Prozess Schritt für Schritt animiert darstellen", "Einen animierten Teaser für einen Kurs in den eigenen Markenfarben erstellen"], "example": "Thema „Skills in Claude“, Zielgruppe Verwaltungsmitarbeitende, 16:9, 30 Sekunden, fünf Szenen von Problem über Lösung bis Zusammenfassung, Stil Blau-Grün auf hellem Hintergrund. Ergebnis: eine Seite, die automatisch abläuft und am Ende einen Button „Nochmal abspielen“ zeigt.", "strengths": ["Gestochen scharf in jeder Größe, da alles gezeichnet statt gefilmt ist", "Texte, Farben und Timing lassen sich im Chat gezielt nachbessern", "Als Link teilbar und direkt im Browser abspielbar"], "limitations": ["Kein Ton, keine Sprecherstimme und keine Videodatei — für MP4 muss die Animation per Bildschirmaufnahme aufgezeichnet werden", "Ergebnisse hängen stark vom Modell ab; komplexe Bewegungen brauchen oft eine oder zwei Korrekturrunden"], "mistakes": ["Das Storyboard zu voll packen — mehr als fünf bis sechs Szenen in 30 Sekunden wirken hektisch", "Zu lange Texte einblenden lassen, die man in der kurzen Zeit nicht lesen kann", "Nach der ersten Version aufhören, statt konkrete Korrekturen zu geben („Szene 3 überlappt die Überschrift“)"], "related": ["a2", "a1", "p11", "m5"], "providers": "Am besten mit Chatbots, die HTML direkt anzeigen: Claude (Artefakte), ChatGPT (Canvas), Gemini (Canvas)", "note": "Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern.", "metaprompt": {"instruction": "Kopiere die Vorlage, ersetze alle Angaben in eckigen Klammern durch deine eigenen und füge sie als Nachricht in einen Chatbot ein, der HTML anzeigen kann (z. B. Claude oder ChatGPT mit Canvas). Nicht benötigte Punkte kannst du löschen.", "text": "Erstelle mir eine animierte Motion Graphic als eine einzige, eigenständige HTML-Datei (als Artefakt bzw. im Canvas, damit ich sie direkt ansehen, abspielen und teilen kann).\n\n## 1. Inhalt\n- Thema: [z. B. „Skills in Claude\"]\n- Zielgruppe: [z. B. Verwaltungsmitarbeitende ohne KI-Erfahrung]\n- Kernbotschaft in einem Satz: [...]\n- Sprache der Texte: [Deutsch / einfaches Englisch]\n\n## 2. Format\n- Seitenverhältnis: [16:9 / 9:16 / 1:1]\n- Dauer: [z. B. ca. 30 Sekunden]\n- Einsatz: [Beamer im Workshop / LinkedIn / Website]\n- Die Animation startet automatisch. Am Ende erscheint ein Button „Nochmal abspielen\".\n\n## 3. Szenen (Storyboard)\nFür jede Szene: Zeitfenster – was passiert – Text im Bild.\n1. (0–4 s) Titel „[...]\" blendet ein, Untertitel: „[...]\"\n2. ([...] s) Problem: [...]\n3. ([...] s) Lösung: [...]\n4. ([...] s) Anwendung/Beispiel: [...]\n5. ([...] s bis Ende) Zusammenfassung: [drei Punkte, je mit Icon], Schlusssatz: „[...]\"\n\nFalls ich hier kein Storyboard eintrage: Schlage mir zuerst ein Storyboard mit 4–6 Szenen vor und warte auf mein OK, bevor du die Animation baust.\n\n## 4. Stil\n- Look: [flach, freundlich, aufgeräumt]\n- Farben: [z. B. ruhiges Blau-Grün auf hellem Hintergrund / meine Markenfarben: #..., #...]\n- Schrift: serifenlos und groß, auf dem Beamer gut lesbar\n- Formen: abgerundet, einfache Icons und Figuren\n- Bewegung: weiche Übergänge mit Easing, sanfte Ein- und Ausblendungen und Bewegungen, keine harten Schnitte; Elemente dürfen von einer Szene in die nächste wandern\n- Texte: kurz und einfach, höchstens etwa acht Wörter pro Einblendung\n\n## 5. Technische Vorgaben\n- Eine einzige HTML-Datei mit CSS und JavaScript inline. Keine externen Bilder: Grafiken, Icons und Figuren zeichnest du selbst als SVG oder CSS. Extern laden darfst du nur eine Schrift (z. B. von Google Fonts).\n- Eine feste Bühne (z. B. 1920 × 1080 Pixel), die sich ohne Verzerrung ans Fenster anpasst.\n- Steuere die Animation über eine zentrale Zeitleiste in JavaScript (requestAnimationFrame) mit Keyframes je Element, damit das Timing genau zu den Szenen passt und „Nochmal abspielen\" sauber von vorn beginnt.\n- Ein dezenter Fortschrittsbalken am unteren Rand. [optional]\n- Bilde keine echten Logos, bekannten Figuren oder Marken nach. Eigene Logos nur, wenn ich sie dir als Datei oder SVG mitgebe.\n\n## 6. Prüfung vor der Ausgabe\nPrüfe, bevor du mir das Ergebnis gibst: Überlappen sich Texte oder Elemente? Sind alle Texte vollständig sichtbar und groß genug? Passen die Zeitfenster zu meinem Storyboard? Funktioniert der Button „Nochmal abspielen\"?\nNenne mir danach in zwei bis drei Sätzen, wo du von meinen Vorgaben abgewichen bist oder selbst etwas entschieden hast.", "filename": "motion-graphic-vorlage.txt"}}];

const ENTRIES_EN = {"p1": {"title": "The building blocks of a good prompt", "tags": ["Goal", "Context", "Role", "Format"], "shortDef": "A good prompt states the goal, context, role, task, desired output format, and constraints — the clearer these six building blocks, the more precisely targeted the answer.", "explain": "If one of these building blocks is missing, the AI fills the gap with an assumption — not always the right one. Stating the goal and format up front saves rework.", "usefulFor": "Whenever an answer needs to come in a particular form, length, or perspective.", "useCases": ["Getting an email drafted in a specific tone", "Requesting an analysis with a predefined structure", "Naming the audience explicitly so the language level fits"], "example": "Instead of \"Write me something about feedback\", try: \"As an experienced manager, write a 150-word guide for managers without an HR background, listing three concrete feedback rules as bullet points.\"", "strengths": ["Reduces follow-up questions and misunderstandings", "Applies to any task", "Works across every platform"], "limitations": ["Too many instructions at once can make a prompt unwieldy", "Doesn't replace a subject-matter check of the result"], "mistakes": ["Stating only the task but no goal", "Leaving the format open and then being surprised by an unsuitable answer length"], "providers": "Model-independent"}, "p2": {"title": "Zero-shot, one-shot, and few-shot prompting", "tags": ["Examples", "Steering"], "shortDef": "These three terms describe how many examples a prompt includes: none (zero-shot), one (one-shot), or several (few-shot).", "explain": "Examples show the AI what a result should look like instead of just describing it. The more ambiguous the task, the more one or two good examples help.", "usefulFor": "Tasks with a specific style, format, or recurring pattern, such as categorisation or rewriting.", "useCases": ["Always summarising minutes in the same format", "Generating emails in your own writing style, based on two example emails", "Classifying data according to a given pattern"], "example": "\"Here are two examples of how I summarise participant feedback: [Example 1] [Example 2]. Now summarise this third piece of feedback in the same style: [Text]\"", "strengths": ["Very effective for format requirements", "Reduces the need for lengthy written instructions"], "limitations": ["Poor examples lead to poor results", "Very long examples make the prompt unwieldy"], "mistakes": ["Mixing contradictory examples", "Treating a single example as an absolute rule"], "providers": "Model-independent"}, "p3": {"title": "Role prompting", "tags": ["Perspective", "Tone"], "shortDef": "Assigning the AI a role or expertise (\"Act as …\") to steer the perspective, terminology, and depth of the answer.", "explain": "A role acts like a filter: it shapes which knowledge and tone the model tends to draw on. It doesn't make a model more competent, but it helps set the angle.", "usefulFor": "Whenever a particular subject-matter perspective or communication style is wanted.", "useCases": ["\"Act as an experienced HR developer\" for a feedback guide", "\"Explain it as if to a colleague without a technical background\" for clarity", "Getting a counter-position from a different role to spot blind spots"], "example": "\"Act as the facilitator of a conflict-resolution session between two departments and suggest three conversation steps.\"", "strengths": ["Quick to apply", "Noticeably improves tone and terminology"], "limitations": ["Doesn't grant genuine subject-matter authority — results still need checking", "Can be inconsistent with contradictory role instructions"], "mistakes": ["Confusing the role with genuine professional certification"], "providers": "Model-independent"}, "p4": {"title": "Structured output formats", "tags": ["Tables", "Lists", "JSON"], "shortDef": "Explicitly specifying an output format — table, list, bullet points, JSON — instead of leaving it to chance.", "explain": "Instructions like \"as a table with columns X, Y, Z\" or \"as a numbered list\" make results directly usable, for instance in slides or forms.", "usefulFor": "Whenever the result should go straight into a document, spreadsheet, or other tool.", "useCases": ["Requesting a comparison table of several options", "Asking for bullet points for a slide instead of running text", "Requesting structured data for further processing in table form"], "example": "\"Give the answer as a table with the columns Criterion, Option A, Option B.\"", "strengths": ["Saves rework", "Makes comparing several points easier"], "limitations": ["For very complex format requirements, one or two examples help further"], "mistakes": ["Only requesting the format after the fact instead of specifying it upfront"], "providers": "Model-independent"}, "p5": {"title": "Iterative prompting", "tags": ["Refinement", "Dialogue"], "shortDef": "Rather than trying to perfect a result on the first attempt, refining it deliberately across several rounds of feedback.", "explain": "Chat is a dialogue, not an oracle. Treating a first answer as a starting point and steering it with specific feedback (\"shorter\", \"more concrete\", \"more practical examples\") usually gets to a usable result faster than one giant mega-prompt.", "usefulFor": "Complex or creative tasks where the exact target shape is hard to describe upfront.", "useCases": ["Refining a slide-deck draft step by step", "Drafting a text roughly first, then tightening it paragraph by paragraph", "Adjusting tone and length of an answer over several steps"], "example": "Request a first answer, then: \"Good start — cut this in half and add a concrete example from local government.\"", "strengths": ["Often reaches the goal faster than a perfect first prompt", "Reduces frustration with complex tasks"], "limitations": ["Too many rounds of iteration can make the context hard to follow"], "mistakes": ["Starting completely over after an unsuitable result instead of steering it further"], "providers": "Model-independent"}, "p6": {"title": "Actively inviting follow-up questions", "tags": ["Dialogue", "Clarification"], "shortDef": "Instead of anticipating every detail yourself, explicitly asking the chatbot to ask clarifying questions before it answers.", "explain": "A simple addition like \"Ask me follow-up questions first if anything is unclear\" prevents the AI from making a plausible but wrong assumption and building on it.", "usefulFor": "Complex or ambiguous tasks with many possible interpretations.", "useCases": ["Having framework conditions clarified before drafting a concept", "Having the target audience clarified for an open-ended creative task"], "example": "\"Before you write the concept: what information do you still need from me?\"", "strengths": ["Prevents costly misinterpretations", "Surfaces gaps in your own brief"], "limitations": ["Unnecessary for very simple tasks and slows the process down"], "mistakes": ["Ignoring follow-up questions and still expecting a precise answer"], "providers": "Model-independent"}, "p7": {"title": "Prompt chains for multi-step tasks", "tags": ["Decomposition", "Workflow"], "shortDef": "Breaking a complex task into several prompts that build on one another, instead of packing it all into a single prompt.", "explain": "Large tasks — such as \"create a complete workshop concept\" — produce better results when handled in stages: outline first, then content per section, then final polish.", "usefulFor": "Extensive creation tasks such as concepts, reports, or multi-part documents.", "useCases": ["Agreeing on an outline first, then developing it section by section", "Developing a slide deck's content first, then its design", "Having a data analysis calculated first, then interpreted"], "example": "Step 1: \"Suggest an outline for a 3-part online seminar.\" Step 2: \"Now develop part 2 in detail.\"", "strengths": ["Better control over intermediate results", "Errors surface earlier, before much work has gone in"], "limitations": ["Takes a bit more time and active steering than a single prompt"], "mistakes": ["Packing every requirement into one overloaded prompt"], "providers": "Model-independent"}, "p8": {"title": "Critically checking AI answers", "tags": ["Fact-checking", "Quality"], "shortDef": "AI answers are suggestions, not verified facts — figures, quotes, and citations should be independently verified before use.", "explain": "Chatbots can sound linguistically convincing while being factually wrong (so-called \"hallucinations\"). A second look is especially worthwhile for numbers, names, legal texts, and quotes.", "usefulFor": "Any use of AI results that will be shared or used for decisions.", "useCases": ["Cross-checking statistics before using them in a presentation", "Never adopting legal or medical claims unchecked", "Explicitly asking for the source when in doubt"], "example": "\"Where does this figure come from? Can you name a source?\" — and then checking that source yourself.", "strengths": ["Protects against embarrassing or consequential mistakes", "Sharpens your own critical eye"], "limitations": ["Requires extra time, especially for safety-critical topics"], "mistakes": ["Copying specific figures or quotes into official documents unchecked"], "providers": "Model-independent"}, "p9": {"title": "Common prompting mistakes", "tags": ["Pitfalls"], "shortDef": "Frequent causes of disappointing answers: missing context, an unclear goal, overly vague wording, no format specification.", "explain": "Most unsatisfying answers aren't the model's fault but the prompt's. Rereading your own request often reveals the gap yourself.", "usefulFor": "As a checklist whenever an answer doesn't convince.", "useCases": ["Checking whether the target audience was named", "Checking whether the desired length was specified", "Checking whether an example would have helped"], "example": "Instead of giving up (\"the AI doesn't understand me\"), add goal, context, and format to your own request and resend it.", "strengths": ["Quick self-help without any new tool"], "limitations": ["Doesn't replace a structured prompt template for recurring tasks"], "mistakes": ["Sending overly short, context-free requests (\"make this better\") without specifying what \"better\" means"], "providers": "Model-independent"}, "p10": {"title": "Prompt refinement as a routine", "tags": ["Templates", "Reuse"], "shortDef": "Saving proven prompts as personal templates and systematically refining them for recurring tasks.", "explain": "If you find a working prompt for a recurring task — such as meeting minutes or participant feedback — save it as a template and adjust it as needed, instead of rewriting it from scratch every time.", "usefulFor": "Task types that recur regularly in everyday work.", "useCases": ["Building a personal collection of proven prompt templates", "Reusing a template for meeting-minute summaries repeatedly", "Agreeing on team templates for consistent results"], "example": "Work out a prompt template for \"emails in my own style\" once and use it for individual cases afterwards.", "strengths": ["Saves considerable time over the long run", "Produces more consistent results across a team"], "limitations": ["Templates should be reviewed occasionally, since models keep evolving"], "mistakes": ["Never questioning a once-successful phrasing again"], "providers": "Model-independent"}, "p11": {"title": "Metaprompt: Letting the chatbot co-develop the perfect prompt with you", "tags": ["Iterative", "Copy & paste"], "shortDef": "A metaprompt isn't a finished prompt for a specific task — it's a prompt that instructs the chatbot to work with you, step by step, to develop the optimal prompt for what you actually need.", "explain": "Once pasted in, the chatbot takes the lead: it first briefly asks about your goal or topic. Then an iterative process runs over several rounds: each round you get a current prompt draft, three selectable enhancement options (a/b/c), and three open follow-up questions that don't overlap with the enhancements. You respond — for instance by picking an option or answering a question — the chatbot builds your answer into the next draft, and the round starts again until the prompt is finished.", "usefulFor": "Situations where you want a high-quality, well-thought-out prompt for a recurring or complex task, without having to work it all out yourself.", "useCases": ["Having a reusable prompt developed for a specific task such as meeting-minute summaries", "Working out a complex prompt for a new workshop format step by step, together", "Having an existing, unsatisfying prompt systematically improved"], "example": "After pasting it in, the chatbot briefly greets you and asks about the topic. If you answer, say, \"A prompt for feedback conversations\", you get a first draft plus three options and three follow-up questions — and refine the prompt further over the following rounds.", "strengths": ["Saves you from having to work out role, context, format, and goals yourself", "Systematically applies proven prompt-engineering techniques", "Stays clear even across several rounds thanks to its fixed structure"], "limitations": ["The process takes several rounds and is therefore slower than a directly written prompt", "Works best when your answers to the follow-up questions are as concrete as possible"], "mistakes": ["Pasting the metaprompt only partially or in an altered form instead of copying it in full", "Mixing in your own, different formatting partway through the process"], "providers": "Model-independent — works with ChatGPT, Claude, Gemini, and comparable chatbots", "metaprompt": {"instruction": "Copy the entire text below unchanged and paste it as your first message into a chatbot (e.g. ChatGPT, Claude, or Gemini). The chatbot takes it from there.", "text": "You are my prompt engineering expert. Your goal is to help me develop the most effective prompt for modern LLMs (such as Gemini, ChatGPT, Claude).\n\nThe final prompt should be written from my perspective (the user speaks directly to the chatbot, e.g. in the form: \"You are an expert in [topic]... I want you to...\").\n\n### Your tasks & way of working:\nWe will develop this prompt iteratively, in several steps. In the first round, you must not invent any details on your own — instead, build the prompt step by step based on my feedback.\n\n### Your output format (for every iteration):\n\n**Prompt:**\n> [Formulate the current draft of the prompt here. Use proven prompt-engineering techniques (e.g. role, context, goal, format specifications). Highlight this entire section exclusively using the markdown \">\" character (blockquote). Do not use any additional outer quotation marks.]\n\n**Possible additions:**\n[Offer me exactly three precise options (a, b, c) that can be directly integrated into the prompt to improve its quality (e.g. tone, target audience, specific frameworks). These options must be directly selectable.]\n* (a) [Option A]\n* (b) [Option B]\n* (c) [Option C]\n\n**Questions:**\n[Formulate exactly three numbered, open questions to close gaps in the prompt. Important: these questions must not overlap in content with the \"Possible additions\"!]\n1. [Question 1]\n2. [Question 2]\n3. [Question 3]\n\n**Next steps:**\n[Give me short, precise instructions on what I should do next (e.g. answer questions, choose options, or dictate changes directly).]\n\n---\n\n### Important behavioural rules for you:\n1. **No assumptions:** If information is missing, ask for it instead of guessing.\n2. **Consistency:** Keep this exact output format in EVERY iteration, until I say the prompt is finished.\n3. **Iterative integration:** When I reply to you (e.g. \"I choose (a), and for question 1 my answer is...\"), incorporate this information directly into the new prompt draft under \"Prompt:\" and generate new questions/additions for the next round of refinement.\n\n### Start trigger:\nBefore
