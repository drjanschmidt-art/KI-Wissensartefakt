zeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."},{"id":"f11","title":"Projekte und Projektordner","type":"Funktion","main":"automation","sub":"container","icon":"folder","level":"Aufbau","tags":["Kontext bündeln"],"shortDef":"Ein abgegrenzter Arbeitsbereich, in dem Dateien, Anweisungen und Chatverläufe zu einem Thema dauerhaft gebündelt werden.","explain":"Im Unterschied zu einem einzelnen Chat muss der Kontext hier nicht bei jeder neuen Unterhaltung erneut mitgeliefert werden — er steht dauerhaft zur Verfügung.","usefulFor":"Wiederkehrende Themen mit gleichbleibendem Hintergrundwissen, etwa ein laufendes Kursformat oder ein Kundenprojekt.","useCases":["Alle Unterlagen zu einem Kursformat an einem Ort bündeln","Feste Anweisungen für einen bestimmten Schreibstil dauerhaft hinterlegen"],"example":"Ein Projekt für ein wiederkehrendes Workshop-Format anlegen, in dem Corporate-Design-Vorgaben und frühere Foliensätze dauerhaft hinterlegt sind.","strengths":["Muss Kontext nicht jedes Mal neu erklären","Sorgt für konsistentere Ergebnisse über die Zeit"],"limitations":["Bei sensiblen Inhalten empfiehlt sich ein bewusster Umgang mit Freigaben und Sichtbarkeit"],"related":["f13","f16","a3"],"providers":"z. B. OpenAI (Projekte), Anthropic (Projekte)","note":"Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."},{"id":"f12","title":"Bibliotheken und Wissenssammlungen","type":"Funktion","main":"functions","sub":"memory","icon":"library","level":"Aufbau","tags":["Eigene Quellen"],"shortDef":"Eine dauerhafte Sammlung eigener Dokumente, auf die der Chatbot gezielt zugreifen kann, statt nur auf allgemeines Wissen.","explain":"Diese Funktion überschneidet sich mit Projekten, legt den Fokus aber stärker auf eine reine Quellensammlung, die gezielt befragt wird.","usefulFor":"Themenfelder mit einer klar abgegrenzten, wachsenden Dokumentensammlung.","useCases":["Alle Studien zu einem Forschungsthema an einem Ort sammeln","Eine wachsende Sammlung von Kursunterlagen gezielt befragbar machen"],"example":"Alle bisherigen Handreichungen zu einem wiederkehrenden Seminarthema in einer Sammlung hinterlegen und gezielt befragen.","strengths":["Antworten bleiben nachvollziehbar auf die hinterlegten Quellen bezogen"],"limitations":["Erfordert Pflege, damit veraltete Dokumente nicht zu veralteten Antworten führen"],"related":["t6","f11"],"providers":"z. B. Google NotebookLM, herstellerspezifische Wissenssammlungen","note":"Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."},{"id":"f13","title":"Container-Assistenten: GPTs, Gems & Agents","type":"Funktion","main":"automation","sub":"container","icon":"puzzle","level":"Vertiefung","tags":["Wissen","Grenzen","Arbeitsanweisung"],"shortDef":"Ein selbst gebauter „Container\" um den Chat: hochgeladenes Wissen, klar gesetzte Grenzen und eine feste Arbeitsanweisung im Hintergrund — einmal eingerichtet, immer wieder nutzbar.","explain":"Das Bild vom Container beschreibt, was alle Anbieter unter verschiedenen Namen anbieten: Custom GPTs bei ChatGPT, Gems bei Gemini, Agents bei Vibe (Mistral), Projekte mit Anweisungen bei Claude. Drei Bausteine begrenzen und steuern den Chat: (1) Wissen, das hochgeladen wird und auf das sich der Assistent stützt, (2) Grenzen, was er tun und lassen soll, (3) die Arbeitsanweisung, die bei jeder Unterhaltung unsichtbar mitläuft. Das ist die erste Stufe der Automatisierung: Der Kontext muss nicht mehr in jedem Chat neu erklärt werden.","usefulFor":"Klar abgegrenzte, wiederkehrende Aufgaben, die immer auf derselben Grundlage und im selben Stil erledigt werden sollen — auch von mehreren Personen.","useCases":["Einen Assistenten für die einheitliche Beantwortung von Teilnehmeranfragen mit hinterlegten FAQs bauen","Einen Assistenten mit Corporate-Design-Vorgaben für Foliensatz-Entwürfe anlegen","Einen Feedback-Assistenten bauen, der nur auf Basis eines hinterlegten Kompetenzmodells antwortet"],"example":"Ein Gem „Kursanfragen\" erhält als Wissen die Kursbeschreibungen, als Grenze „keine Zusagen zu Preisen oder Terminen, die nicht im Wissen stehen\" und als Arbeitsanweisung „antworte freundlich, auf Englisch, maximal 150 Wörter\".","strengths":["Standardisiert wiederkehrende Aufgaben","Kann im Team geteilt werden","Kein technisches Vorwissen nötig"],"limitations":["Bleibt an seinen Container gebunden — für jede neue Aufgabe braucht es einen eigenen Assistenten","Hochgeladenes Wissen muss gepflegt werden, sonst veralten die Antworten"],"related":["f11","a1","a3","t17"],"providers":"OpenAI (Custom GPTs), Google (Gems), Mistral (Agents in Vibe), Anthropic (Projekte)","note":"Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern.","mistakes":["Grenzen vergessen: Ohne sie ergänzt der Assistent fehlendes Wissen mit Vermutungen","Zu viele unterschiedliche Aufgaben in einen einzigen Container packen"]},{"id":"f14","title":"Agenten und Automatisierungen","type":"Funktion","main":"cowork","sub":"agenten","icon":"robot","level":"Vertiefung","tags":["Selbstständigkeit","Mehrschrittig"],"shortDef":"Ein Modus, in dem die KI mehrere Schritte einer Aufgabe eigenständig plant und ausführt, statt nach jedem Schritt auf eine neue Anweisung zu warten.","explain":"Im Unterschied zu einem normalen Chat trifft die KI hier Zwischenentscheidungen selbst — etwa welche Quelle als Nächstes geprüft wird — was mehr Aufmerksamkeit bei der Kontrolle erfordert.","usefulFor":"Mehrstufige Aufgaben mit klar abgrenzbarem Ziel und überprüfbarem Ergebnis.","useCases":["Eine mehrstufige Recherche eigenständig durchführen lassen","Mehrere Dateien in einer definierten Reihenfolge bearbeiten lassen"],"example":"Eine Reihe von Teilnehmerdaten eigenständig nach einem festen Schema aufbereiten lassen, mit abschließender Kontrolle durch die Nutzerin.","strengths":["Reduziert manuellen Zwischenaufwand bei klar definierten Abläufen"],"limitations":["Erfordert klare Aufgabenstellung und eine abschließende menschliche Prüfung","Bei sensiblen Daten besondere Vorsicht bei Berechtigungen geboten"],"related":["c1","c5"],"providers":"z. B. Anthropic (Cowork), OpenAI (Agenten-Modi)","note":"Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."},{"id":"f15","title":"Automatisierte Workflows","type":"Funktion","main":"automation","sub":"workflows","icon":"gear","level":"Vertiefung","tags":["Verkettung","Auslöser"],"shortDef":"Wiederkehrende Aufgaben über feste Auslöser und verkettete Schritte automatisch ausführen lassen, oft über zusätzliche Automatisierungswerkzeuge.","explain":"Diese Funktion geht über einzelne Chatanfragen hinaus: Ein Auslöser — etwa eine neue E-Mail oder ein neuer Tabelleneintrag — startet automatisch eine Kette von KI-gestützten Schritten.","usefulFor":"Regelmäßig wiederkehrende Abläufe mit klar definiertem Auslöser.","useCases":["Bei jeder neuen Kursanmeldung automatisch eine Bestätigungs-E-Mail entwerfen lassen","Regelmäßige Datenabgleiche zwischen zwei Systemen automatisieren"],"example":"Bei jedem neuen Eintrag in einer Anmeldetabelle automatisch einen Entwurf für die Teilnahmebestätigung erzeugen lassen.","strengths":["Spart bei wiederkehrenden Abläufen erheblich Zeit"],"limitations":["Erfordert eine sorgfältige Einrichtung und regelmäßige Kontrolle, damit Fehler nicht automatisiert weiterlaufen"],"related":["a3","a1","k1"],"providers":"z. B. Make.com in Kombination mit KI-Diensten","note":"Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."},{"id":"c1","title":"Cowork in Claude","type":"Arbeitsmodus","main":"cowork","sub":"agenten","icon":"layers","level":"Vertiefung","tags":["Dateien","Agentenhaft"],"shortDef":"Ein Arbeitsmodus von Anthropic, in dem Claude mehrstufige, dateibasierte Aufgaben eigenständig ausführt — von der Recherche bis zur fertigen Datei.","explain":"Im Unterschied zum normalen Chat kann Cowork über mehrere Werkzeuge und Schritte hinweg arbeiten, etwa Dateien lesen, bearbeiten und neue Dateien erzeugen, mit Bestätigung bei kritischen Schritten.","usefulFor":"Umfangreichere, mehrstufige Arbeitsaufträge mit mehreren Dateien.","useCases":["Mehrere Dokumente eines Projekts sichten und daraus einen zusammenfassenden Bericht erstellen","Eine Reihe von Dateien nach einem festen Schema umbenennen und sortieren lassen"],"example":"Alle Rechnungsdokumente eines Kursstandorts sichten und eine strukturierte Abrechnungsübersicht als Datei erzeugen lassen.","strengths":["Bearbeitet mehrstufige Aufgaben, ohne dass jeder Einzelschritt manuell angestoßen werden muss"],"limitations":["Erfordert eine klare Aufgabenstellung sowie eine abschließende Kontrolle, besonders bei sensiblen Unterlagen"],"related":["k1","c8","f14","a1"],"providers":"Anthropic","note":"Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."},{"id":"c2","title":"Work- und Agentenfunktionen in ChatGPT","type":"Arbeitsmodus","main":"cowork","sub":"agenten","icon":"robot","level":"Vertiefung","tags":["Vergleichbarer Modus"],"shortDef":"Vergleichbare mehrstufige, agentenähnliche Arbeitsmodi bei OpenAI, mit Zugriff auf Dateien, Web und weitere Werkzeuge.","explain":"Auch hier gilt: Aufgaben werden über mehrere Schritte hinweg selbstständig bearbeitet, mit Bestätigungspunkten bei folgenreichen Aktionen.","usefulFor":"Vergleichbare mehrstufige Aufgaben innerhalb der OpenAI-Umgebung.","useCases":["Eine mehrstufige Recherche mit anschließender Dokumentenerstellung durchführen lassen"],"example":"Einen Marktüberblick recherchieren und die Ergebnisse direkt in einem strukturierten Dokument zusammenfassen lassen.","strengths":["Reduziert manuellen Zwischenaufwand bei klar abgegrenzten Aufgaben"],"limitations":["Wie bei allen Agentenmodi: abschließende menschliche Prüfung notwendig"],"related":["c1","c8"],"providers":"OpenAI","note":"Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."},{"id":"c3","title":"Desktop-Apps","type":"Arbeitsmodus","main":"cowork","sub":"ordner","icon":"desktop","level":"Aufbau","tags":["Lokaler Zugriff"],"shortDef":"Eigenständige Anwendungen auf dem eigenen Rechner, die direkter mit lokalen Dateien, Ordnern und anderen Programmen zusammenarbeiten können als eine reine Browser-Oberfläche.","explain":"Im Unterschied zur Web-Oberfläche im Browser erlaubt eine Desktop-App oft einen direkteren Zugriff auf lokale Dateien und andere geöffnete Programme.","usefulFor":"Arbeiten, bei denen der direkte Zugriff auf lokale Dateien und Ordner den Ablauf erleichtert.","useCases":["Direkt mit Dateien im eigenen Dateisystem arbeiten, ohne sie einzeln hochzuladen"],"example":"Eine lokale Ordnerstruktur mit Kursunterlagen direkt über die Desktop-App durchsuchen und bearbeiten lassen.","strengths":["Engere Anbindung an das eigene Dateisystem und andere lokale Programme"],"limitations":["Erfordert Installation und bewusste Vergabe von Zugriffsrechten"],"related":["c4","c6"],"providers":"z. B. Anthropic, OpenAI (jeweils eigene Desktop-Anwendungen)","note":"Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."},{"id":"c4","title":"Arbeiten mit lokalen Dateien und Ordnern","type":"Arbeitsmodus","main":"cowork","sub":"ordner","icon":"folder","level":"Vertiefung","tags":["Dateizugriff"],"shortDef":"Ein Arbeitsmodus, in dem die KI direkt auf eine bestehende lokale Ordnerstruktur zugreift, statt einzelne Dateien manuell hochzuladen.","explain":"Das erleichtert Aufgaben, die mehrere zusammengehörige Dateien betreffen, erfordert aber eine bewusste Entscheidung, welcher Ordner freigegeben wird.","usefulFor":"Aufgaben mit vielen zusammengehörigen Dateien, etwa einem ganzen Projektordner.","useCases":["Alle Dateien eines Kursordners in einem Arbeitsgang sichten lassen","Eine bestehende Ordnerstruktur nach einem einheitlichen Schema umbenennen lassen"],"example":"Einen Ordner mit alten Foliensätzen sichten und die relevanten Inhalte für eine neue Präsentation zusammenstellen lassen.","strengths":["Effizient bei Aufgaben mit vielen zusammengehörigen Dateien"],"limitations":["Erfordert eine bewusste Entscheidung, welche Ordner und Dateien freigegeben werden, besonders bei vertraulichen Inhalten"],"related":["c3","c7"],"providers":"z. B. Anthropic, OpenAI (jeweils eigene Umsetzung)","note":"Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."},{"id":"c5","title":"Mehrstufige, agentenähnliche Aufgaben","type":"Arbeitsmodus","main":"cowork","sub":"agenten","icon":"chain","level":"Vertiefung","tags":["Ohne Zwischen-Prompt"],"shortDef":"Aufgaben, bei denen die KI mehrere aufeinanderfolgende Schritte selbstständig plant und ausführt, statt nach jedem Schritt auf eine neue Anweisung zu warten.","explain":"Der Unterschied zum normalen Chat liegt in der Eigenständigkeit zwischen den Schritten — die Nutzerin greift vor allem am Anfang und am Ende steuernd ein, statt jeden Zwischenschritt einzeln anzustoßen.","usefulFor":"Klar definierte Abläufe mit mehreren Teilschritten und überprüfbarem Endergebnis.","useCases":["Eine Reihe von Dokumenten in einer festen Abfolge verarbeiten lassen","Eine mehrstufige Recherche mit anschließender Zusammenfassung durchführen lassen"],"example":"Eine Abfolge aus Datenprüfung, Zusammenfassung und Erstellung eines Übergabedokuments in einem Arbeitsgang durchführen lassen.","strengths":["Reduziert die Zahl manueller Zwischenschritte bei wiederkehrenden Abläufen"],"limitations":["Setzt eine klare Aufgabendefinition voraus, sonst können sich Fehler über mehrere Schritte fortsetzen"],"related":["c1","f14"],"providers":"Modellunabhängig, Bezeichnung je nach Anbieter unterschiedlich","note":"Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."},{"id":"c6","title":"Berechtigungen und Freigaben","type":"Konzept","main":"cowork","sub":"sicherheit","icon":"lock","level":"Grundlagen","tags":["Kontrolle","Zugriff"],"shortDef":"Bevor ein Agenten- oder Cowork-Modus auf Dateien, Ordner oder externe Dienste zugreift, muss dieser Zugriff bewusst freigegeben werden.","explain":"Diese Freigaben legen fest, was die KI lesen, verändern oder versenden darf. Sie sollten so eng wie möglich gehalten und bei Bedarf wieder entzogen werden.","usefulFor":"Jede Nutzung von Agenten- oder Cowork-Modi mit Zugriff auf echte Dateien oder Dienste.","useCases":["Vor einer Aufgabe prüfen, welcher Ordner tatsächlich freigegeben werden muss","Freigaben nach Abschluss einer Aufgabe wieder zurücknehmen, wenn nicht mehr benötigt"],"example":"Für eine einmalige Auswertung nur den betreffenden Unterordner freigeben statt des gesamten Laufwerks.","strengths":["Bewusster Umgang mit Freigaben reduziert das Risiko ungewollter Zugriffe erheblich"],"limitations":["Erfordert etwas Einarbeitung in die jeweiligen Freigabe-Einstellungen des genutzten Tools"],"related":["k1","c7","c1"],"providers":"Modellunabhängig","note":null},{"id":"c7","title":"Datenschutz und Nutzerkontrolle","type":"Konzept","main":"cowork","sub":"sicherheit","icon":"shield","level":"Grundlagen","tags":["DSGVO","Sensible Daten"],"shortDef":"Bei sensiblen oder personenbezogenen Daten sollten Nutzer:innen bewusst entscheiden, was an ein KI-System weitergegeben wird und was nicht.","explain":"Nicht jede Aufgabe erfordert den Zugriff auf vollständige, unanonymisierte Datensätze — oft genügen anonymisierte Auszüge oder eine Bearbeitung ohne Hochladen sensibler Originaldateien.","usefulFor":"Jede Aufgabe mit personenbezogenen, vertraglichen oder anderweitig sensiblen Daten.","useCases":["Vor dem Hochladen prüfen, ob eine anonymisierte Version ausreicht","Klären, wo hochgeladene Daten verarbeitet und gespeichert werden"],"example":"Für eine Musteranalyse eine Teilnehmerliste ohne Namen und Kontaktdaten hochladen, statt der vollständigen Originaldatei.","strengths":["Reduziert Risiken bei der Arbeit mit sensiblen Informationen deutlich"],"limitations":["Erfordert etwas zusätzlichen Aufwand für Anonymisierung oder Datenprüfung vorab"],"related":["c6","f3"],"providers":"Modellunabhängig","note":null},{"id":"c8","title":"Chat, Projekt, Container-Assistent, Skill und Agent im Vergleich","type":"Konzept","main":"cowork","sub":"vergleich","icon":"scale","level":"Vertiefung","tags":["Orientierung","Auswahl"],"shortDef":"Fünf Arbeitsmodi mit wachsender Eigenständigkeit: der einzelne Chat, das Projekt mit dauerhaftem Kontext, der Container-Assistent, der flexibel aufrufbare Skill und der Agent bzw. Cowork-Modus, der selbst handelt.","explain":"Je mehr Eigenständigkeit ein Modus hat, desto mehr Nutzen bei wiederkehrenden oder umfangreichen Aufgaben, aber auch desto mehr Sorgfalt bei Freigaben und Kontrolle ist nötig.","usefulFor":"Die Entscheidung, welcher Modus für eine konkrete Aufgabe angemessen ist.","useCases":["Für eine einmalige, einfache Frage reicht ein normaler Chat","Für ein wiederkehrendes Thema mit stabilem Kontext eignet sich ein Projekt oder Container-Assistent","Für wiederkehrende Arbeitsabläufe, die in vielen Chats gebraucht werden, eignet sich ein Skill","Für mehrstufige, dateibasierte Aufgaben mit anderen Tools eignet sich ein Agent oder Cowork"],"example":"Eine einmalige Textfrage im normalen Chat klären, ein wiederkehrendes Kursformat dagegen in einem Projekt bündeln.","strengths":["Hilft, für jede Aufgabe den passenden, nicht überdimensionierten Modus zu wählen"],"limitations":["Die Grenzen zwischen den Modi verschieben sich mit der Weiterentwicklung der Anbieter"],"related":["a3","f13","a1","c1"],"providers":"Modellunabhängig","note":"Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."},{"id":"t18","title":"Qwen","type":"Werkzeug","main":"tools","sub":"multimodal","icon":"chat","level":"Aufbau","tags":["China","Open Source","Kostenlos"],"shortDef":"Multimodaler Chatbot und Modellfamilie des chinesischen Konzerns Alibaba — kostenlos nutzbar über Qwen Chat, viele Modelle offen und auch lokal einsetzbar.","explain":"Qwen umfasst sehr kleine Modelle für einzelne Geräte bis hin zu großen Spitzenmodellen (Stand September 2026: Qwen3.8-Max; Qwen 4 ist angekündigt). Die Web-App Qwen Chat versteht Text, Bilder und Dokumente und ist kostenlos. Viele Qwen-Modelle stehen unter einer offenen Lizenz und können auf dem eigenen Rechner betrieben werden — dann verlassen die Daten das eigene Gerät nicht.","usefulFor":"Kostenloses Ausprobieren eines leistungsstarken Chatbots sowie — technisch versierter — lokaler Betrieb ohne Cloud.","useCases":["Einen kostenlosen Zweitchatbot für den Vergleich von Antworten nutzen","Ein offenes Qwen-Modell lokal betreiben, etwa für Texte, die das Haus nicht verlassen sollen","Chinesischsprachige Inhalte verstehen oder übersetzen lassen"],"example":"Dieselbe Frage parallel an ChatGPT und Qwen stellen und die Antworten gegenüberstellen, um Stärken und blinde Flecken beider Modelle zu erkennen.","strengths":["Kostenlos nutzbar","Offene Modelle ermöglichen lokalen Betrieb","Starke Leistung im Verhältnis zu den Kosten"],"limitations":["Bei Qwen Chat im Browser werden die Daten auf Servern von Alibaba verarbeitet — für dienstliche oder sensible Inhalte vorab prüfen","Unterliegt als chinesischer Anbieter anderen regulatorischen Rahmenbedingungen, was sich bei politisch sensiblen Themen zeigen kann"],"mistakes":["Die Web-Version mit dem lokalen Betrieb verwechseln: Nur lokal bleiben die Daten auf dem eigenen Gerät"],"related":["t15","t1","c7"],"providers":"Alibaba Cloud (Qwen Chat, offene Modelle)","note":"Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."},{"id":"f16","title":"Memory: Was sich der Chatbot merkt","type":"Funktion","main":"functions","sub":"memory","icon":"library","level":"Grundlagen","tags":["Personalisierung","Kontext","Datenschutz"],"shortDef":"Mit der Memory-Funktion merkt sich der Chatbot Informationen über dich und deine Arbeit über einzelne Unterhaltungen hinaus — etwa deine Rolle, laufende Projekte oder bevorzugte Formate.","explain":"Ohne Memory beginnt jeder Chat bei null. Mit Memory kann der Chatbot auf frühere Unterhaltungen zurückgreifen oder gespeicherte Fakten nutzen, sodass Antworten besser zu dir passen. Je nach Anbieter lassen sich gespeicherte Erinnerungen einsehen, bearbeiten und löschen, frühere Chats gezielt durchsuchen oder Memory ganz abschalten. Zu unterscheiden ist Memory vom Projekt: Memory gilt allgemein für dich, ein Projekt nur für ein Thema.","usefulFor":"Regelmäßige Nutzung im Arbeitsalltag, bei der man nicht jedes Mal Rolle, Kontext und Vorlieben neu erklären möchte.","useCases":["Dem Chatbot einmal Rolle, Zielgruppen und Schreibstil mitteilen und dauerhaft davon profitieren","An eine Unterhaltung von letzter Woche anknüpfen, ohne alles erneut einzufügen","Vorlieben festlegen, etwa „antworte mir immer zuerst mit einer Kurzfassung\""],"example":"Einmal sagen „Ich bin Trainer für Führungskräfte in Hochschulen, schreibe mir bitte ohne Anglizismen\" — künftige Entwürfe berücksichtigen das automatisch.","strengths":["Spart wiederholtes Erklären","Antworten werden persönlicher und passgenauer"],"limitations":["Gespeicherte Informationen können veralten oder falsch sein und sollten gelegentlich überprüft werden","Sensible Daten gehören nicht ins Memory — bei vertraulichen Themen besser einen temporären Chat ohne Memory nutzen"],"mistakes":["Nicht wissen, was gespeichert ist: Gespeicherte Erinnerungen regelmäßig ansehen und aufräumen","Vertrauliche Kundendaten nebenbei erwähnen, die dann dauerhaft gespeichert werden"],"related":["f11","f12","c7"],"providers":"z. B. OpenAI, Anthropic, Google (Umfang und Einstellungen je nach Anbieter unterschiedlich)","note":"Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."},{"id":"a1","title":"Skills: Anleitungen, die im Chat abrufbar sind","type":"Funktion","main":"automation","sub":"skills","icon":"bulb","level":"Vertiefung","tags":["Flexibel","Wissen & Grenzen","Konnektoren"],"shortDef":"Ein Skill ist eine umfangreiche, gespeicherte Anleitung — mit Arbeitsanweisungen, Inhalten, Wissen, Grenzen und bei Bedarf dem Zugriff auf andere Tools —, die der Chatbot in jedem beliebigen Chat aufrufen kann.","explain":"Während ein Container-Assistent einen einzelnen Chat dauerhaft einrahmt, ist ein Skill eine neue Form von Flexibilität: Er steht im Hintergrund bereit und wird geladen, sobald eine Aufgabe dazu passt oder man ihn direkt aufruft — in jedem Chat, auch mitten in einer laufenden Unterhaltung. Ein Skill kann Vorlagen, Beispiele, Logos oder Skripte enthalten und über Konnektoren andere Tools ansteuern, etwa eine Datei in der Ablage speichern oder einen E-Mail-Entwurf anlegen. Mehrere Skills lassen sich in einer Aufgabe kombinieren.","usefulFor":"Wiederkehrende Arbeitsabläufe mit festen Qualitätsstandards, die in ganz unterschiedlichen Unterhaltungen gebraucht werden.","useCases":["Ein Skill für Teilnahmebescheinigungen im eigenen Design, der Daten aus einer Tabelle übernimmt","Ein Skill „E-Mail-Antwort\", der Vorlagen, Tonalität und Grenzen enthält und einen Entwurf im Postfach anlegt","Ein Branding-Skill, der jedes Dokument automatisch im Corporate Design gestaltet"],"example":"Im Chat genügt: „Erstelle die Bescheinigungen für den Kurs in Valencia.\" Der Skill kennt Vorlage, Logo und Pflichtangaben, liest die Teilnehmerliste über einen Konnektor und liefert fertige PDFs.","strengths":["In jedem Chat verfügbar, nicht an einen Container gebunden","Bündelt Wissen, Vorlagen, Grenzen und Werkzeuge an einem Ort","Sorgt für gleichbleibende Qualität bei wiederkehrenden Aufgaben"],"limitations":["Erfordert anfangs sorgfältige Ausarbeitung und Tests","Skills, die andere Tools ansteuern, brauchen passende Berechtigungen — Ergebnisse vor dem Versand prüfen"],"mistakes":["Einen Skill zu allgemein beschreiben, sodass er nicht zuverlässig im richtigen Moment geladen wird","Skills nie überarbeiten, obwohl sich Vorlagen oder Abläufe geändert haben"],"related":["f13","a2","k1","a3"],"providers":"Anthropic (Claude Skills); vergleichbare Ansätze entstehen bei weiteren Anbietern","note":"Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."},{"id":"a2","title":"Artefakte & Sites: HTML als Automatisierung und Visualisierung","type":"Funktion","main":"automation","sub":"artefakte","icon":"desktop","level":"Aufbau","tags":["HTML","Interaktiv","Teilbar"],"shortDef":"Der Chatbot erzeugt fertige, interaktive Web-Seiten — Übersichten, Rechner, Quizze, Nachschlagewerke —, die sich per Link teilen und wiederverwenden lassen.","explain":"Aus einer Beschreibung im Chat entsteht eine eigenständige HTML-Seite: bei Claude als Artefakt, bei ChatGPT als Site, bei Gemini über Canvas. Das ist zugleich Visualisierung (Inhalte werden anschaulich aufbereitet) und Automatisierung (einmal gebaut, erledigt die Seite eine Aufgabe immer wieder, etwa eine Berechnung oder eine Abfrage). Dieses Nachschlagewerk ist selbst ein Beispiel dafür.","usefulFor":"Inhalte, die mehrfach genutzt, geteilt oder interaktiv erkundet werden sollen, ohne selbst programmieren zu können.","useCases":["Ein interaktives Nachschlagewerk als Workshop-Dokumentation statt eines Foliensatzes","Einen kleinen Rechner, etwa für Förderbeträge oder Zeitplanung","Ein Quiz oder eine Selbsteinschätzung für Teilnehmende"],"example":"„Baue mir eine Seite, auf der Teilnehmende ihre Führungsstile per Selbsttest einschätzen und am Ende eine Auswertung sehen.\" Ergebnis: eine fertige, teilbare Web-Seite.","strengths":["Keine Programmierkenntnisse nötig","Sofort teilbar und wiederverwendbar","Verbindet Inhalt und Anschaulichkeit"],"limitations":["Inhalte und Rechenlogik vor der Weitergabe testen","Ob ein geteilter Link bei Änderungen gleich bleibt, hängt von Anbieter und Veröffentlichungsweg ab"],"mistakes":["Zu viel auf einmal verlangen, statt die Seite schrittweise aufzubauen"],"related":["a1","f10","t1","t2"],"providers":"Anthropic (Artefakte), OpenAI (Sites, Canvas), Google (Canvas)","note":"Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."},{"id":"a3","title":"Die Automatisierungs-Leiter","type":"Konzept","main":"automation","sub":"leiter","icon":"scale","level":"Aufbau","tags":["Orientierung","Überblick"],"shortDef":"Automatisierung mit KI lässt sich als Leiter mit vier Stufen denken: Container-Assistent, Skill, Artefakt bzw. Site und automatisierter Workflow — jede Stufe nimmt einem mehr Arbeit ab.","explain":"Stufe 1, der Container-Assistent, rahmt einen Chat mit Wissen, Grenzen und Arbeitsanweisung ein. Stufe 2, der Skill, macht solche Anleitungen in jedem Chat abrufbar und kann andere Tools ansteuern. Stufe 3, das Artefakt, macht aus einem Ergebnis ein wiederverwendbares Werkzeug für andere. Stufe 4, der Workflow, läuft über Auslöser ganz ohne Chat. Nicht jede Aufgabe braucht die höchste Stufe: Je höher, desto mehr Einrichtungsaufwand und desto wichtiger die Kontrolle.","usefulFor":"Die Entscheidung, wie viel Automatisierung für eine konkrete Aufgabe sinnvoll ist.","useCases":["Kursanfragen einheitlich beantworten → Container-Assistent","Bescheinigungen in jedem Chat erzeugen und ablegen → Skill","Teilnehmenden ein Werkzeug zum Selbsttest geben → Artefakt","Jede neue Anmeldung automatisch bestätigen → Workflow"],"example":"Im Workshop dieselbe Aufgabe — etwa Teilnehmerfeedback auswerten — einmal im normalen Chat, dann als Container-Assistent und schließlich als Skill umsetzen und den Unterschied erleben.","strengths":["Schafft Orientierung zwischen vielen Produktnamen","Hilft, Aufwand und Nutzen abzuwägen"],"limitations":["Die Grenzen zwischen den Stufen verschwimmen, weil Anbieter ihre Funktionen ständig erweitern"],"related":["f13","a1","a2","f15","c8"],"providers":"Anbieterübergreifend","note":null},{"id":"k1","title":"Konnektoren: Die KI mit anderen Tools verbinden","type":"Funktion","main":"cowork","sub":"konnektoren","icon":"chain","level":"Aufbau","tags":["MCP","E-Mail & Kalender","Ablage"],"shortDef":"Konnektoren verbinden den Chatbot mit anderen Anwendungen — E-Mail, Kalender, Cloud-Ablage, Tabellen, Projekttools —, sodass er dort Informationen lesen und, mit Erlaubnis, auch handeln kann.","explain":"Ohne Konnektor kennt der Chatbot nur, was man ihm in den Chat kopiert. Mit Konnektor kann er etwa im Postfach nach einer Nachricht suchen, Termine prüfen, Dateien aus der Ablage lesen oder einen Entwurf anlegen. Technisch setzt sich dafür zunehmend ein offener Standard durch, das Model Context Protocol (MCP); bei ChatGPT heißen die Anbindungen Plugins. Konnektoren sind die Grundlage dafür, dass Skills und Agenten mit echten Arbeitsdaten umgehen können.","usefulFor":"Aufgaben, die Informationen aus mehreren Tools zusammenführen oder dort direkt etwas erledigen sollen.","useCases":["„Fasse mir alle Mails zu Kurs X der letzten Woche zusammen\"","Einen freien Termin für ein Vorgespräch finden","Eine Teilnehmerliste aus der Cloud-Ablage lesen und auswerten"],"example":"„Welche Anfragen zu meinen Kursen sind diese Woche eingegangen, und welche sind noch unbeantwortet?\" — der Chatbot durchsucht über den Konnektor das Postfach und listet die offenen Punkte auf.","strengths":["Kein Kopieren zwischen Anwendungen mehr","Grundlage für Skills und Agenten"],"limitations":["Der Chatbot erhält Zugriff auf echte, oft vertrauliche Daten — Berechtigungen bewusst und sparsam vergeben","Aktionen wie Senden oder Löschen immer vorab bestätigen"],"mistakes":["Alle verfügbaren Konnektoren aktivieren, obwohl nur einer gebraucht wird"],"related":["a1","c1","c6","c7"],"providers":"Anthropic (Konnektoren/MCP), OpenAI (Plugins), Google (verbundene Apps), Mistral","note":"Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."},{"id":"v1","title":"ElevenLabs","type":"Werkzeug","main":"media","sub":"stimme","icon":"mic","level":"Aufbau","tags":["Sprachausgabe","Stimmen","Vertonung"],"shortDef":"Spezialisierter Anbieter für KI-Stimmen: Texte in sehr natürlich klingende Sprache umwandeln, Stimmen gestalten oder klonen, Videos in andere Sprachen vertonen.","explain":"ElevenLabs gilt als einer der führenden Anbieter für synthetische Sprache. Aus Text entstehen Sprachaufnahmen in vielen Sprachen und Stimmfarben; die eigene Stimme kann — mit Zustimmung — nachgebildet werden. Zusätzlich gibt es Funktionen für mehrsprachige Nachvertonung, Soundeffekte und sprechende Assistenten.","usefulFor":"Professionelle Vertonung ohne Tonstudio: Erklärvideos, E-Learning, Hörfassungen, mehrsprachige Inhalte.","useCases":["Ein Erklärvideo für einen Kurs vertonen","Eine Hörfassung eines Handouts erstellen","Ein bestehendes Video ins Englische oder Spanische nachvertonen lassen"],"example":"Den Text eines Kursintros einfügen, eine passende Stimme wählen und die Audiodatei direkt unter ein mit Renderforest erstelltes Video legen.","strengths":["Sehr natürlich klingende Stimmen","Viele Sprachen","Einfache Bedienung"],"limitations":["Stimmen realer Personen nur mit deren ausdrücklicher Zustimmung klonen","Nutzungsrechte und kommerzielle Verwendung je nach Tarif prüfen"],"mistakes":["Vertonte Texte ungeprüft veröffentlichen — Aussprache von Namen und Fachbegriffen kontrollieren"],"related":["v2","m5","f6"],"providers":"ElevenLabs","note":"Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."},{"id":"v2","title":"NotebookLM: Podcasts & Video-Übersichten aus eigenen Quellen","type":"Funktion in Werkzeug","main":"media","sub":"stimme","icon":"note","level":"Grundlagen","tags":["Podcast","Eigene Quellen","Lernen"],"shortDef":"NotebookLM erzeugt aus hochgeladenen Dokumenten automatisch ein Gespräch zweier KI-Stimmen im Podcast-Format sowie kurze Video-Übersichten.","explain":"Die Audio-Übersicht fasst die eigenen Quellen als lockeres Zwiegespräch zusammen — hörbar unterwegs, auch auf Englisch oder in anderen Sprachen. Die Inhalte bleiben dabei an die hochgeladenen Quellen gebunden. Die Video-Übersicht bereitet dieselben Inhalte als kurzes Erklärvideo mit Folien auf.","usefulFor":"Lernen und Nachbereiten, besonders für Menschen, die lieber zuhören als lesen.","useCases":["Workshop-Unterlagen als Podcast zur Nachbereitung für Teilnehmende","Eine lange Studie beim Pendeln anhören","Einen Einstieg in ein neues Thema per Audio vorbereiten"],"example":"Alle Folien und Handouts eines Workshops hochladen und eine zehnminütige Audio-Übersicht erzeugen, die Teilnehmende nach dem Kurs anhören können.","strengths":["Kostenlos nutzbar","Eng an die eigenen Quellen gebunden","Sehr niedrige Einstiegshürde"],"limitations":["Gesprächsform vereinfacht und kann Schwerpunkte verschieben — Inhalte stichprobenartig prüfen","Stimmen und Stil nur begrenzt steuerbar"],"mistakes":["Den Podcast als geprüfte Zusammenfassung weitergeben, ohne ihn selbst angehört zu haben"],"related":["t6","v1","f12"],"providers":"Google (NotebookLM)","note":"Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."},{"id":"t19","title":"SciSpace","type":"Werkzeug","main":"tools","sub":"recherche","icon":"book","level":"Vertiefung","tags":["Wissenschaft","Research Agent","Prompt-Baukasten"],"shortDef":"Sehr umfangreiche Forschungsplattform, die die gesamte Kette wissenschaftlicher Arbeit abdeckt — von der Literatursuche über Auswertung, Datenextraktion und Visualisierung bis zum zitierten Textentwurf. Leicht zugänglich, aber mit großer Tiefe.","explain":"Kern ist der SciSpace-Agent, der mehrstufige Forschungsaufgaben selbstständig abarbeitet und dafür auf zahlreiche spezialisierte Werkzeuge und Quellen zugreift. Der Einstieg ist bewusst niedrigschwellig: Über einen Baukasten auf der Startseite wird ein Auftrag aus Schaltflächen zusammengesetzt — Vorhaben (z. B. Report, Literaturüberblick), Werkzeug oder Quelle (z. B. Deep Research, PubMed) und Ausgabeformat (z. B. Word, PDF) —, und SciSpace formuliert daraus den Prompt. Die eigentliche Stärke liegt aber in der Tiefe: Deep-Review-Recherchen über sehr viele Quellen, systematische Reviews mit dokumentierten Suchschritten, Extraktion von Studiendaten in Tabellen, Visualisierung von Ergebnissen, Chat mit einzelnen Papers, Schreiben mit Quellenangaben sowie Prüfwerkzeuge wie KI-Detektor und KI-gestütztes Peer Review. Damit geht SciSpace deutlich über Elicit hinaus, das bei Suche, Extraktion und Synthese stehen bleibt.","usefulFor":"Anspruchsvolle wissenschaftliche Recherche- und Schreibprojekte, bei denen Literaturarbeit, Auswertung, Visualisierung und Textproduktion in einer Umgebung zusammenlaufen sollen.","useCases":["„Report schreiben\" + „Deep Research\" + „Word-Dokument\": vom Rechercheauftrag direkt zum zitierten Berichtsentwurf","„Literaturüberblick\" + „PubMed\" + „PDF-Report\" als fundierter Einstieg in ein biomedizinisches Thema","Studiendaten aus vielen Papers in eine Vergleichstabelle extrahieren und die Ergebnisse visualisieren","Einen eigenen Manuskriptentwurf vor der Einreichung durch KI-Peer-Review und KI-Detektor prüfen lassen"],"example":"Literaturüberblick, PubMed und PDF-Report anklicken, das Thema „Resilienz von Nachwuchsforschenden\" ergänzen: Der Agent recherchiert, wertet die Treffer aus, stellt Kernergebnisse tabellarisch gegenüber und liefert einen PDF-Bericht mit Quellen, der anschließend im selben Werkzeug weiterbearbeitet werden kann.","strengths":["Deckt die gesamte Kette von der Suche bis zum Entwurf ab","Große Tiefe bei Auswertung, Visualisierung und Arbeit mit Quellen","Trotz Umfang niedrigschwelliger Einstieg über den Prompt-Baukasten"],"limitations":["Der Agent arbeitet mit einem Guthaben-System; umfangreiche Aufträge verbrauchen mehr davon","KI-Detektoren liefern Wahrscheinlichkeiten, keine Beweise — Ergebnisse nie als alleinige Grundlage für Bewertungen nutzen","Agenten-Recherchen ersetzen keine reproduzierbare systematische Literaturrecherche nach fachlichen Standards","Der große Funktionsumfang braucht Einarbeitung, um ihn wirklich auszuschöpfen"],"mistakes":["Den fertigen Report ungeprüft übernehmen, ohne die zitierten Quellen selbst anzusehen"],"related":["t20","t7","t8","f9"],"providers":"SciSpace","note":"Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."},{"id":"t20","title":"Elicit, SciSpace oder Consensus? Eine Entscheidungshilfe","type":"Konzept","main":"tools","sub":"recherche","icon":"scale","level":"Vertiefung","tags":["Vergleich","Fachdisziplinen","Orientierung"],"shortDef":"Die drei wissenschaftlichen Recherche-Tools überschneiden sich, haben aber klar unterschiedliche Stärken — je nach Arbeitsphase, Fragetyp und Fachdisziplin.","explain":"Faustregel nach Arbeitsphase: Consensus für die schnelle, belegte Antwort auf eine fokussierte empirische Frage — mit „Consensus Meter\", der anzeigt, wie einig sich die Studienlage ist, und Filtern nach Journal-Qualität. Elicit für systematisches Arbeiten: strukturiertes Screening mit Ein- und Ausschlusskriterien und präzise Datenextraktion aus vielen Studien — es endet aber bei der Synthese und schreibt keine Texte. SciSpace für breite, explorative Recherche und die gesamte Kette bis zum Entwurf, dazu das vertiefte Lesen einzelner Papers. Zur Fachdisziplin: Alle drei sind auf empirische, englischsprachige Zeitschriftenliteratur ausgerichtet und am stärksten in Medizin, Lebens- und Naturwissenschaften; Sozialwissenschaften sind mittelgut, Geisteswissenschaften, Recht und Teile der Ingenieurwissenschaften deutlich schwächer abgedeckt. Consensus eignet sich am besten für Ja/Nein-Fragen und hat Mühe mit widersprüchlicher Evidenz.","usefulFor":"Die Werkzeugwahl für eine konkrete Recherche — und die Einschätzung, wann KI-Tools an ihre Grenzen stoßen.","useCases":["Medizin/Gesundheit, „Wirkt Intervention X?\" → Consensus für den schnellen Überblick, Elicit für die systematische Aufarbeitung","Psychologie/Bildungsforschung, Literaturüberblick für einen Antrag → SciSpace für die breite Suche und den Entwurf, Elicit für die Datentabelle","Systematisches Review mit Dokumentationspflicht → Elicit als Hilfsmittel, ergänzt um klassische Fachdatenbanken","Geistes- oder Rechtswissenschaften, theoretische Fragen → Bibliothekskataloge und Fachdatenbanken zuerst; KI-Tools höchstens ergänzend, etwa NotebookLM mit eigenen Quellen"],"example":"Für einen Antrag zur Nachwuchsförderung: mit Consensus prüfen, wie belastbar die Evidenz zu Mentoring-Effekten ist, mit Elicit die Kernstudien tabellarisch auswerten und mit SciSpace daraus einen zitierten Überblicksentwurf erstellen.","strengths":["Schafft Orientierung zwischen ähnlich wirkenden Tools","Macht die fachliche Schieflage der Datenbanken sichtbar"],"limitations":["Vergleiche und Benchmarks stammen oft von den Anbietern selbst und sind entsprechend vorsichtig zu lesen","Funktionsumfang und Datenbestände ändern sich laufend"],"mistakes":["Aus einer fehlenden Trefferliste schließen, dass es keine Forschung gibt — oft fehlt nur die Abdeckung","Bücher, Sammelbände und nicht-englische Literatur zu übersehen, weil die Tools sie kaum erfassen"],"related":["t7","t19","t8","t6"],"providers":"Anbieterübergreifend","note":"Bezeichnung, Verfügbarkeit und Funktionsumfang können sich je nach Anbieter, Tarif, Region, Plattform und Zeitpunkt ändern."}];

const ENTRIES_EN = {"p1":{"title":"The building blocks of a good prompt","tags":["Goal","Context","Role","Format"],"shortDef":"A good prompt states the goal, context, role, task, desired output format, and constraints — the clearer these six building blocks, the more precisely targeted the answer.","explain":"If one of these building blocks is missing, the AI fills the gap with an assumption — not always the right one. Stating the goal and format up front saves rework.","usefulFor":"Whenever an answer needs to come in a particular form, length, or perspective.","useCases":["Getting an email drafted in a specific tone","Requesting an analysis with a predefined structure","Naming the audience explicitly so the language level fits"],"example":"Instead of \"Write me something about feedback\", try: \"As an experienced manager, write a 150-word guide for managers without an HR background, listing three concrete feedback rules as bullet points.\"","strengths":["Reduces follow-up questions and misunderstandings","Applies to any task","Works across every platform"],"limitations":["Too many instructions at once can make a prompt unwieldy","Doesn't replace a subject-matter check of the result"],"mistakes":["Stating only the task but no goal","Leaving the format open and then being surprised by an unsuitable answer length"],"providers":"Model-independent"},"p2":{"title":"Zero-shot, one-shot, and few-shot prompting","tags":["Examples","Steering"],"shortDef":"These three terms describe how many examples a prompt includes: none (zero-shot), one (one-shot), or several (few-shot).","explain":"Examples show the AI what a result should look like instead of just describing it. The more ambiguous the task, the more one or two good examples help.","usefulFor":"Tasks with a specific style, format, or recurring pattern, such as categorisation or rewriting.","useCases":["Always summarising minutes in the same format","Generating emails in your own writing style, based on two example emails","Classifying data according to a given pattern"],"example":"\"Here are two examples of how I summarise participant feedback: [Example 1] [Example 2]. Now summarise this third piece of feedback in the same style: [Text]\"","strengths":["Very effective for format requirements","Reduces the need for lengthy written instructions"],"limitations":["Poor examples lead to poor results","Very long examples make the prompt unwieldy"],"mistakes":["Mixing contradictory examples","Treating a single example as an absolute rule"],"providers":"Model-independent"},"p3":{"title":"Role prompting","tags":["Perspective","Tone"],"shortDef":"Assigning the AI a role or expertise (\"Act as …\") to steer the perspective, terminology, and depth of the answer.","explain":"A role acts like a filter: it shapes which knowledge and tone the model tends to draw on. It doesn't make a model more competent, but it helps set the angle.","usefulFor":"Whenever a particular subject-matter perspective or communication style is wanted.","useCases":["\"Act as an experienced HR developer\" for a feedback guide","\"Explain it as if to a colleague without a technical background\" for clarity","Getting a counter-position from a different role to spot blind spots"],"example":"\"Act as the facilitator of a conflict-resolution session between two departments and suggest three conversation steps.\"","strengths":["Quick to apply","Noticeably improves tone and terminology"],"limitations":["Doesn't grant genuine subject-matter authority — results still need checking","Can be inconsistent with contradictory role instructions"],"mistakes":["Confusing the role with genuine professional certification"],"providers":"Model-independent"},"p4":{"title":"Structured output formats","tags":["Tables","Lists","JSON"],"shortDef":"Explicitly specifying an output format — table, list, bullet points, JSON — instead of leaving it to chance.","explain":"Instructions like \"as a table with columns X, Y, Z\" or \"as a numbered list\" make results directly usable, for instance in slides or forms.","usefulFor":"Whenever the result should go straight into a document, spreadsheet, or other tool.","useCases":["Requesting a comparison table of several options","Asking for bullet points for a slide instead of running text","Requesting structured data for further processing in table form"],"example":"\"Give the answer as a table with the columns Criterion, Option A, Option B.\"","strengths":["Saves rework","Makes comparing several points easier"],"limitations":["For very complex format requirements, one or two examples help further"],"mistakes":["Only requesting the format after the fact instead of specifying it upfront"],"providers":"Model-independent"},"p5":{"title":"Iterative prompting","tags":["Refinement","Dialogue"],"shortDef":"Rather than trying to perfect a result on the first attempt, refining it deliberately across several rounds of feedback.","explain":"Chat is a dialogue, not an oracle. Treating a first answer as a starting point and steering it with specific feedback (\"shorter\", \"more concrete\", \"more practical examples\") usually gets to a usable result faster than one giant mega-prompt.","usefulFor":"Complex or creative tasks where the exact target shape is hard to describe upfront.","useCases":["Refining a slide-deck draft step by step","Drafting a text roughly first, then tightening it paragraph by paragraph","Adjusting tone and length of an answer over several steps"],"example":"Request a first answer, then: \"Good start — cut this in half and add a concrete example from local government.\"","strengths":["Often reaches the goal faster than a perfect first prompt","Reduces frustration with complex tasks"],"limitations":["Too many rounds of iteration can make the context hard to follow"],"mistakes":["Starting completely over after an unsuitable result instead of steering it further"],"providers":"Model-independent"},"p6":{"title":"Actively inviting follow-up questions","tags":["Dialogue","Clarification"],"shortDef":"Instead of anticipating every detail yourself, explicitly asking the chatbot to ask clarifying questions before it answers.","explain":"A simple addition like \"Ask me follow-up questions first if anything is unclear\" prevents the AI from making a plausible but wrong assumption and building on it.","usefulFor":"Complex or ambiguous tasks with many possible interpretations.","useCases":["Having framework conditions clarified before drafting a concept","Having the target audience clarified for an open-ended creative task"],"example":"\"Before you write the concept: what information do you still need from me?\"","strengths":["Prevents costly misinterpretations","Surfaces gaps in your own brief"],"limitations":["Unnecessary for very simple tasks and slows the process down"],"mistakes":["Ignoring follow-up questions and still expecting a precise answer"],"providers":"Model-independent"},"p7":{"title":"Prompt chains for multi-step tasks","tags":["Decomposition","Workflow"],"shortDef":"Breaking a complex task into several prompts that build on one another, instead of packing it all into a single prompt.","explain":"Large tasks — such as \"create a complete workshop concept\" — produce better results when handled in stages: outline first, then content per section, then final polish.","usefulFor":"Extensive creation tasks such as concepts, reports, or multi-part documents.","useCases":["Agreeing on an outline first, then developing it section by section","Developing a slide deck's content first, then its design","Having a data analysis calculated first, then interpreted"],"example":"Step 1: \"Suggest an outline for a 3-part online seminar.\" Step 2: \"Now develop part 2 in detail.\"","strengths":["Better control over intermediate results","Errors surface earlier, before much work has gone in"],"limitations":["Takes a bit more time and active steering than a single prompt"],"mistakes":["Packing every requirement into one overloaded prompt"],"providers":"Model-independent"},"p8":{"title":"Critically checking AI answers","tags":["Fact-checking","Quality"],"shortDef":"AI answers are suggestions, not verified facts — figures, quotes, and citations should be independently verified before use.","explain":"Chatbots can sound linguistically convincing while being factually wrong (so-called \"hallucinations\"). A second look is especially worthwhile for numbers, names, legal texts, and quotes.","usefulFor":"Any use of AI results that will be shared or used for decisions.","useCases":["Cross-checking statistics before using them in a presentation","Never adopting legal or medical claims unchecked","Explicitly asking for the source when in doubt"],"example":"\"Where does this figure come from? Can you name a source?\" — and then checking that source yourself.","strengths":["Protects against embarrassing or consequential mistakes","Sharpens your own critical eye"],"limitations":["Requires extra time, especially for safety-critical topics"],"mistakes":["Copying specific figures or quotes into official documents unchecked"],"providers":"Model-independent"},"p9":{"title":"Common prompting mistakes","tags":["Pitfalls"],"shortDef":"Frequent causes of disappointing answers: missing context, an unclear goal, overly vague wording, no format specification.","explain":"Most unsatisfying answers aren't the model's fault but the prompt's. Rereading your own request often reveals the gap yourself.","usefulFor":"As a checklist whenever an answer doesn't convince.","useCases":["Checking whether the target audience was named","Checking whether the desired length was specified","Checking whether an example would have helped"],"example":"Instead of giving up (\"the AI doesn't understand me\"), add goal, context, and format to your own request and resend it.","strengths":["Quick self-help without any new tool"],"limitations":["Doesn't replace a structured prompt template for recurring tasks"],"mistakes":["Sending overly short, context-free requests (\"make this better\") without specifying what \"better\" means"],"providers":"Model-independent"},"p10":{"title":"Prompt refinement as a routine","tags":["Templates","Reuse"],"shortDef":"Saving proven prompts as personal templates and systematically refining them for recurring tasks.","explain":"If you find a working prompt for a recurring task — such as meeting minutes or participant feedback — save it as a template and adjust it as needed, instead of rewriting it from scratch every time.","usefulFor":"Task types that recur regularly in everyday work.","useCases":["Building a personal collection of proven prompt templates","Reusing a template for meeting-minute summaries repeatedly","Agreeing on team templates for consistent results"],"example":"Work out a prompt template for \"emails in my own style\" once and use it for individual cases afterwards.","strengths":["Saves considerable time over the long run","Produces more consistent results across a team"],"limitations":["Templates should be reviewed occasionally, since models keep evolving"],"mistakes":["Never questioning a once-successful phrasing again"],"providers":"Model-independent"},"p11":{"title":"Metaprompt: Letting the chatbot co-develop the perfect prompt with you","tags":["Iterative","Copy & paste"],"shortDef":"A metaprompt isn't a finished prompt for a specific task — it's a prompt that instructs the chatbot to work with you, step by step, to develop the optimal prompt for what you actually need.","explain":"Once pasted in, the chatbot takes the lead: it first briefly asks about your goal or topic. Then an iterative process runs over several rounds: each round you get a current prompt draft, three selectable enhancement options (a/b/c), and three open follow-up questions that don't overlap with the enhancements. You respond — for instance by picking an option or answering a question — the chatbot builds your answer into the next draft, and the round starts again until the prompt is finished.","usefulFor":"Situations where you want a high-quality, well-thought-out prompt for a recurring or complex task, without having to work it all out yourself.","useCases":["Having a reusable prompt developed for a specific task such as meeting-minute summaries","Working out a complex prompt for a new workshop format step by step, together","Having an existing, unsatisfying prompt systematically improved"],"example":"After pasting it in, the chatbot briefly greets you and asks about the topic. If you answer, say, \"A prompt for feedback conversations\", you get a first draft plus three options and three follow-up questions — and refine the prompt further over the following rounds.","strengths":["Saves you from having to work out role, context, format, and goals yourself","Systematically applies proven prompt-engineering techniques","Stays clear even across several rounds thanks to its fixed structure"],"limitations":["The process takes several rounds and is therefore slower than a directly written prompt","Works best when your answers to the follow-up questions are as concrete as possible"],"mistakes":["Pasting the metaprompt only partially or in an altered form instead of copying it in full","Mixing in your own, different formatting partway through the process"],"providers":"Model-independent — works with ChatGPT, Claude, Gemini, and comparable chatbots","metaprompt":{"instruction":"Copy the entire text below unchanged and paste it as your first message into a chatbot (e.g. ChatGPT, Claude, or Gemini). The chatbot takes it from there.","text":"You are my prompt engineering expert. Your goal is to help me develop the most effective prompt for modern LLMs (such as Gemini, ChatGPT, Claude).\n\nThe final prompt should be written from my perspective (the user speaks directly to the chatbot, e.g. in the form: \"You are an expert in [topic]... I want you to...\").\n\n### Your tasks & way of working:\nWe will develop this prompt iteratively, in several steps. In the first round, you must not invent any details on your own — instead, build the prompt step by step based on my feedback.\n\n### Your output format (for every iteration):\n\n**Prompt:**\n> [Formulate the current draft of the prompt here. Use proven prompt-engineering techniques (e.g. role, context, goal, format specifications). Highlight this entire section exclusively using the markdown \">\" character (blockquote). Do not use any additional outer quotation marks.]\n\n**Possible additions:**\n[Offer me exactly three precise options (a, b, c) that can be directly integrated into the prompt to improve its quality (e.g. tone, target audience, specific frameworks). These options must be directly selectable.]\n* (a) [Option A]\n* (b) [Option B]\n* (c) [Option C]\n\n**Questions:**\n[Formulate exactly three numbered, open questions to close gaps in the prompt. Important: these questions must not overlap in content with the \"Possible additions\"!]\n1. [Question 1]\n2. [Question 2]\n3. [Question 3]\n\n**Next steps:**\n[Give me short, precise instructions on what I should do next (e.g. answer questions, choose options, or dictate changes directly).]\n\n---\n\n### Important behavioural rules for you:\n1. **No assumptions:** If information is missing, ask for it instead of guessing.\n2. **Consistency:** Keep this exact output format in EVERY iteration, until I say the prompt is finished.\n3. **Iterative integration:** When I reply to you (e.g. \"I choose (a), and for question 1 my answer is...\"), incorporate this information directly into the new prompt draft under \"Prompt:\" and generate new questions/additions for the next round of refinement.\n\n### Start trigger:\nBefore we start the process, greet me briefly and simply ask me which goal or topic the prompt we're developing today should have. Do not yet show any of the sections listed above (Prompt, Additions, Questions) in your very first reply."}},"p12":{"title":"Self-consistency prompting: comparing multiple solution paths","tags":["Multiple solution paths","Quality assurance"],"shortDef":"Asking the chatbot to work through the same task via several independent solution paths and then compare the results to pick the most likely or best one.","explain":"Instead of relying on a single chain of reasoning, the model develops several different approaches to the same question and then reconciles them. If several independent paths agree on the result, confidence in the answer increases; if they diverge, you can ask specifically which path seems most plausible.","usefulFor":"Tasks with a clearly correct or best solution where reliability especially matters — such as calculations, logic problems, or decisions with clear criteria.","useCases":["Cross-checking a cost calculation via two independent calculation paths","Backing up a decision between several options using different evaluation approaches","Verifying a logical conclusion through several independent chains of reasoning"],"example":"\"Solve this task via three independent approaches, without letting the first approach influence the others. Then compare the three results and tell me the most likely solution with reasoning.\"","strengths":["Increases reliability for tasks with a clear-cut solution","Makes uncertainty visible when the paths lead to different results"],"limitations":["Takes more time and text than a single solution path","Less helpful for creative or purely subjective tasks without one clearly \"right\" answer"],"mistakes":["Asking for only a single solution path and still expecting high certainty","Not actually requesting genuinely independent solution paths"],"providers":"Model-independent"},"p13":{"title":"Requesting visible step-by-step reasoning (chain-of-thought)","tags":["Reasoning","Traceability"],"shortDef":"Explicitly asking the chatbot to lay out its reasoning or solution path openly before reaching a final answer, instead of only delivering the finished result.","explain":"Many modern chatbots already display a visible \"thinking process\" or a summary of their reasoning by themselves (often called a reasoning or thinking mode). Independently of that, this behaviour can also be requested deliberately through the prompt, for instance with phrases like \"think step by step\" or \"explain your solution path first before answering\". This makes it possible to follow how an answer came about and often surfaces reasoning errors before the final answer is given.","usefulFor":"More complex tasks with several intermediate steps, where traceability and error detection matter.","useCases":["Following a multi-step calculation with a visible working","Having a line of argument laid out before the final recommendation, so you can check it yourself","Using the displayed reasoning summary of a reasoning-capable model specifically for your own review"],"example":"\"First think out loud, step by step, about which factors matter for this decision, and only then derive your recommendation.\"","strengths":["Makes intermediate steps and possible reasoning errors visible instead of just presenting a final result","Makes it easier to critically check an answer yourself"],"limitations":["Leads to longer answers and higher time or resource use","A visible reasoning process is not proof of correctness — it should be checked too"],"mistakes":["Accepting the displayed reasoning process unquestioningly as proof of a correct answer"],"providers":"Model-independent — many current chatbots natively display a reasoning or thinking mode","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"t1":{"title":"ChatGPT","tags":["Multimodal","Provider: OpenAI"],"shortDef":"Multimodal chatbot by OpenAI for text, image, data, and voice input/output — like Google Gemini, a very broad, creative all-rounder for everyday work.","explain":"In practice, ChatGPT and Google Gemini can almost be seen as siblings: both are extremely versatile, very creative for everyday use, and strikingly similar in feature scope and overall feel. Model status September 2026: the top model is GPT-6 Astra; most everyday chats run on GPT-5.6 Sol or GPT-5.6 Luna depending on the plan. Alongside image generation, data analysis, and custom GPTs, ChatGPT now also offers Sites (small websites built straight from the chat), Pages, Slides, and plugins (formerly \"apps\") for connecting other tools.","usefulFor":"Broad everyday tasks, from text drafts to research to simple data analysis.","useCases":["Drafting and revising texts","Having simple data tables analysed","Setting up custom GPTs for recurring tasks"],"example":"Structuring a slide-deck draft via chat and using it as a starting point for your own presentation.","strengths":["Broad feature set in one interface","Large user base and extensive documentation"],"limitations":["Like all chatbots, not error-free on facts and figures","Free and paid tiers differ in feature scope"],"providers":"OpenAI","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"t2":{"title":"Claude","tags":["Multimodal","Provider: Anthropic","Data analysis & maths"],"shortDef":"Multimodal chatbot by Anthropic focused on longer documents, file work, and an agent-like work mode called Cowork — currently regarded by many as one of the most capable language models available.","explain":"Anthropic trains Claude with particularly extensive ethical guardrails, and it tends to decline inappropriate or borderline requests faster than some other chatbots — an aspect many users see as an advantage. Another strength lies in data analysis, mathematics, and handling complex, multi-step tasks. Model status September 2026: Claude Opus 5.5, Sonnet 5.5, and Haiku 4.5, plus the new Mythos tier above them (generally available as Claude Fable 5.1). Its ecosystem includes Projects, Artifacts, Skills, Memory, connectors, and the Cowork work mode.","usefulFor":"Document-heavy tasks, longer analyses, creating interactive content.","useCases":["Summarising a long PDF and asking follow-up questions about it","Creating an interactive worksheet or overview directly in the chat","Bundling recurring context for a topic via Projects"],"example":"Merging a training concept from several template documents and outputting it as an editable document.","strengths":["Strong document and file work","Handles long context clearly"],"limitations":["Image generation less of a focus than with some competitors"],"providers":"Anthropic","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"t3":{"title":"Google Gemini","tags":["Multimodal","Provider: Google"],"shortDef":"Multimodal chatbot by Google with close integration into Google Workspace services such as Docs, Sheets, and Gmail — like ChatGPT, a very broad, creative all-rounder for everyday work.","explain":"In practice, Gemini and ChatGPT can almost be seen as siblings: both are extremely versatile, very creative for everyday use, and strikingly similar in feature scope and overall feel. Model status September 2026: Gemini 3.1 Pro remains the Pro model, Gemini 3.8 Flash is the current fast model, and Gemini 4 has been announced. Gemini is built directly into Google Docs, Sheets, and Gmail, offers its own Gems (assistants), the \"Nano Banana\" image models, and fluent voice conversation with Gemini Live.","usefulFor":"Teams and organisations already working with Google Workspace.","useCases":["Continuing a draft directly in Google Docs","Summarising or drafting emails in Gmail","Analysing tables in Google Sheets"],"example":"Summarising a meeting's minutes directly from a Google Doc.","strengths":["Seamless integration into Google applications","Good handling of very long documents"],"limitations":["Advantages mainly show within the Google ecosystem"],"providers":"Google","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"t4":{"title":"Microsoft Copilot","tags":["Multimodal","Provider: Microsoft"],"shortDef":"Multimodal assistant by Microsoft with close integration into Word, Excel, Outlook, Teams, and PowerPoint.","explain":"Copilot is designed for integration into the Microsoft 365 work environment and can assist directly within documents, spreadsheets, and emails there.","usefulFor":"Organisations that work predominantly with Microsoft 365.","useCases":["Drafting a slide deck directly in PowerPoint","Summarising a long email thread in Outlook","Suggesting formulas and analyses in Excel"],"example":"Turning bullet points in Word into a complete report draft.","strengths":["Deep integration into Microsoft 365 applications","Familiar interface for Microsoft users"],"limitations":["Feature scope is closely tied to the Microsoft 365 licence model"],"providers":"Microsoft","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"t5":{"title":"Perplexity","tags":["Research","Citations"],"shortDef":"Research-oriented chatbot that provides answers with directly traceable source citations.","explain":"Perplexity searches the web and cites its sources directly within the answer, improving traceability compared with classic chatbots.","usefulFor":"Fact-finding research where the source should be delivered alongside the answer.","useCases":["Researching current developments on a topic with citations","Comparing several sources on a question"],"example":"\"What recent studies exist on hybrid working? Please include sources.\"","strengths":["Good traceability through citations","Fast, up-to-date results via web search"],"limitations":["In-depth academic literature research is often stronger with specialist tools like Elicit or Consensus"],"providers":"Perplexity AI","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"t6":{"title":"NotebookLM","tags":["Own sources","Knowledge base"],"shortDef":"Google research tool that generates answers exclusively from documents you upload yourself.","explain":"Unlike a general-purpose chatbot, NotebookLM only refers to the sources you upload — with a direct reference to the relevant passage.","usefulFor":"Working with a clearly defined document collection, e.g. course materials or academic literature.","useCases":["Uploading several PDFs of a course and querying them together","Generating an automatic audio summary of your own sources"],"example":"Uploading all slide decks of a seminar and generating a summary of the key points.","strengths":["Answers stay traceable to your own sources","Reduces the risk of freely invented content"],"limitations":["Not very useful without your own sources, since general world knowledge isn't the focus"],"providers":"Google","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"t7":{"title":"Elicit","tags":["Academic literature"],"shortDef":"Research tool specialised in academic literature that finds relevant studies and extracts their key findings.","explain":"Elicit specialises in academic literature research and helps systematically screen large volumes of scholarly publications.","usefulFor":"Literature research in an academic context, e.g. for qualification theses.","useCases":["Identifying relevant studies for a research question","Comparing key findings across several studies"],"example":"Listing relevant studies from the past five years for a research question on postdoc career development.","strengths":["Saves time on extensive literature screening"],"limitations":["Doesn't replace a critical reading of the original papers"],"providers":"Elicit","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"t8":{"title":"Consensus","tags":["Academic literature","Evidence"],"shortDef":"Research tool that backs answers to questions with the degree of consensus or disagreement in the scientific literature on that topic.","explain":"Consensus shows how many studies support or contradict a claim, rather than citing just a single source.","usefulFor":"Quickly gauging how well-supported a scientific claim is.","useCases":["Checking how consistent the evidence is for a thesis","Getting a first overview before an in-depth literature search"],"example":"\"What does research say about the effectiveness of 360-degree feedback?\" with an overview of the evidence.","strengths":["Good initial sense of the evidence base"],"limitations":["Doesn't replace a systematic literature review for high academic standards"],"providers":"Consensus","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"t11":{"title":"Suno","tags":["Music generation"],"shortDef":"Tool for generating complete music tracks, including vocals, from a text description or lyrics.","explain":"Suno generates original music tracks based on mood and genre descriptions, suitable for opening or interval music at events.","usefulFor":"Individual music tracks for events or creative projects.","useCases":["Generating a short opening tune for an online event","Generating a mood piece for a workshop break"],"example":"Generating a 30-second, calm instrumental intro track for the start of an online seminar.","strengths":["Fast, individual music production without prior experience"],"limitations":["Licensing terms vary by plan — check before commercial use"],"providers":"Suno","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"t12":{"title":"Gamma","tags":["Presentations","Automatic"],"shortDef":"Tool for automatically creating presentations and documents from bullet points or a rough topic.","explain":"Gamma largely handles a slide deck's layout and structure automatically, making it well suited for quick first drafts.","usefulFor":"Quick first drafts of slide decks or documents, later refined in your own design.","useCases":["Generating a first slide-deck draft from a bullet list","Generating a rough outline for an internal document"],"example":"Automatically generating a first slide-deck draft from the key points of a workshop concept.","strengths":["Very fast first drafts","Low barrier to entry"],"limitations":["Layout usually doesn't match your own corporate design and needs adjusting"],"providers":"Gamma","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"t13":{"title":"GenSpark","tags":["Presentations","AI research"],"shortDef":"AI workspace that automatically creates researched, designed slide decks from a topic, bullet points, or an uploaded document.","explain":"GenSpark researches content in the background, proposes an outline, and turns it directly into a laid-out slide deck — including charts and matching images.","usefulFor":"Quick, research-based slide-deck drafts from keywords or existing documents.","useCases":["Automatically generating a first, researched slide deck from a course topic","Turning an existing PDF or Word document into a presentation","Generating slide decks within your own PowerPoint template"],"example":"Automatically generating a first slide deck with charts and sources from bullet points on a course topic.","strengths":["Handles research and layout in one pass","Can work directly with your own PowerPoint master template"],"limitations":["Narrative structure and layout often stay generic and need rework","Credit-based pricing requires checking costs upfront"],"providers":"GenSpark","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"t14":{"title":"STORM (Stanford)","tags":["Wikipedia-style","Open source"],"shortDef":"An open-source research tool developed at Stanford University that automatically creates a detailed, source-backed overview article on a topic, in the style of a Wikipedia entry.","explain":"STORM researches a topic from multiple perspectives, simulates follow-up questions between different viewpoints, and organises the findings into a coherent, referenced article.","usefulFor":"A quick, broad entry point into an unfamiliar subject area with traceable citations.","useCases":["Generating an overview article on a new research field","Creating a structured basis for an internal wiki","Getting up to speed quickly on an unfamiliar subject before a consulting assignment"],"example":"Generating a structured overview article on the state of research on \"leading without formal authority\", including outline and citations.","strengths":["Free and open-source","Covers a topic more broadly than a single search query, thanks to multi-perspective research"],"limitations":["Doesn't reach the quality of carefully edited human articles","Can be skewed by one-sided source selection"],"providers":"Stanford University (open source)","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"t15":{"title":"DeepSeek","tags":["Open source","Low cost"],"shortDef":"Multimodal chatbot by the Chinese provider DeepSeek, known for strong performance on reasoning and coding tasks at comparatively low cost.","explain":"DeepSeek publishes its models openly, allowing independent scrutiny and, in some cases, local use, and significantly lowering costs compared with many Western providers.","usefulFor":"A cost-effective alternative for text, reasoning, and coding tasks.","useCases":["Drafting and debugging program code","Working through logical problems step by step"],"example":"Drafting a more complex spreadsheet formula and having it explained step by step.","strengths":["Very low-cost use, sometimes free","Open model weights allow independent or local use"],"limitations":["As a Chinese provider, it operates under different regulatory frameworks, which can show up on politically sensitive topics","Check data processing and storage before business use"],"providers":"DeepSeek","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"t16":{"title":"Lumo (Proton)","tags":["Privacy","Europe"],"shortDef":"Privacy-focused chatbot by the European provider Proton that encrypts conversations end to end, doesn't log them, and doesn't use them to train models.","explain":"Lumo forgoes server-side conversation logs and an ad-funded business model — a clear difference from many market-leading chatbots.","usefulFor":"Tasks involving particularly sensitive or confidential content.","useCases":["Summarising confidential notes under stricter privacy requirements","Using a privacy-friendly alternative for everyday chat tasks"],"example":"Summarising a sensitive internal note without the content being logged server-side.","strengths":["Strong privacy focus with end-to-end encryption","European provider based in Switzerland, bound by European law"],"limitations":["Feature scope and model selection aren't yet at the level of the largest providers"],"providers":"Proton AG","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"t17":{"title":"Vibe (Mistral, formerly Le Chat)","tags":["Europe","Agent mode","European languages"],"shortDef":"Multimodal chatbot and work agent by the French provider Mistral AI, known as \"Le Chat\" until May 2026 — one of the strongest European alternatives to US chatbots, with particular attention to a European perspective and European languages.","explain":"Vibe combines a classic chat assistant with an agent mode for multi-step work and coding tasks. As a European provider, Mistral AI places particular emphasis on European languages and a European perspective, and can also offer businesses data residency within the EU.","usefulFor":"Everyday chat tasks as well as multi-step work and coding tasks with a European provider background.","useCases":["Handling everyday text tasks with a European provider","Automating multi-step research tasks via connected tools","Handling coding tasks through the built-in coding agent"],"example":"Running multi-step research on a funding topic and having the results summarised directly as a short briefing.","strengths":["European provider with an option for EU data residency","Combines chat, research, and a coding agent in one product"],"limitations":["The recent rename from \"Le Chat\" to \"Vibe\" can cause temporary confusion","Smaller ecosystem of add-on integrations than the largest US providers"],"providers":"Mistral AI","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"t9":{"title":"Midjourney","tags":["Image generation","High quality"],"shortDef":"Specialised tool for generating high-quality, artistically refined images from text descriptions — still the benchmark for artistic image quality for many professionals.","explain":"Midjourney is considered especially strong at atmospheric, artistic-looking images. Originally usable only via the Discord chat service, there is now also a standalone website, though account setup still requires linking a Discord or Google account.","usefulFor":"High-quality illustrations for presentations, title images, or concept visuals.","useCases":["Designing a title image for a presentation","Trying out different image styles for a corporate design concept"],"example":"Generating a stylised title image on \"leading without formal authority\" for a slide.","strengths":["High design quality","Wide stylistic range"],"limitations":["Getting started may still involve a detour through the Discord sign-up, even though image generation itself is now possible via a regular website","Copyright and usage questions should be checked before commercial use","Precise text rendering in images remains error-prone"],"providers":"Midjourney Inc.","note":"Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."},"t10":{"titl
