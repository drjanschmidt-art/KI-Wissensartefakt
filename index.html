 we start the process, greet me briefly and simply ask me which goal or topic the prompt we're developing today should have. Do not yet show any of the sections listed above (Prompt, Additions, Questions) in your very first reply."}}, "p12": {"title": "Self-consistency prompting: comparing multiple solution paths", "tags": ["Multiple solution paths", "Quality assurance"], "shortDef": "Asking the chatbot to work through the same task via several independent solution paths and then compare the results to pick the most likely or best one.", "explain": "Instead of relying on a single chain of reasoning, the model develops several different approaches to the same question and then reconciles them. If several independent paths agree on the result, confidence in the answer increases; if they diverge, you can ask specifically which path seems most plausible.", "usefulFor": "Tasks with a clearly correct or best solution where reliability especially matters — such as calculations, logic problems, or decisions with clear criteria.", "useCases": ["Cross-checking a cost calculation via two independent calculation paths", "Backing up a decision between several options using different evaluation approaches", "Verifying a logical conclusion through several independent chains of reasoning"], "example": "\"Solve this task via three independent approaches, without letting the first approach influence the others. Then compare the three results and tell me the most likely solution with reasoning.\"", "strengths": ["Increases reliability for tasks with a clear-cut solution", "Makes uncertainty visible when the paths lead to different results"], "limitations": ["Takes more time and text than a single solution path", "Less helpful for creative or purely subjective tasks without one clearly \"right\" answer"], "mistakes": ["Asking for only a single solution path and still expecting high certainty", "Not actually requesting genuinely independent solution paths"], "providers": "Model-independent"}, "p13": {"title": "Requesting visible step-by-step reasoning (chain-of-thought)", "tags": ["Reasoning", "Traceability"], "shortDef": "Explicitly asking the chatbot to lay out its reasoning or solution path openly before reaching a final answer, instead of only delivering the finished result.", "explain": "Many modern chatbots already display a visible \"thinking process\" or a summary of their reasoning by themselves (often called a reasoning or thinking mode). Independently of that, this behaviour can also be requested deliberately through the prompt, for instance with phrases like \"think step by step\" or \"explain your solution path first before answering\". This makes it possible to follow how an answer came about and often surfaces reasoning errors before the final answer is given.", "usefulFor": "More complex tasks with several intermediate steps, where traceability and error detection matter.", "useCases": ["Following a multi-step calculation with a visible working", "Having a line of argument laid out before the final recommendation, so you can check it yourself", "Using the displayed reasoning summary of a reasoning-capable model specifically for your own review"], "example": "\"First think out loud, step by step, about which factors matter for this decision, and only then derive your recommendation.\"", "strengths": ["Makes intermediate steps and possible reasoning errors visible instead of just presenting a final result", "Makes it easier to critically check an answer yourself"], "limitations": ["Leads to longer answers and higher time or resource use", "A visible reasoning process is not proof of correctness — it should be checked too"], "mistakes": ["Accepting the displayed reasoning process unquestioningly as proof of a correct answer"], "providers": "Model-independent — many current chatbots natively display a reasoning or thinking mode", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "t1": {"title": "ChatGPT", "tags": ["Multimodal", "Provider: OpenAI"], "shortDef": "Multimodal chatbot by OpenAI for text, image, data, and voice input/output — like Google Gemini, a very broad, creative all-rounder for everyday work.", "explain": "In practice, ChatGPT and Google Gemini can almost be seen as siblings: both are extremely versatile, very creative for everyday use, and strikingly similar in feature scope and overall feel. Since October 2026, ChatGPT has been running on the GPT-6 family (current model names: see the \"Model status\" entry). New is Intelligent UI: where useful, ChatGPT builds answers as an interactive interface with buttons, charts, calculators, or checklists directly in the chat. There are also Sites (small websites built from the chat), Pages, Slides, Projects, plugins for connecting other tools, and in the desktop app the areas Chat, Work (multi-step tasks), and Codex. The previous custom GPTs will be retired in December 2026 and replaced by plugins.", "usefulFor": "Broad everyday tasks, from text drafts to research to simple data analysis.", "useCases": ["Drafting and revising texts", "Having simple data tables analysed", "Requesting an explanation as an interactive answer (Intelligent UI), e.g. as a calculator or chart", "Bundling recurring context in a project"], "example": "Structuring a slide-deck draft via chat and using it as a starting point for your own presentation.", "strengths": ["Broad feature set in one interface", "Large user base and extensive documentation"], "limitations": ["Like all chatbots, not error-free on facts and figures", "Free and paid tiers differ in feature scope", "Custom GPTs stop working in December 2026 — save their content in time"], "providers": "OpenAI", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "t2": {"title": "Claude", "tags": ["Multimodal", "Provider: Anthropic", "Data analysis & maths"], "shortDef": "Multimodal chatbot by Anthropic focused on longer documents, file work, and an agent-like work mode called Cowork — currently regarded by many as one of the most capable language models available.", "explain": "Anthropic trains Claude with particularly extensive ethical guardrails, and it tends to decline inappropriate or borderline requests faster than some other chatbots — an aspect many users see as an advantage. Another strength lies in data analysis, mathematics, and handling complex, multi-step tasks. Its ecosystem includes Projects, Artifacts, Skills, Memory, connectors, scheduled tasks, and the Cowork work mode (current model names: see the \"Model status\" entry). A distinctive feature is the approach of bringing applications into the AI: documents, spreadsheets, presentations, and small tools are created directly in Claude as artifacts and can be shared via a link.", "usefulFor": "Document-heavy tasks, longer analyses, creating interactive content.", "useCases": ["Summarising a long PDF and asking follow-up questions about it", "Creating an interactive worksheet or overview directly in the chat", "Bundling recurring context for a topic via Projects", "Having short animated explainer sequences (motion graphics) built as an HTML artifact that plays automatically — see the template \"Motion graphics as an HTML animation\""], "example": "Merging a training concept from several template documents and outputting it as an editable document.", "strengths": ["Strong document and file work", "Handles long context clearly", "Can also create animated graphics (motion graphics) via artifacts, without video-editing software"], "limitations": ["Image generation less of a focus than with some competitors"], "providers": "Anthropic", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "t3": {"title": "Google Gemini", "tags": ["Multimodal", "Provider: Google"], "shortDef": "Multimodal chatbot by Google with close integration into Google Workspace services such as Docs, Sheets, and Gmail — like ChatGPT, a very broad, creative all-rounder for everyday work.", "explain": "In practice, Gemini and ChatGPT can almost be seen as siblings: both are extremely versatile, very creative for everyday use, and strikingly similar in feature scope and overall feel (current model names: see the \"Model status\" entry). Gemini is built directly into Google Docs, Sheets, and Gmail, offers the \"Nano Banana\" image models, fluent voice conversation with Gemini Live, and Canvas as a workspace for texts and small web pages. The previous Gems are being converted into skills automatically from 17 November 2026; skills currently require a paid Google AI subscription.", "usefulFor": "Teams and organisations already working with Google Workspace.", "useCases": ["Continuing a draft directly in Google Docs", "Summarising or drafting emails in Gmail", "Analysing tables in Google Sheets", "Storing recurring working instructions as a skill (formerly a Gem)"], "example": "Summarising a meeting's minutes directly from a Google Doc.", "strengths": ["Seamless integration into Google applications", "Good handling of very long documents"], "limitations": ["Advantages mainly show within the Google ecosystem", "Skills (successor to the free Gems) currently require a paid subscription"], "providers": "Google", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "t4": {"title": "Microsoft Copilot", "tags": ["Multimodal", "Provider: Microsoft"], "shortDef": "Microsoft's assistant that brings AI into existing Office applications — Word, Excel, Outlook, Teams, and PowerPoint — and is increasingly becoming a work surface with its own agent mode (Cowork).", "explain": "Copilot stands for one of two opposing movements: AI moves into the existing applications instead of you switching to a chatbot to work. The opposite movement can be seen in Claude artifacts, where documents, spreadsheets, and presentations are created directly inside the AI. Since autumn 2026, Copilot has expanded considerably: in the Copilot app, Chat and Cowork (multi-step tasks) sit on one home screen, automations can be managed there, and skills can be called up in the Office programs via \"@\". Many features arrive first in the \"Frontier\" early-access programme and depend on the licence model; some agent features are billed by usage.", "usefulFor": "Organisations that work predominantly with Microsoft 365 and want to use AI where their documents already live.", "useCases": ["Drafting a slide deck directly in PowerPoint", "Summarising a long email thread in Outlook", "Suggesting formulas and analyses in Excel", "Having a multi-step task done via Cowork in the Copilot app"], "example": "Turning bullet points in Word into a complete report draft.", "strengths": ["Deep integration into Microsoft 365 applications", "Familiar interface for Microsoft users", "Works where documents and emails already live"], "limitations": ["Feature scope is closely tied to the Microsoft 365 licence model", "New features roll out in stages — what is shown in a workshop is often not yet enabled in your own organisation", "Some agent features are billed by usage"], "providers": "Microsoft", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "t5": {"title": "Perplexity", "tags": ["Research", "Citations"], "shortDef": "Research-oriented chatbot that provides answers with directly traceable source citations.", "explain": "Perplexity searches the web and cites its sources directly within the answer, improving traceability compared with classic chatbots.", "usefulFor": "Fact-finding research where the source should be delivered alongside the answer.", "useCases": ["Researching current developments on a topic with citations", "Comparing several sources on a question"], "example": "\"What recent studies exist on hybrid working? Please include sources.\"", "strengths": ["Good traceability through citations", "Fast, up-to-date results via web search"], "limitations": ["In-depth academic literature research is often stronger with specialist tools like Elicit or Consensus"], "providers": "Perplexity AI", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "t6": {"title": "NotebookLM", "tags": ["Own sources", "Knowledge base"], "shortDef": "Google tool that works exclusively with sources you upload yourself — for research, but also as a creative chatbot for creating material, e.g. for teaching and workshops.", "explain": "Unlike a general-purpose chatbot, NotebookLM only refers to the sources you upload — with a direct reference to the relevant passage. From these sources it generates materials at the push of a button: summaries, flashcards, quizzes, mind maps, podcasts, and video overviews. A notebook is also a project with a knowledge base and can be shared with others — for sharing and collaboration, NotebookLM currently has the widest reach.", "usefulFor": "Working with a clearly defined document collection, e.g. course materials or academic literature, and creating learning material from it.", "useCases": ["Uploading several PDFs of a course and querying them together", "Generating flashcards, a quiz, or a mind map from teaching material", "Generating an audio or video overview of your own sources", "Sharing a notebook with colleagues or participants"], "example": "Uploading all slide decks of a seminar and generating a summary of the key points.", "strengths": ["Answers stay traceable to your own sources", "Reduces the risk of freely invented content", "Very versatile for creating material", "Easy to share, including with people without their own subscription"], "limitations": ["Not very useful without your own sources, since general world knowledge isn't the focus"], "providers": "Google", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "t7": {"title": "Elicit", "tags": ["Academic literature"], "shortDef": "Research tool specialised in academic literature that finds relevant studies and extracts their key findings.", "explain": "Elicit specialises in academic literature research and helps systematically screen large volumes of scholarly publications.", "usefulFor": "Literature research in an academic context, e.g. for qualification theses.", "useCases": ["Identifying relevant studies for a research question", "Comparing key findings across several studies"], "example": "Listing relevant studies from the past five years for a research question on postdoc career development.", "strengths": ["Saves time on extensive literature screening"], "limitations": ["Doesn't replace a critical reading of the original papers"], "providers": "Elicit", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "t8": {"title": "Consensus", "tags": ["Academic literature", "Evidence"], "shortDef": "Research tool that backs answers to questions with the degree of consensus or disagreement in the scientific literature on that topic.", "explain": "Consensus shows how many studies support or contradict a claim, rather than citing just a single source.", "usefulFor": "Quickly gauging how well-supported a scientific claim is.", "useCases": ["Checking how consistent the evidence is for a thesis", "Getting a first overview before an in-depth literature search"], "example": "\"What does research say about the effectiveness of 360-degree feedback?\" with an overview of the evidence.", "strengths": ["Good initial sense of the evidence base"], "limitations": ["Doesn't replace a systematic literature review for high academic standards"], "providers": "Consensus", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "t11": {"title": "Suno", "tags": ["Music generation"], "shortDef": "Tool for generating complete music tracks, including vocals, from a text description or lyrics.", "explain": "Suno generates original music tracks based on mood and genre descriptions, suitable for opening or interval music at events.", "usefulFor": "Individual music tracks for events or creative projects.", "useCases": ["Generating a short opening tune for an online event", "Generating a mood piece for a workshop break"], "example": "Generating a 30-second, calm instrumental intro track for the start of an online seminar.", "strengths": ["Fast, individual music production without prior experience"], "limitations": ["Licensing terms vary by plan — check before commercial use"], "providers": "Suno", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "t12": {"title": "Gamma", "tags": ["Presentations", "Automatic"], "shortDef": "Tool for automatically creating presentations and documents from bullet points or a rough topic.", "explain": "Gamma largely handles a slide deck's layout and structure automatically, making it well suited for quick first drafts.", "usefulFor": "Quick first drafts of slide decks or documents, later refined in your own design.", "useCases": ["Generating a first slide-deck draft from a bullet list", "Generating a rough outline for an internal document"], "example": "Automatically generating a first slide-deck draft from the key points of a workshop concept.", "strengths": ["Very fast first drafts", "Low barrier to entry"], "limitations": ["Layout usually doesn't match your own corporate design and needs adjusting"], "providers": "Gamma", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "t13": {"title": "GenSpark", "tags": ["Presentations", "AI research"], "shortDef": "AI workspace that automatically creates researched, designed slide decks from a topic, bullet points, or an uploaded document.", "explain": "GenSpark researches content in the background, proposes an outline, and turns it directly into a laid-out slide deck — including charts and matching images.", "usefulFor": "Quick, research-based slide-deck drafts from keywords or existing documents.", "useCases": ["Automatically generating a first, researched slide deck from a course topic", "Turning an existing PDF or Word document into a presentation", "Generating slide decks within your own PowerPoint template"], "example": "Automatically generating a first slide deck with charts and sources from bullet points on a course topic.", "strengths": ["Handles research and layout in one pass", "Can work directly with your own PowerPoint master template"], "limitations": ["Narrative structure and layout often stay generic and need rework", "Credit-based pricing requires checking costs upfront"], "providers": "GenSpark", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "t14": {"title": "STORM (Stanford)", "tags": ["Wikipedia-style", "Open source"], "shortDef": "An open-source research tool developed at Stanford University that automatically creates a detailed, source-backed overview article on a topic, in the style of a Wikipedia entry.", "explain": "STORM researches a topic from multiple perspectives, simulates follow-up questions between different viewpoints, and organises the findings into a coherent, referenced article.", "usefulFor": "A quick, broad entry point into an unfamiliar subject area with traceable citations.", "useCases": ["Generating an overview article on a new research field", "Creating a structured basis for an internal wiki", "Getting up to speed quickly on an unfamiliar subject before a consulting assignment"], "example": "Generating a structured overview article on the state of research on \"leading without formal authority\", including outline and citations.", "strengths": ["Free and open-source", "Covers a topic more broadly than a single search query, thanks to multi-perspective research"], "limitations": ["Doesn't reach the quality of carefully edited human articles", "Can be skewed by one-sided source selection"], "providers": "Stanford University (open source)", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "t15": {"title": "DeepSeek", "tags": ["Open source", "Low cost"], "shortDef": "Multimodal chatbot by the Chinese provider DeepSeek, known for strong performance on reasoning and coding tasks at comparatively low cost.", "explain": "DeepSeek publishes its models openly, allowing independent scrutiny and, in some cases, local use, and significantly lowering costs compared with many Western providers.", "usefulFor": "A cost-effective alternative for text, reasoning, and coding tasks.", "useCases": ["Drafting and debugging program code", "Working through logical problems step by step"], "example": "Drafting a more complex spreadsheet formula and having it explained step by step.", "strengths": ["Very low-cost use, sometimes free", "Open model weights allow independent or local use"], "limitations": ["As a Chinese provider, it operates under different regulatory frameworks, which can show up on politically sensitive topics", "Check data processing and storage before business use"], "providers": "DeepSeek", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "t16": {"title": "Lumo (Proton)", "tags": ["Privacy", "Europe"], "shortDef": "Privacy-focused chatbot by the European provider Proton that encrypts conversations end to end, doesn't log them, and doesn't use them to train models.", "explain": "Lumo forgoes server-side conversation logs and an ad-funded business model — a clear difference from many market-leading chatbots.", "usefulFor": "Tasks involving particularly sensitive or confidential content.", "useCases": ["Summarising confidential notes under stricter privacy requirements", "Using a privacy-friendly alternative for everyday chat tasks"], "example": "Summarising a sensitive internal note without the content being logged server-side.", "strengths": ["Strong privacy focus with end-to-end encryption", "European provider based in Switzerland, bound by European law"], "limitations": ["Feature scope and model selection aren't yet at the level of the largest providers"], "providers": "Proton AG", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "t17": {"title": "Vibe (Mistral, formerly Le Chat)", "tags": ["Europe", "Agent mode", "European languages"], "shortDef": "Multimodal chatbot and work agent by the French provider Mistral AI, known as \"Le Chat\" until May 2026 — one of the strongest European alternatives to US chatbots, with particular attention to a European perspective and European languages.", "explain": "Vibe combines a classic chat assistant with an agent mode for multi-step work and coding tasks. Projects with a knowledge base and instructions, plus reusable skills (in the open skill format), make Vibe useful for recurring tasks and for sharing within a team. As a European provider, Mistral AI places particular emphasis on European languages and a European perspective, and can also offer businesses data residency within the EU.", "usefulFor": "Everyday chat tasks as well as multi-step work and coding tasks with a European provider background.", "useCases": ["Handling everyday text tasks with a European provider", "Setting up a project with a knowledge base and instructions for a recurring topic", "Automating multi-step research tasks via connected tools", "Handling coding tasks through the built-in coding agent"], "example": "Running multi-step research on a funding topic and having the results summarised directly as a short briefing.", "strengths": ["European provider with an option for EU data residency", "Combines chat, projects, skills, research, and a coding agent in one product"], "limitations": ["The recent rename from \"Le Chat\" to \"Vibe\" can cause temporary confusion", "Smaller ecosystem of add-on integrations than the largest US providers"], "providers": "Mistral AI", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "t9": {"title": "Midjourney", "tags": ["Image generation", "High quality"], "shortDef": "Specialised tool for generating high-quality, artistically refined images from text descriptions — still the benchmark for artistic image quality for many professionals.", "explain": "Midjourney is considered especially strong at atmospheric, artistic-looking images. Originally usable only via the Discord chat service, there is now also a standalone website, though account setup still requires linking a Discord or Google account.", "usefulFor": "High-quality illustrations for presentations, title images, or concept visuals.", "useCases": ["Designing a title image for a presentation", "Trying out different image styles for a corporate design concept"], "example": "Generating a stylised title image on \"leading without formal authority\" for a slide.", "strengths": ["High design quality", "Wide stylistic range"], "limitations": ["Getting started may still involve a detour through the Discord sign-up, even though image generation itself is now possible via a regular website", "Copyright and usage questions should be checked before commercial use", "Precise text rendering in images remains error-prone"], "providers": "Midjourney Inc.", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "t10": {"title": "Image generation in multimodal chatbots", "tags": ["Built-in", "Fast"], "shortDef": "Many multimodal chatbots such as ChatGPT, Gemini, or Copilot offer image generation directly in the chat, without a separate tool.", "explain": "This built-in image generation is usually faster to use than a specialist tool, but often less finely controllable than dedicated image generators.", "usefulFor": "Quick, simple visuals directly within an ongoing chat.", "useCases": ["Generating a simple icon or symbol image directly in the chat", "Testing a rough image idea before using a specialist tool"], "example": "Generating a matching title image directly in the same chat where a slide-deck text is being drafted.", "strengths": ["No need to switch tools", "Good starting point for initial image ideas"], "limitations": ["Fine control is usually lower than with specialist tools like Midjourney"], "providers": "e.g. OpenAI, Google, Microsoft", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "m1": {"title": "Image generation in ChatGPT (\"Imagine\")", "tags": ["Built-in", "OpenAI"], "shortDef": "The image feature built into ChatGPT — often simply called \"Imagine\" or \"Images\" by users — creates and edits images directly in the chat, including precise text rendering.", "explain": "Newer versions of this feature (as of November 2026: ChatGPT Images 2.6) follow image instructions more accurately, keep details like faces, clothing, and lighting more consistent during edits, and generate images considerably faster than earlier models.", "usefulFor": "Quick image ideas, illustrations, and targeted image edits directly within an ongoing chat.", "useCases": ["Generating a title image directly in the chat where a text is being drafted", "Making targeted changes to an uploaded photo, e.g. adjusting the background or colours", "Adding legible, multilingual text to an existing graphic"], "example": "Generating a matching title image with correctly rendered lettering directly in the same chat where a slide-deck text is being drafted.", "strengths": ["No need to switch tools", "Increasingly precise text rendering in multiple languages", "Edits change only what's requested"], "limitations": ["Results for complex compositions should be checked", "Check usage rights per plan beforehand"], "providers": "OpenAI", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "m2": {"title": "Nano Banana (Gemini)", "tags": ["Google", "Image editing"], "shortDef": "Google's native image generation and editing models within Gemini — informally called \"Nano Banana\" — known for precise text rendering and targeted, conversational image editing.", "explain": "The models draw on Gemini's world knowledge to reliably render things like infographics, diagrams from handwritten notes, or multilingual captions, and can be refined further through follow-up chat instructions.", "usefulFor": "Precise illustrations, infographics, and targeted image edits involving text elements.", "useCases": ["Turning handwritten notes into a clean, labelled diagram", "Making targeted changes to an existing image, e.g. swapping the background or lighting", "Generating an infographic with correctly rendered, multilingual text"], "example": "Turning a photo of a handwritten flip chart into a clean, labelled diagram for a slide.", "strengths": ["Very precise text rendering in multiple languages", "Well suited to infographics, diagrams, and data-driven visuals"], "limitations": ["Very complex compositions still need a content check, since world knowledge can be misapplied too", "Images carry an invisible SynthID watermark as proof of AI origin"], "providers": "Google DeepMind", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "m3": {"title": "Imagine.art", "tags": ["Image & video", "Creative suite"], "shortDef": "Creative suite for image and video generation with access to several models, avatar creation, background removal, and a node-based workflow builder.", "explain": "Imagine.art is a standalone product by the provider Vyro — it is not the same as, and not the successor to, Leonardo.ai, even though the two names are sometimes confused. Its strength lies in bundling several image and video models, plus voice and music generation, under one interface.", "usefulFor": "Teams that want to bundle image and video generation, plus simple post-processing, in a single subscription.", "useCases": ["Turning a photo into a short animated video", "Comparing several image models for the same image idea", "Assembling a concept storyboard from text and image building blocks"], "example": "Generating a still image for a campaign and then turning it into a short social-media video within the same tool.", "strengths": ["Bundles several image and video models in one interface", "Node-based workflow builder for recurring production steps"], "limitations": ["The large model selection can initially feel overwhelming for beginners", "Usage rights vary by plan and underlying third-party model"], "providers": "Vyro LLC", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "m4": {"title": "Magnific (formerly Freepik)", "tags": ["Upscaling", "Image quality"], "shortDef": "AI tool for increasing image resolution and detail (upscaling), enlarging existing images to a multiple of their original resolution while adding texture.", "explain": "The well-known image upscaler Magnific is now part of the renamed platform Magnific (formerly Freepik) and offers a faithful mode for photos as well as a creative mode that plausibly adds missing detail.", "usefulFor": "Upgrading low-resolution or AI-generated images for print, large displays, or professional reuse.", "useCases": ["Upscaling an AI-generated image for printing as a poster", "Restoring an old, blurry photo at a higher resolution", "Enlarging product photos for an online shop while keeping consistent quality"], "example": "Upscaling a title image created with an image generator to a high resolution before printing it as a poster.", "strengths": ["Noticeable detail gains even at strong magnification", "Separate modes for faithful and creative enhancement"], "limitations": ["Very aggressive settings can produce unnatural-looking detail", "Always double-check the result before professional use"], "providers": "Magnific (formerly Freepik)", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "m5": {"title": "Renderforest", "tags": ["Video templates", "Explainer videos"], "shortDef": "Platform for creating videos, logos, and simple websites that turns text or image input into finished clips using several AI video models and a large template library.", "explain": "Renderforest combines a classic, template-based video editor with AI features such as text-to-video, image-to-video animation, and automatic voiceovers in more than 50 languages.", "usefulFor": "Explainer videos, course intros, and social-media clips without classic video production.", "useCases": ["Automatically generating an explainer video with voiceover from a script", "Turning a still image into a short, animated intro for an online event", "Assembling an existing presentation video from a template"], "example": "Automatically generating a short explainer video with voiceover from the key points of a course concept, for the course announcement.", "strengths": ["Very large template library", "Automatic, multilingual voiceover generation"], "limitations": ["Free use is limited to short, watermarked videos", "Check subscription prices for higher resolutions and longer videos beforehand", "Many video platforms put up paywalls early (watermarks, short duration, credits) and become cluttered as features grow — for simple explainer sequences, motion graphics as an HTML animation are often the faster alternative"], "providers": "Renderforest", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "m6": {"title": "invideo.io", "tags": ["Text-to-video", "Script-based"], "shortDef": "AI video platform that automatically assembles a complete video with scenes, voiceover, and music from a text description, script, or topic.", "explain": "invideo.io is designed for a simple, script-based entry point: a short description produces a rough cut, which can then be refined in the built-in editor.", "usefulFor": "Quick first video drafts from a topic description, without any of your own footage.", "useCases": ["Automatically generating a first video draft from a topic description", "Turning an existing script into a video with matching scenes and voiceover", "Generating short videos in the right aspect ratio for different platforms"], "example": "Automatically generating a first video draft with voiceover from a short topic description for a course offering.", "strengths": ["Simple, script-based entry point even without prior experience", "Good starting point for quick social-media formats"], "limitations": ["Polish and brand consistency usually require rework in the editor", "Check usage limits per subscription tier beforehand", "Many video platforms put up paywalls early (watermarks, short duration, credits) and become cluttered as features grow — for simple explainer sequences, motion graphics as an HTML animation are often the faster alternative"], "providers": "invideo Inc.", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "f1": {"title": "Text and writing", "tags": ["Drafting", "Revising"], "shortDef": "The core function of every chatbot: drafting, rewording, shortening, and adjusting texts in tone and style.", "explain": "This function differs from \"normal chat\" only in degree — it refers to deliberately using the chat for text products such as emails, reports, or concepts.", "usefulFor": "Everyday writing tasks of all kinds.", "useCases": ["Drafting an email in a specific tone", "Cutting a long text in half", "Translating a technical text for an audience without prior knowledge"], "example": "Turning an internal status report into a short, generally understandable summary for the leadership level.", "strengths": ["Very broadly applicable", "Available immediately without any add-on feature"], "limitations": ["Results should always be checked for factual accuracy"], "providers": "All major multimodal chatbots"}, "f2": {"title": "Analysing documents and PDFs", "tags": ["PDF", "Summary"], "shortDef": "Having uploaded documents read, summarised, and queried in a targeted way, instead of reading them yourself in full.", "explain": "This function differs from normal chat in that the chatbot draws on the actual content of an uploaded file, rather than only general knowledge.", "usefulFor": "Long reports, studies, or contracts from which specific information needs to be extracted.", "useCases": ["Having a long PDF summarised in a few sentences", "Asking specifically about a particular clause in a contract", "Comparing several documents for contradictions"], "example": "Uploading a 40-page Erasmus+ handbook and asking specifically about the rules on mobility grants.", "strengths": ["Saves considerable reading time on long documents"], "limitations": ["Context can get lost with very long or unstructured documents — spot-checking is advisable"], "providers": "All major multimodal chatbots"}, "f3": {"title": "Analysing tables and data", "tags": ["Excel", "Analysis"], "shortDef": "Having uploaded tables analysed, patterns identified, and charts or formulas suggested.", "explain": "Some chatbots can run code in the background for this, delivering more reliable calculations than a purely text-based explanation.", "usefulFor": "Initial analyses and plausibility checks on manageable amounts of data.", "useCases": ["Analysing a participant list by course location", "Summarising a simple cost overview", "Generating a chart from an uploaded table"], "example": "Grouping an uploaded invoice overview by location and month and displaying it as a chart.", "strengths": ["Quick initial analyses without doing your own formula work"], "limitations": ["For sensitive or very large datasets, checking the calculations and the privacy aspects is advisable"], "providers": "All major multimodal chatbots"}, "f4": {"title": "Understanding images", "tags": ["Image analysis"], "shortDef": "Describing an uploaded image, recognising its contents, or extracting text from it.", "explain": "This function lets you discuss photos, screenshots, or diagrams directly in the chat, for instance to explain content or extract text.", "usefulFor": "Quick analysis of screenshots, photos, or scanned documents.", "useCases": ["Extracting text from a photo of a flip chart", "Explaining a chart from a presentation", "Interpreting a screenshot of an error message"], "example": "Uploading a photo of a handwritten flip-chart result and turning it into structured text.", "strengths": ["Practical for quickly digitising analogue results"], "limitations": ["Handwriting and blurry images can cause errors"], "providers": "All major multimodal chatbots"}, "f5": {"title": "Creating and editing images", "tags": ["Image generation"], "shortDef": "Generating images directly in the chat from a description, or making targeted changes to an uploaded image.", "explain": "Unlike normal chat, the result here is visual rather than textual — useful for quick illustrations without a separate graphics program.", "usefulFor": "Quick visuals, title images, or illustrations without graphic-design skills.", "useCases": ["Generating a title image for a presentation", "Regenerating an existing image in a different style", "Creating a simple icon set for a slide"], "example": "Generating a neutral symbol image on \"resource prioritisation\" for a strategy-retreat slide.", "strengths": ["No separate graphics program needed"], "limitations": ["Precise text rendering in images remains error-prone", "Check usage rights per provider and plan"], "providers": "e.g. OpenAI, Google, Anthropic (availability varies by platform)", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "f6": {"title": "Speech and audio", "tags": ["Voice input/output"], "shortDef": "Converting spoken language into text, or having text read aloud — for hands-free use or accessibility.", "explain": "This function is especially useful on the go or when longer answers should be listened to rather than read.", "usefulFor": "Hands-free use, accessible use, listening to longer summaries.", "useCases": ["Entering an idea by voice while on the go", "Having a long answer read aloud", "Generating a transcript from a voice recording"], "example": "Dictating an idea for a workshop concept by voice while driving and refining it as text later.", "strengths": ["Practical on the go and for accessibility"], "limitations": ["Recognition accuracy can vary with technical terms or dialects"], "providers": "All major multimodal chatbots (app feature)", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "f7": {"title": "Music and video", "tags": ["Video generation"], "shortDef": "Generating short video clips or music tracks directly from a text description.", "explain": "This function is still more actively evolving technically than text or image functions and, so far, mostly delivers short, simple results. A practical alternative for explainer sequences: have the chatbot build an animated HTML page (motion graphics) — e.g. a prompt developed with Claude that then also works in Gemini or ChatGPT.", "usefulFor": "Short explainer or mood videos, individual music underlays.", "useCases": ["Generating a short explainer clip for a simple concept", "Generating an individual tune for an event"], "example": "Generating a few-second, atmospheric video clip as the opening for an online session.", "strengths": ["Enables creative experiments without video-editing skills"], "limitations": ["Quality and length still limited so far — check usage rights beforehand", "Specialised video platforms become paid early on"], "providers": "e.g. Google, OpenAI (availability varies by platform)", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "f8": {"title": "Web search", "tags": ["Currency"], "shortDef": "The chatbot retrieves current information from the web instead of relying only on trained knowledge with a fixed cutoff date.", "explain": "This function matters for anything that may have changed since the model's training cutoff — for instance current events, people in office, or product versions.", "usefulFor": "Current events, changing facts, day-to-day information.", "useCases": ["Looking up current funding guidelines", "Researching the current state of a legal change", "Getting current news on a topic"], "example": "Researching the current state of Erasmus+ funding guidelines for the ongoing programme year.", "strengths": ["Overcomes the model's fixed knowledge cutoff"], "limitations": ["Quality depends on the quality of the sources found — check citations"], "providers": "All major multimodal chatbots", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "f9": {"title": "Deep research", "tags": ["Multi-step research"], "shortDef": "A mode in which the chatbot independently runs several search steps and combines the results into a longer, source-based report.", "explain": "Unlike a simple web search, this mode plans the multi-step research itself — including follow-up questions, several search rounds, and a structured synthesis.", "usefulFor": "More extensive research questions with several sub-aspects.", "useCases": ["Creating a market overview of a new subject area", "Bundling several studies and sources on a question"], "example": "Creating a structured overview of current developments in AI-supported professional development formats.", "strengths": ["Considerably more thorough than a single search query"], "limitations": ["Takes more time than a simple web search", "Result still needs checking"], "providers": "e.g. OpenAI, Google, Anthropic (naming varies by provider)", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "f10": {"title": "Canvas and workspace modes", "tags": ["Shared document"], "shortDef": "A separate, editable document alongside the chat history, in which individual sections can be revised in a targeted way.", "explain": "Unlike normal chat, where every new answer reproduces the whole text again, a document persists here that you keep working on in a targeted way.", "usefulFor": "Longer texts or concepts that get refined over several steps.", "useCases": ["Revising individual paragraphs of a concept draft in a targeted way", "Having a document proofread jointly with the AI"], "example": "Setting up a workshop concept in a workspace and refining it section by section, without regenerating the whole text each time.", "strengths": ["Clearer than long chat histories for text work"], "limitations": ["Not available under the same name or to the same extent with every provider"], "providers": "e.g. OpenAI (Canvas), Anthropic (Artifacts)", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "f11": {"title": "Projects and project folders", "tags": ["Bundling context"], "shortDef": "A dedicated workspace where files, instructions, and chat histories on a topic are bundled together permanently.", "explain": "Unlike a single chat, the context here doesn't need to be re-supplied every time — it remains available permanently.", "usefulFor": "Recurring topics with consistent background knowledge, such as an ongoing course format or a client project.", "useCases": ["Bundling all materials for a course format in one place", "Permanently storing fixed instructions for a particular writing style"], "example": "Setting up a project for a recurring workshop format that permanently stores corporate-design guidelines and previous slide decks.", "strengths": ["No need to re-explain context every time", "Produces more consistent results over time"], "limitations": ["For sensitive content, deliberate handling of sharing and visibility is advisable"], "providers": "e.g. Anthropic (Projects), OpenAI (Projects), Mistral (projects in Vibe), Google (notebooks in NotebookLM)", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "f12": {"title": "Libraries and knowledge collections", "tags": ["Own sources"], "shortDef": "A permanent collection of your own documents that the chatbot can draw on specifically, rather than relying only on general knowledge.", "explain": "This function overlaps with Projects but focuses more on a pure source collection that is queried in a targeted way.", "usefulFor": "Subject areas with a clearly defined, growing document collection.", "useCases": ["Collecting all studies on a research topic in one place", "Making a growing collection of course materials queryable in a targeted way"], "example": "Storing all previous handouts for a recurring seminar topic in a collection and querying them specifically.", "strengths": ["Answers stay traceable to the stored sources"], "limitations": ["Requires upkeep so that outdated documents don't lead to outdated answers"], "providers": "e.g. Google NotebookLM, provider-specific knowledge collections", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "f13": {"title": "Projects as containers: knowledge base + instructions (formerly GPTs & Gems)", "tags": ["Knowledge base", "Instructions", "Limits"], "shortDef": "A \"container\" around the chat: uploaded knowledge, clearly set limits, and fixed working instructions in the background. Today this is mainly the project — the standalone assistants (custom GPTs, Gems) are being phased out.", "explain": "The container image describes three building blocks that frame and steer a chat: (1) knowledge that is uploaded and that the AI relies on, (2) limits on what it should and should not do, and (3) the working instructions that run invisibly in every conversation. For a long time there were dedicated assistants for this: custom GPTs in ChatGPT and Gems in Gemini. Both are now being replaced: OpenAI is retiring custom GPTs in December 2026 and moving them to plugins, and Google is converting Gems into skills from 17 November 2026. The container lives on in the project — in Claude, ChatGPT, Vibe (Mistral), and NotebookLM, each with a knowledge base and instructions. Reusable working instructions move into skills. The container remains the first level of automation: context no longer has to be re-explained in every chat.", "usefulFor": "Clearly defined, recurring topics that should always be handled on the same basis and in the same style — including by several people.", "useCases": ["Setting up a \"Course enquiries\" project with stored FAQs and fixed answering rules", "Setting up a project with corporate-design guidelines for slide-deck drafts", "A project that only formulates feedback on the basis of a stored competency model", "Saving existing GPTs or Gems before they are switched off: moving instructions and knowledge files into a project or a skill"], "example": "A \"Course enquiries\" project gets the course descriptions as knowledge, the limit \"no commitments on prices or dates that are not in the knowledge\", and the working instruction \"answer politely, in English, in at most 150 words\".", "strengths": ["Standardises recurring tasks", "No technical background needed", "Shareable within a team at most providers"], "limitations": ["Stays tied to its container — every new topic needs its own project", "Uploaded knowledge must be maintained, otherwise answers go out of date", "Custom GPTs and Gems are being retired: anyone still using them should save their content in time"], "providers": "Anthropic (projects), OpenAI (projects; custom GPTs until Dec 2026, then plugins), Google (NotebookLM notebooks; Gems become skills from 17 Nov 2026), Mistral (projects in Vibe)", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time.", "mistakes": ["Forgetting the limits: without them, the AI fills missing knowledge with guesses", "Packing too many different tasks into a single project"]}, "f14": {"title": "Agents and automations", "tags": ["Autonomy", "Multi-step"], "shortDef": "A mode in which the AI independently plans and carries out several steps of a task, instead of waiting for a new instruction after each step.", "explain": "Unlike normal chat, the AI makes intermediate decisions itself here — for instance which source to check next — which calls for more attentive oversight.", "usefulFor": "Multi-step tasks with a clearly defined goal and a checkable result.", "useCases": ["Having a multi-step research task carried out independently", "Having several files processed in a defined order"], "example": "Having a series of participant records processed independently according to a fixed scheme, with a final check by the user.", "strengths": ["Reduces manual intermediate effort for clearly defined workflows"], "limitations": ["Requires a clear task definition and a final human check", "Extra caution needed around permissions with sensitive data"], "providers": "e.g. Anthropic (Cowork), OpenAI (agent modes)", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "f15": {"title": "Automated workflows", "tags": ["Chaining", "Triggers"], "shortDef": "Automatically running recurring tasks via fixed triggers and chained steps, often via additional automation tools.", "explain": "This function goes beyond individual chat requests: a trigger — such as a new email or a new spreadsheet row — automatically starts a chain of AI-supported steps.", "usefulFor": "Regularly recurring workflows with a clearly defined trigger.", "useCases": ["Automatically drafting a confirmation email whenever a new course registration comes in", "Automating regular data reconciliation between two systems"], "example": "Automatically generating a draft attendance confirmation whenever a new entry appears in a registration table.", "strengths": ["Saves considerable time on recurring workflows"], "limitations": ["Requires careful setup and regular checks so errors don't propagate automatically"], "providers": "e.g. Make.com combined with AI services", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "c1": {"title": "Cowork in Claude", "tags": ["Files", "Agent-like"], "shortDef": "A work mode by Anthropic in which Claude independently carries out multi-step, file-based tasks — from research to a finished file.", "explain": "Unlike normal chat, Cowork can work across several tools and steps, such as reading, editing, and creating files, with confirmation at critical steps.", "usefulFor": "More extensive, multi-step assignments involving several files.", "useCases": ["Reviewing several documents of a project and producing a summary report from them", "Renaming and sorting a series of files according to a fixed scheme"], "example": "Reviewing all invoice documents for a course location and producing a structured billing overview as a file.", "strengths": ["Handles multi-step tasks without every single step needing to be triggered manually"], "limitations": ["Requires a clear task definition and a final check, especially for sensitive documents"], "providers": "Anthropic", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "c2": {"title": "Work and agent features in ChatGPT", "tags": ["Comparable mode"], "shortDef": "Comparable multi-step, agent-like work modes at OpenAI, with access to files, the web, and further tools.", "explain": "Here too: tasks are handled independently across several steps, with confirmation points for consequential actions.", "usefulFor": "Comparable multi-step tasks within the OpenAI environment.", "useCases": ["Running multi-step research followed by document creation"], "example": "Researching a market overview and summarising the results directly in a structured document.", "strengths": ["Reduces manual intermediate effort for clearly defined tasks"], "limitations": ["As with all agent modes: a final human check is necessary"], "providers": "OpenAI", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "c3": {"title": "Desktop apps", "tags": ["Local access"], "shortDef": "Standalone applications on your own computer that can work with local files, folders, and other programs more directly than a pure browser interface.", "explain": "Unlike the web interface in a browser, a desktop app often allows more direct access to local files and other open programs.", "usefulFor": "Work where direct access to local files and folders makes the process easier.", "useCases": ["Working directly with files in your own file system, without uploading them individually"], "example": "Browsing and editing a local folder structure of course materials directly via the desktop app.", "strengths": ["Closer integration with your own file system and other local programs"], "limitations": ["Requires installation and deliberate granting of access rights"], "providers": "e.g. Anthropic, OpenAI (each with its own desktop application)", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "c4": {"title": "Working with local files and folders", "tags": ["File access"], "shortDef": "A work mode in which the AI accesses an existing local folder structure directly, instead of uploading individual files manually.", "explain": "This makes tasks involving several related files easier, but requires a deliberate decision about which folder gets shared.", "usefulFor": "Tasks involving many related files, such as an entire project folder.", "useCases": ["Having all files in a course folder reviewed in one pass", "Renaming an existing folder structure according to a consistent scheme"], "example": "Reviewing a folder of old slide decks and assembling the relevant content for a new presentation.", "strengths": ["Efficient for tasks involving many related files"], "limitations": ["Requires a deliberate decision about which folders and files are shared, especially for confidential content"], "providers": "e.g. Anthropic, OpenAI (each with its own implementation)", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "c5": {"title": "Multi-step, agent-like tasks", "tags": ["No intermediate prompts"], "shortDef": "Tasks where the AI independently plans and carries out several consecutive steps, instead of waiting for a new instruction after each one.", "explain": "The difference from normal chat lies in the independence between steps — the user mainly steers at the start and the end, rather than triggering every intermediate step individually.", "usefulFor": "Clearly defined workflows with several sub-steps and a checkable end result.", "useCases": ["Processing a series of documents in a fixed sequence", "Running multi-step research followed by a summary"], "example": "Running a sequence of data checking, summarising, and creating a handover document in one pass.", "strengths": ["Reduces the number of manual intermediate steps for recurring workflows"], "limitations": ["Requires a clear task definition, otherwise errors can propagate across several steps"], "providers": "Model-independent, naming varies by provider", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "c6": {"title": "Permissions and access grants", "tags": ["Control", "Access"], "shortDef": "Before an agent or Cowork mode accesses files, folders, or external services, that access must be deliberately granted.", "explain": "These permissions determine what the AI may read, change, or send. They should be kept as narrow as possible and revoked again when no longer needed.", "usefulFor": "Any use of agent or Cowork modes with access to real files or services.", "useCases": ["Checking beforehand which folder actually needs to be shared for a task", "Revoking access again once a task is complete, if no longer needed"], "example": "Sharing only the relevant subfolder for a one-off analysis, instead of the entire drive.", "strengths": ["Deliberate handling of permissions considerably reduces the risk of unwanted access"], "limitations": ["Requires some familiarity with the sharing settings of the tool in use"], "providers": "Model-independent"}, "c7": {"title": "Privacy and user control", "tags": ["GDPR", "Sensitive data"], "shortDef": "For sensitive or personal data, users should deliberately decide what is shared with an AI system and what isn't.", "explain": "Not every task requires access to complete, unanonymised datasets — anonymised excerpts, or work without uploading sensitive original files, are often sufficient.", "usefulFor": "Any task involving personal, contractual, or otherwise sensitive data.", "useCases": ["Checking beforehand whether an anonymised version is sufficient", "Clarifying where uploaded data is processed and stored"], "example": "Uploading a participant list without names and contact details for a pattern analysis, instead of the full original file.", "strengths": ["Significantly reduces risk when working with sensitive information"], "limitations": ["Requires some extra effort for anonymisation or data checks beforehand"], "providers": "Model-independent"}, "c8": {"title": "Chat, project, skill, scheduled task, and agent compared", "tags": ["Orientation", "Choice"], "shortDef": "Five work modes with increasing independence: the single chat, the project with persistent context, the flexibly callable skill, the scheduled task that runs on a timer, and the agent or Cowork mode that acts on its own.", "explain": "The more independence a mode has, the more useful it is for recurring or extensive tasks — but the more care is needed around permissions and oversight.", "usefulFor": "Deciding which mode is appropriate for a specific task.", "useCases": ["A normal chat is enough for a one-off, simple question", "A project suits a recurring topic with stable context", "A skill suits recurring workflows needed across many chats", "A scheduled task suits routines that should run regularly without prompting", "An agent or Cowork suits multi-step, file-based tasks involving other tools"], "example": "Clarifying a one-off text question in normal chat, but bundling a recurring course format in a project instead.", "strengths": ["Helps choose the right, not over-sized, mode for each task"], "limitations": ["The boundaries between modes keep shifting as providers develop further"], "providers": "Model-independent", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "t18": {"title": "Qwen", "tags": ["China", "Open source", "Free"], "shortDef": "Multimodal chatbot and model family by the Chinese group Alibaba — free to use via Qwen Chat, with many models open and usable locally.", "explain": "Qwen ranges from very small models for single devices up to large frontier models (as of November 2026: Qwen3.8-Max; Qwen 4 has been announced but not yet released). The Qwen Chat web app understands text, images, and documents and is free. Many Qwen models are under an open licence and can run on your own computer, e.g. with Ollama — in that case, data never leaves your device.", "usefulFor": "Trying out a powerful chatbot for free and — for the technically inclined — running it locally without the cloud.", "useCases": ["Using a free second chatbot to compare answers", "Running an open Qwen model locally, e.g. for texts that should stay in-house", "Understanding or translating Chinese-language content"], "example": "Asking ChatGPT and Qwen the same question in parallel and comparing the answers to spot the strengths and blind spots of both models.", "strengths": ["Free to use", "Open models allow local operation", "Strong performance relative to cost"], "limitations": ["With Qwen Chat in the browser, data is processed on Alibaba servers — check before using it for work or sensitive content", "As a Chinese provider, it operates under different regulatory frameworks, which can show up on politically sensitive topics"], "mistakes": ["Confusing the web version with local operation: data stays on your own device only when run locally"], "providers": "Alibaba Cloud (Qwen Chat, open models)", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "f16": {"title": "Memory: what the chatbot remembers", "tags": ["Personalisation", "Context", "Privacy"], "shortDef": "With the memory feature, the chatbot remembers information about you and your work beyond individual conversations — such as your role, ongoing projects, or preferred formats.", "explain": "Without memory, every chat starts from zero. With memory, the chatbot can draw on earlier conversations or use saved facts, so answers fit you better. Depending on the provider, saved memories can be viewed, edited, and deleted, earlier chats can be searched, or memory can be switched off entirely. Memory differs from a project: memory applies to you in general, a project only to one topic.", "usefulFor": "Regular everyday use where you do not want to re-explain your role, context, and preferences every time.", "useCases": ["Telling the chatbot your role, audiences, and writing style once and benefiting permanently", "Picking up a conversation from last week without pasting everything again", "Setting preferences, e.g. \"always give me a short summary first\""], "example": "Saying once \"I train leaders in universities; please write without anglicisms\" — future drafts take this into account automatically.", "strengths": ["Saves repeated explanations", "Answers become more personal and better targeted"], "limitations": ["Saved information can go out of date or be wrong and should be checked occasionally", "Sensitive data does not belong in memory — for confidential topics, use a temporary chat without memory"], "mistakes": ["Not knowing what is stored: review and tidy saved memories regularly", "Mentioning confidential client data in passing, which then gets stored permanently"], "providers": "e.g. OpenAI, Anthropic, Google (scope and settings vary by provider)", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "a1": {"title": "Skills: instructions you can call up in any chat", "tags": ["Flexible", "Open standard", "Connectors"], "shortDef": "A skill is an extensive, saved set of instructions — with working instructions, content, knowledge, limits, and access to other tools where needed — that the chatbot can call up in any chat.", "explain": "While a project permanently frames a particular workspace, a skill is a new kind of flexibility: it waits in the background and is loaded as soon as a task fits or you call it directly — in any chat, even in the middle of an ongoing conversation. A skill can contain templates, examples, logos, or scripts and can drive other tools via connectors, for example saving a file to storage or creating an email draft. Several skills can be combined in one task. Skills have now become a cross-provider approach: they are based on an open format (SKILL.md) that, besides Claude, is also supported by Gemini, Vibe (Mistral), and Microsoft Copilot; in ChatGPT, skills are part of plugins. A skill you build once can therefore, in principle, be reused in other systems too.", "usefulFor": "Recurring workflows with fixed quality standards that are needed in very different conversations.", "useCases": ["A skill for certificates of attendance in your own design that pulls data from a spreadsheet", "An \"email reply\" skill containing templates, tone, and limits that creates a draft in the mailbox", "A branding skill that automatically styles every document in the corporate design", "Having the chatbot build a skill for you: \"Turn what we have just worked out into a skill\""], "example": "In the chat, this is enough: \"Create the certificates for the Valencia course.\" The skill knows the template, logo, and required details, reads the participant list via a connector, and delivers finished PDFs.", "strengths": ["Available in every chat, not tied to a project", "Bundles knowledge, templates, limits, and tools in one place", "Ensures consistent quality for recurring tasks", "Open format — transferable between providers"], "limitations": ["Requires careful drafting and testing at first", "Skills that drive other tools need suitable permissions — check results before sending"], "mistakes": ["Describing a skill too vaguely, so it is not reliably loaded at the right moment", "Never revising skills even though templates or processes have changed"], "providers": "Anthropic (Claude Skills), Google (skills in Gemini, successor to Gems), Mistral (skills in Vibe), Microsoft (skills in Copilot), OpenAI (skills as part of plugins)", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "a2": {"title": "Artifacts & sites: HTML as automation and visualisation", "tags": ["HTML", "Interactive", "Shareable"], "shortDef": "The chatbot produces finished, interactive web pages — overviews, calculators, quizzes, reference guides, small tools — that can be shared and reused. Depending on the level, they run inside the AI, with no AI at all, or with their own AI connection.", "explain": "A description in the chat becomes a standalone HTML page: an artifact in Claude, a site in ChatGPT, or via Canvas in Gemini. This is visualisation (content is presented vividly) and automation (once built, the page performs a task again and again) at the same time. Three levels can be distinguished:<br><br>(1) The artifact in Claude — it runs inside Claude and is shared via a link; this has the widest reach.<br>(2) The local HTML tool without AI — the page is downloaded as a file and runs in the browser, with no account and without data leaving the device.<br>(3) The \"smart\" artifact with an AI connection — either via Claude itself, via an interface (API) to an AI provider, or privacy-friendly via a local language model (e.g. with Ollama).<br><br>Interactive answers in the chat (such as Intelligent UI in ChatGPT) are something different: they help with understanding but stay in that chat and are not a standalone, shareable tool. This reference guide is itself an example: built as an artifact and published at a stable address.", "usefulFor": "Content and small tools that should be reused, shared, or explored interactively — without being able to code.", "useCases": ["An interactive reference guide as workshop documentation instead of a slide deck", "A small calculator, e.g. for funding amounts or scheduling — as a local file without AI", "A quiz or self-assessment for participants", "A tool that analyses texts with a local language model, so confidential content stays in-house"], "example": "\"Build me a page where participants assess their leadership styles with a self-test and see an evaluation at the end.\" Result: a finished, shareable web page.", "strengths": ["No coding skills needed", "Instantly shareable and reusable", "Combines content and clarity", "Level 2 and local AI enable tools with no data leaving the device"], "limitations": ["Test content and calculation logic before sharing", "Whether a shared link stays the same after changes depends on the provider and publishing route", "Building and using artifacts in Claude uses up quota — without your own account you quickly hit usage limits", "With ChatGPT Sites, viewers sometimes have to sign in"], "mistakes": ["Asking for too much at once instead of building the page step by step", "Building confidential data into a shared artifact"], "providers": "Anthropic (artifacts), OpenAI (Sites, Canvas), Google (Canvas); for level 3 locally e.g. Ollama", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "a3": {"title": "The automation ladder", "tags": ["Orientation", "Overview"], "shortDef": "Automation with AI can be thought of as a ladder with five levels: project, skill, artifact, connector, and finally the scheduled task or workflow — each level takes more work off your hands.", "explain": "Level 1, the project, frames chats with a knowledge base, limits, and working instructions. Level 2, the skill, makes such instructions callable in any chat. Level 3, the artifact, turns a result into a reusable, shareable tool for others. Level 4, the connector, links the AI to email, calendar, storage, and other tools so that skills and artifacts work with real work data. Level 5, the scheduled task or workflow, runs on a schedule or via triggers without any new chat. Not every task needs the top level: the higher you go, the more setup effort and the more important oversight becomes.", "usefulFor": "Deciding how much automation makes sense for a specific task.", "useCases": ["Answering course enquiries consistently → project", "Creating certificates in any chat → skill", "Giving participants a self-test tool → artifact", "Saving certificates directly to storage and sending them via an email draft → skill + connector", "Creating an overview of new registrations every Monday → scheduled task"], "example": "In a workshop, carry out the same task — e.g. analysing participant feedback — first in a normal chat, then in a project, then as a skill, and finally as a weekly scheduled task, and experience the difference.", "strengths": ["Creates orientation among many product names", "Helps weigh effort against benefit"], "limitations": ["The boundaries between levels blur because providers keep extending their features"], "providers": "Across providers"}, "k1": {"title": "Connectors: linking the AI with other tools", "tags": ["MCP", "Email & calendar", "Storage"], "shortDef": "Connectors link the chatbot with other applications — email, calendar, cloud storage, spreadsheets, project tools — so it can read information there and, with permission, act as well.", "explain": "Without a connector, the chatbot only knows what you paste into the chat. With a connector, it can search the mailbox for a message, check appointments, read files from storage, or create a draft. Technically, an open standard is increasingly used for this, the Model Context Protocol (MCP). In ChatGPT these links are called plugins — they now bundle connectors, skills, and reference material in one package. Connectors are the foundation that lets skills, scheduled tasks, and agents work with real work data.", "usefulFor": "Tasks that bring together information from several tools or should get something done there directly.", "useCases": ["\"Summarise all emails about course X from last week\"", "Finding a free slot for a preliminary meeting", "Reading and analysing a participant list from cloud storage"], "example": "\"Which enquiries about my courses came in this week, and which are still unanswered?\" — the chatbot searches the mailbox via the connector and lists the open items.", "strengths": ["No more copying between applications", "Foundation for skills and agents"], "limitations": ["The chatbot gains access to real, often confidential data — grant permissions deliberately and sparingly", "Always confirm actions such as sending or deleting beforehand"], "mistakes": ["Activating every available connector even though only one is needed"], "providers": "Anthropic (connectors/MCP), OpenAI (plugins with apps and skills), Google (connected apps), Microsoft (plugins in Copilot), Mistral", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "v1": {"title": "ElevenLabs", "tags": ["Text-to-speech", "Voices", "Voiceover"], "shortDef": "Specialist provider of AI voices: turning text into very natural-sounding speech, designing or cloning voices, and dubbing videos into other languages.", "explain": "ElevenLabs is considered one of the leading providers of synthetic speech. Text becomes voice recordings in many languages and voice types; your own voice can be recreated — with consent. There are also features for multilingual dubbing, sound effects, and talking assistants.", "usefulFor": "Professional voiceovers without a studio: explainer videos, e-learning, audio versions, multilingual content.", "useCases": ["Voicing an explainer video for a course", "Creating an audio version of a handout", "Dubbing an existing video into English or Spanish"], "example": "Paste the text of a course intro, choose a suitable voice, and place the audio file directly under a video made with Renderforest.", "strengths": ["Very natural-sounding voices", "Many languages", "Easy to use"], "limitations": ["Only clone real people's voices with their explicit consent", "Check usage rights and commercial use per plan"], "mistakes": ["Publishing voiced texts unchecked — verify the pronunciation of names and technical terms"], "providers": "ElevenLabs", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "v2": {"title": "NotebookLM: podcasts & video overviews from your own sources", "tags": ["Podcast", "Own sources", "Learning"], "shortDef": "NotebookLM automatically turns uploaded documents into a podcast-style conversation between two AI voices, as well as short video overviews.", "explain": "The audio overview summarises your own sources as a relaxed dialogue — listenable on the go, in English or other languages too. The content stays tied to the uploaded sources. The video overview presents the same content as a short explainer video with slides.", "usefulFor": "Learning and follow-up, especially for people who prefer listening to reading.", "useCases": ["Workshop materials as a podcast for participants to review afterwards", "Listening to a long study while commuting", "Preparing an introduction to a new topic as audio"], "example": "Upload all slides and handouts of a workshop and generate a ten-minute audio overview that participants can listen to after the course.", "strengths": ["Free to use", "Closely tied to your own sources", "Very low barrier to entry"], "limitations": ["The conversational format simplifies and can shift emphasis — spot-check the content", "Voices and style can only be controlled to a limited extent"], "mistakes": ["Passing on the podcast as a verified summary without having listened to it yourself"], "providers": "Google (NotebookLM)", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "t19": {"title": "SciSpace", "tags": ["Science", "Research agent", "Prompt builder"], "shortDef": "A very extensive research platform covering the entire chain of academic work — from literature search through analysis, data extraction, and visualisation to a cited draft. Easy to get into, but with great depth.", "explain": "At its core is the SciSpace agent, which works through multi-step research tasks on its own, drawing on numerous specialised tools and sources. Getting started is deliberately easy: a builder on the start page lets you assemble an assignment from buttons — the goal (e.g. report, literature overview), the tool or source (e.g. Deep Research, PubMed), and the output format (e.g. Word, PDF) — and SciSpace writes the prompt. Its real strength, however, lies in depth: deep-review searches across very many sources, systematic reviews with documented search steps, extraction of study data into tables, visualisation of results, chatting with individual papers, writing with citations, and checking tools such as an AI detector and AI-assisted peer review. This takes SciSpace well beyond Elicit, which stops at search, extraction, and synthesis.", "usefulFor": "Demanding academic research and writing projects in which literature work, analysis, visualisation, and text production come together in one environment.", "useCases": ["\"Write a report\" + \"Deep Research\" + \"Word document\": from research assignment straight to a cited report draft", "\"Literature overview\" + \"PubMed\" + \"PDF report\" as a solid entry point into a biomedical topic", "Extracting study data from many papers into a comparison table and visualising the results", "Having your own manuscript draft checked by AI peer review and the AI detector before submission"], "example": "Click literature overview, PubMed, and PDF report and add the topic \"resilience of early-career researchers\": the agent researches, analyses the hits, compares key findings in a table, and delivers a PDF report with sources that can then be edited further in the same tool.", "strengths": ["Covers the entire chain from search to draft", "Great depth in analysis, visualisation, and working with sources", "Despite its scope, an easy entry point via the prompt builder"], "limitations": ["The agent runs on a credit system; larger assignments use more of it", "AI detectors give probabilities, not proof — never use their results as the sole basis for assessments", "Agent-based research does not replace a reproducible systematic literature review to disciplinary standards", "The wide range of features takes time to learn in order to use it fully"], "mistakes": ["Adopting the finished report unchecked without looking at the cited sources yourself"], "providers": "SciSpace", "note": "Naming, availability, and feature scope can vary by provider, plan, region, platform, and time."}, "t20": {"title": "Elicit, SciSpace, or Consensus
